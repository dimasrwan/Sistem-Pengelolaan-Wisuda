<script>
    function showOnly(id) {
      ['landing-view','login-view','app-view'].forEach(function (viewId) {
        document.getElementById(viewId).classList.toggle('hidden', viewId !== id);
      });
      const sidebar = document.getElementById('sidebar');
      if (sidebar) sidebar.classList.remove('open');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (backdrop) backdrop.classList.remove('active');
      document.body.style.overflow = '';
      window.scrollTo(0, 0);
    }

    function resetLoginView() {
      const btn = document.getElementById('login-btn');
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Periksa Akun Google';
        btn.classList.remove('hidden');
      }
      const roleSelection = document.getElementById('role-selection');
      if (roleSelection) {
        roleSelection.innerHTML = '';
        roleSelection.classList.add('hidden');
      }
      const status = document.getElementById('login-status');
      if (status) {
        status.className = 'notice notice-info';
        status.textContent = 'Tekan tombol di bawah untuk memeriksa akun Google.';
      }
    }

    function openLogin() {
      stopScanner();
      showOnly('login-view');
      resetLoginView();
    }

    function showLanding() {
      stopScanner();
      showOnly('landing-view');
    }

    function checkLogin() {
      const btn = document.getElementById('login-btn');
      const status = document.getElementById('login-status');

      btn.disabled = true;
      btn.textContent = 'Memeriksa akun...';
      status.className = 'notice notice-info';
      status.textContent = 'Memeriksa akun Google dan hak akses...';

      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          btn.textContent = 'Periksa Akun Google';

          if (!result || !result.authenticated) {
            status.className = 'notice notice-error';
            status.textContent = (result && result.message) || 'Akun tidak dapat diverifikasi.';
            if (result && result.email) {
              status.textContent += ' Email terdeteksi: ' + result.email;
            }
            return;
          }

          if (result.requiresRoleSelection && Array.isArray(result.availableRoles) && result.availableRoles.length > 1) {
            showRoleSelection(result);
            return;
          }

          APP.session = result;
          loadDashboard(result.role);
        })
        .withFailureHandler(function (error) {
          btn.disabled = false;
          btn.textContent = 'Periksa Akun Google';
          status.className = 'notice notice-error';
          status.textContent = getErrorMessage(error);
        })
        .getSession();
    }

    function showRoleSelection(result) {
      const status = document.getElementById('login-status');
      const btn = document.getElementById('login-btn');
      const roleSelection = document.getElementById('role-selection');

      if (btn) btn.classList.add('hidden');

      status.className = 'notice notice-info';
      status.textContent = 'Akun Google Anda memiliki beberapa peran terdaftar. Silakan pilih peran yang ingin digunakan:';

      if (roleSelection) {
        roleSelection.classList.remove('hidden');
        let html = '<div style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">';
        result.availableRoles.forEach(function (role) {
          const roleLabel = role === 'Wisudawan'
            ? 'Masuk sebagai Wisudawan'
            : (role === 'Admin' ? 'Masuk sebagai Admin' : 'Masuk sebagai ' + role);
          html += '<button type="button" class="btn" style="width:100%; justify-content:center;" onclick="selectRole(\'' + escapeJs(role) + '\')">' +
            escapeHtml(roleLabel) +
            '</button>';
        });
        html += '<button type="button" class="btn btn-outline" style="width:100%; justify-content:center;" onclick="resetLoginView()">Batal</button>';
        html += '</div>';
        roleSelection.innerHTML = html;
      }
    }

    function selectRole(role) {
      const status = document.getElementById('login-status');
      const roleSelection = document.getElementById('role-selection');

      status.className = 'notice notice-info';
      status.textContent = 'Menyiapkan sesi sebagai ' + role + '...';

      if (roleSelection) {
        roleSelection.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      }

      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || !result.authenticated) {
            if (roleSelection) {
              roleSelection.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
            }
            status.className = 'notice notice-error';
            status.textContent = (result && result.message) || 'Gagal memilih peran.';
            return;
          }

          APP.session = result;
          loadDashboard(role);
        })
        .withFailureHandler(function (error) {
          if (roleSelection) {
            roleSelection.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
          }
          status.className = 'notice notice-error';
          status.textContent = getErrorMessage(error);
        })
        .getSession(role);
    }

    function switchRole() {
      openLogin();
      checkLogin();
    }

    function loadDashboard(targetRole) {
      google.script.run
        .withSuccessHandler(function (data) {
          if (!data || !data.session || !data.session.authenticated) {
            showOnly('login-view');
            return;
          }

          APP.dashboard = data;
          APP.session = data.session;
          showOnly('app-view');
          configureRole();

          navigate(APP.session.role === 'Panitia' ? 'scanner' : 'dashboard');
        })
        .withFailureHandler(function (error) {
          showOnly('login-view');
          const status = document.getElementById('login-status');
          status.className = 'notice notice-error';
          status.textContent = getErrorMessage(error);
        })
        .getDashboardData(targetRole);
    }

    function configureRole() {
      if (!APP.session) return;

      document.getElementById('top-role').textContent = APP.session.role;

      const switchBtn = document.getElementById('btn-switch-role');
      if (switchBtn) {
        const hasMultiple = APP.session.availableRoles && APP.session.availableRoles.length > 1;
        switchBtn.classList.toggle('hidden', !hasMultiple);
      }

      document.querySelectorAll('[data-roles]').forEach(function (element) {
        const roles = element.dataset.roles.split(',').map(function (value) {
          return value.trim();
        });
        element.classList.toggle('hidden', !roles.includes(APP.session.role));
      });
    }

    function navigate(page) {
      const role = APP.session && APP.session.role;
      const allowed = ALLOWED_PAGES[role] || [];

      if (!allowed.includes(page)) {
        showToast('Akses ke halaman tersebut tidak diizinkan.');

        if (role === 'Panitia' && APP.currentPage !== 'scanner') {
          navigate('scanner');
        } else if (role === 'Wisudawan' && APP.currentPage !== 'dashboard') {
          navigate('dashboard');
        } else if (role === 'Admin' && APP.currentPage !== 'dashboard') {
          navigate('dashboard');
        }
        return;
      }

      stopScanner();
      APP.currentPage = page;

      document.querySelectorAll('.side-link[data-page]').forEach(function (element) {
        const isActive = element.dataset.page === page || (page === 'import-students' && element.dataset.page === 'students');
        element.classList.toggle('active', isActive);
      });

      const sidebar = document.getElementById('sidebar');
      if (sidebar) sidebar.classList.remove('open');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (backdrop) backdrop.classList.remove('active');
      document.body.style.overflow = '';

      const target = document.getElementById('page-content');
      target.innerHTML = '<div class="panel panel-body">Memuat halaman...</div>';

      const renderers = {
        dashboard: renderDashboard,
        students: renderStudents,
        'import-students': renderImportStudents,
        calls: renderCalls,
        seats: renderSeats,
        best: renderBest,
        'guest-qr': renderGuestQr,
        scanner: renderScanner,
        'scanner-in': renderScanner,
        'scanner-out': renderScanner,
        guests: renderGuests,
        reports: renderReports
      };

      if (renderers[page]) {
        renderers[page]();
        initCustomSelects(target);
      } else {
        target.innerHTML = '<div class="panel panel-body">Halaman tidak ditemukan.</div>';
      }
    }

    function toggleMobileMenu(forceClose) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (!sidebar) return;

      const isCurrentlyOpen = sidebar.classList.contains('open');
      const shouldOpen = typeof forceClose === 'boolean' ? !forceClose : !isCurrentlyOpen;

      sidebar.classList.toggle('open', shouldOpen);
      if (backdrop) backdrop.classList.toggle('active', shouldOpen);
      if (window.innerWidth < 1024) {
        document.body.style.overflow = shouldOpen ? 'hidden' : '';
      }
    }

    window.addEventListener('resize', function () {
      if (window.innerWidth >= 1024) {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.remove('open');
        const backdrop = document.getElementById('sidebar-backdrop');
        if (backdrop) backdrop.classList.remove('active');
        document.body.style.overflow = '';
      }
    });

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const sidebar = document.getElementById('sidebar');
        if (sidebar && sidebar.classList.contains('open')) {
          toggleMobileMenu(true);
        }
      }
    });

    function pageHeader(title, description, action) {
      return '<div class="page-header"><div><div class="eyebrow">Portal Wisuda</div>' +
        '<h1>' + escapeHtml(title) + '</h1><p>' + escapeHtml(description) +
        '</p></div>' + (action || '') + '</div>';
    }

    function periodLabel() {
      const period = APP.dashboard && APP.dashboard.period;
      if (!period) return 'Informasi periode belum tersedia';

      return [period.name, period.wave ? 'Gel. ' + period.wave : '', period.year]
        .filter(Boolean).join(' · ');
    }

    function renderDashboard() {
      const role = APP.session.role;
      const data = APP.dashboard || {};
      const content = document.getElementById('page-content');

      if (role === 'Panitia') {
        navigate('scanner');
        return;
      }

      if (role === 'Wisudawan') {
        const student = data.student;
        const call = (data.callList || [])[0] || {};
        const seat = (data.seats || [])[0] || {};

        content.innerHTML =
          pageHeader('Dashboard Wisudawan', 'Informasi pribadi dan pelaksanaan wisuda.') +
          '<div class="notice notice-info">' + escapeHtml(periodLabel()) + '</div>' +
          (student
            ? '<div class="panel"><div class="panel-head"><h2>Informasi Wisudawan</h2>' +
              '<span class="badge badge-green">Data ditemukan</span></div>' +
              '<div class="panel-body"><div class="student-card">' +
              detailBox('Nama lengkap', value(student,['Nama_Lengkap','Nama'])) +
              detailBox('NIM', value(student,['NIM'])) +
              detailBox('Fakultas', value(student,['Fakultas'])) +
              detailBox('Program studi', value(student,['Program_Studi','Program Studi'])) +
              detailBox('Urutan panggil', value(call,['Urutan_Panggil','Urutan','Urutan_Kursi','No','no'])) +
              detailBox('Kode kursi', value(seat,['Nomor_Kursi','Kode_Kursi','Kursi','nomorKursi'])) +
              '</div></div></div>'
            : '<div class="notice notice-warn">Data pribadi belum terhubung ke akun ini. Admin perlu mengisi ID_Wisudawan pada sheet PENGGUNA.</div>') +
          '<div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Periode Wisuda</h2></div>' +
          '<div class="panel-body">' + escapeHtml(periodLabel()) + '</div></div>';
        return;
      }

      const stats = data.stats || {};

      content.innerHTML =
        pageHeader('Dashboard Admin', 'Ringkasan pengelolaan wisuda dan akses cepat.') +
        '<div class="notice notice-info">' + escapeHtml(periodLabel()) + '</div>' +
        '<div class="stat-grid">' +
          statCard('Total wisudawan',stats.totalStudents || 0,'Data induk') +
          statCard('Daftar panggil',stats.totalCalls || 0,'Data pemanggilan') +
          statCard('Data kursi',stats.totalSeats || 0,'Data denah kursi') +
          statCard('Lulusan terbaik',stats.totalBestGraduates || 0,'Data per fakultas') +
        '</div>' +
        '<div class="panel"><div class="panel-head"><h2>Akses cepat</h2></div>' +
        '<div class="panel-body"><div class="toolbar">' +
          '<button class="btn btn-outline" onclick="navigate(\'students\')">Data Wisudawan</button>' +
          '<button class="btn btn-outline" onclick="navigate(\'calls\')">Daftar Panggil</button>' +
          '<button class="btn btn-outline" onclick="navigate(\'seats\')">Denah Kursi</button>' +
          '<button class="btn btn-outline" onclick="navigate(\'scanner\')">Scan QR Tamu</button>' +
          '<button class="btn btn-outline" onclick="navigate(\'reports\')">Laporan</button>' +
        '</div></div></div>' +
        '<div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Informasi Sistem</h2></div>' +
        '<div class="panel-body" style="color:var(--muted)">Data dibaca dari Google Spreadsheet yang terhubung. Pastikan data sumber sudah diverifikasi sebelum digunakan untuk operasional resmi.</div></div>';
    }

    function statCard(label, number, foot) {
      return '<div class="stat-card"><div class="stat-label">' + escapeHtml(label) +
        '</div><strong>' + Number(number || 0).toLocaleString('id-ID') +
        '</strong><div class="stat-foot">' + escapeHtml(foot) + '</div></div>';
    }

    function detailBox(label, val) {
      return '<div class="detail-box"><span>' + escapeHtml(label) + '</span><strong>' +
        escapeHtml(val || 'Belum tersedia') + '</strong></div>';
    }

    function value(row, candidates) {
      if (!row) return '';

      const keys = Object.keys(row);

      for (const candidate of candidates) {
        const key = keys.find(function (name) {
          return name.toLowerCase() === candidate.toLowerCase();
        });

        if (key !== undefined && String(row[key]).trim()) return row[key];
      }

      return '';
    }

    /* =========================================================
       GLOBAL CUSTOM DROPDOWN COMPONENT (UIN AR-RANIRY THEME)
       ========================================================= */
    if (typeof escapeHtml !== 'function') {
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    }

    if (typeof escapeAttr !== 'function') {
      function escapeAttr(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
    }

    function closeAllCustomSelects() {
      document.querySelectorAll('.custom-select-menu.open').forEach(function(m) {
        m.classList.remove('open');
      });
      document.querySelectorAll('.custom-select-trigger.open').forEach(function(t) {
        t.classList.remove('open', 'active');
        t.setAttribute('aria-expanded', 'false');
      });
    }

    function navigateCustomSelectMenu(menu, direction) {
      const options = Array.from(menu.querySelectorAll('.custom-select-option:not(.disabled)'));
      if (!options.length) return;
      let focusedIdx = options.findIndex(function(opt) {
        return opt.classList.contains('focused');
      });
      if (focusedIdx === -1) {
        focusedIdx = options.findIndex(function(opt) {
          return opt.classList.contains('selected');
        });
      }
      if (focusedIdx === -1) {
        focusedIdx = direction > 0 ? 0 : options.length - 1;
      } else {
        focusedIdx = (focusedIdx + direction + options.length) % options.length;
      }
      options.forEach(function(opt) { opt.classList.remove('focused'); });
      const target = options[focusedIdx];
      target.classList.add('focused');
      target.scrollIntoView({ block: 'nearest' });
    }

    function syncCustomSelect(selectOrId) {
      const select = (typeof selectOrId === 'string') ? document.getElementById(selectOrId) : selectOrId;
      if (!select || select.tagName !== 'SELECT') return;
      if (select.multiple || select.size > 1 || select.classList.contains('no-custom-select')) return;

      if (!select.id) {
        select.id = 'select-' + Math.random().toString(36).slice(2, 9);
      }
      const selectId = select.id;

      let wrapper = select.closest('.custom-select-wrapper');
      if (!wrapper) {
        wrapper = document.createElement('div');
        wrapper.className = 'custom-select-wrapper';

        if (select.id === 'student-page-size' || select.classList.contains('field-sm') || select.style.width === 'auto') {
          wrapper.classList.add('custom-select-compact');
        }

        if (select.style.minWidth) {
          wrapper.style.minWidth = select.style.minWidth;
        }
        if (select.style.width && select.style.width !== 'auto' && select.style.width !== '100%') {
          wrapper.style.width = select.style.width;
        }

        if (select.parentNode) {
          select.parentNode.insertBefore(wrapper, select);
        }
        wrapper.appendChild(select);
      }

      select.classList.add('custom-select-native');
      select.setAttribute('tabindex', '-1');
      select.setAttribute('aria-hidden', 'true');

      let trigger = wrapper.querySelector('.custom-select-trigger');
      let menu = wrapper.querySelector('.custom-select-menu');

      if (!trigger) {
        trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.id = 'trigger-' + selectId;
        trigger.className = 'custom-select-trigger';
        trigger.setAttribute('aria-haspopup', 'listbox');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-controls', 'menu-' + selectId);

        let accessibleLabel = '';
        const explicitLabel = document.querySelector('label[for="' + selectId + '"]');
        if (explicitLabel) {
          accessibleLabel = explicitLabel.textContent.trim();
        } else {
          const parentLabel = select.closest('label');
          if (parentLabel) {
            accessibleLabel = parentLabel.textContent.replace(select.textContent, '').trim();
          } else if (wrapper.parentElement) {
            const prevLabel = wrapper.parentElement.querySelector('label');
            if (prevLabel) accessibleLabel = prevLabel.textContent.trim();
          }
        }
        if (accessibleLabel) {
          trigger.setAttribute('aria-label', accessibleLabel);
        }

        if (select.style.fontWeight) {
          trigger.style.fontWeight = select.style.fontWeight;
        }

        trigger.innerHTML = '<span class="custom-select-label"></span>' +
          '<svg class="custom-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="6 9 12 15 18 9"></polyline></svg>';
        wrapper.appendChild(trigger);

        menu = document.createElement('div');
        menu.id = 'menu-' + selectId;
        menu.className = 'custom-select-menu';
        menu.setAttribute('role', 'listbox');
        menu.setAttribute('aria-labelledby', trigger.id);
        wrapper.appendChild(menu);

        trigger.addEventListener('click', function(e) {
          if (e && e.stopPropagation) e.stopPropagation();
          if (trigger.disabled) return;
          const isOpen = menu.classList.contains('open');
          closeAllCustomSelects();
          if (!isOpen) {
            menu.classList.add('open');
            trigger.classList.add('open', 'active');
            trigger.setAttribute('aria-expanded', 'true');
            menu.querySelectorAll('.custom-select-option.focused').forEach(function(el) {
              el.classList.remove('focused');
            });
            const activeItem = menu.querySelector('.custom-select-option.selected') || menu.querySelector('.custom-select-option');
            if (activeItem) {
              activeItem.classList.add('focused');
              activeItem.scrollIntoView({ block: 'nearest' });
            }
          }
        });

        trigger.addEventListener('keydown', function(e) {
          if (trigger.disabled) return;
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!menu.classList.contains('open')) {
              trigger.click();
            } else {
              navigateCustomSelectMenu(menu, e.key === 'ArrowUp' ? -1 : 1);
            }
          } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (!menu.classList.contains('open')) {
              trigger.click();
            } else {
              const focused = menu.querySelector('.custom-select-option.focused');
              if (focused) focused.click();
            }
          } else if (e.key === 'Escape') {
            if (menu.classList.contains('open')) {
              e.preventDefault();
              closeAllCustomSelects();
            }
          } else if (e.key === 'Tab') {
            closeAllCustomSelects();
          } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            const char = e.key.toLowerCase();
            const options = Array.from(menu.querySelectorAll('.custom-select-option:not(.disabled)'));
            const match = options.find(function(opt) {
              return opt.textContent.trim().toLowerCase().startsWith(char);
            });
            if (match) {
              if (!menu.classList.contains('open')) {
                menu.classList.add('open');
                trigger.classList.add('open', 'active');
                trigger.setAttribute('aria-expanded', 'true');
              }
              options.forEach(function(o) { o.classList.remove('focused'); });
              match.classList.add('focused');
              match.scrollIntoView({ block: 'nearest' });
            }
          }
        });
      }

      menu.innerHTML = '';
      const currentVal = select.value;
      let selectedLabel = '';
      let isPlaceholder = false;

      function renderOption(opt, isUnderGroup) {
        const item = document.createElement('div');
        item.className = 'custom-select-option' + (isUnderGroup ? ' is-grouped' : '');
        item.setAttribute('role', 'option');
        item.dataset.value = opt.value;
        if (opt.disabled) {
          item.classList.add('disabled');
          item.setAttribute('aria-disabled', 'true');
        }
        const isSelected = (opt.value === currentVal || (!currentVal && opt.selected));
        if (isSelected && !selectedLabel) {
          item.classList.add('selected');
          item.setAttribute('aria-selected', 'true');
          selectedLabel = opt.textContent;
          if (!opt.value) isPlaceholder = true;
        } else {
          item.setAttribute('aria-selected', 'false');
        }
        if (!opt.value) {
          item.classList.add('is-placeholder');
        }

        item.innerHTML = '<span class="custom-select-option-text">' + escapeHtml(opt.textContent) + '</span>' +
          '<svg class="custom-select-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="20 6 9 17 4 12"></polyline></svg>';

        item.addEventListener('click', function(e) {
          if (e && e.stopPropagation) e.stopPropagation();
          if (opt.disabled) return;
          select.value = opt.value;
          closeAllCustomSelects();
          syncCustomSelect(select);
          const evt = new Event('change', { bubbles: true });
          select.dispatchEvent(evt);
          if (trigger && trigger.focus) trigger.focus();
        });

        item.addEventListener('mouseenter', function() {
          if (opt.disabled) return;
          menu.querySelectorAll('.custom-select-option.focused').forEach(function(el) {
            el.classList.remove('focused');
          });
          item.classList.add('focused');
        });

        menu.appendChild(item);
      }

      Array.from(select.children).forEach(function(child) {
        if (child.tagName === 'OPTGROUP') {
          const header = document.createElement('div');
          header.className = 'custom-select-group-header';
          header.textContent = (child.label || '').replace(/\\'/g, "'");
          menu.appendChild(header);

          Array.from(child.children).forEach(function(opt) {
            renderOption(opt, true);
          });
        } else if (child.tagName === 'OPTION') {
          renderOption(child, false);
        }
      });

      if (!selectedLabel && select.options && select.options.length > 0) {
        selectedLabel = select.options[0].textContent;
        isPlaceholder = !select.options[0].value;
      }

      const labelEl = trigger.querySelector('.custom-select-label');
      if (labelEl) {
        labelEl.textContent = selectedLabel || '';
      }
      trigger.classList.toggle('is-placeholder', Boolean(isPlaceholder));
      trigger.disabled = Boolean(select.disabled);
      trigger.classList.toggle('disabled', Boolean(select.disabled));
    }

    function initCustomSelects(container) {
      const root = container || document;
      const selects = root.querySelectorAll('select:not(.custom-select-native):not(.no-custom-select)');
      selects.forEach(function(sel) {
        syncCustomSelect(sel);
      });
    }

    if (!window._customSelectListenerAdded) {
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.custom-select-wrapper')) {
          closeAllCustomSelects();
        }
      });
      window._customSelectListenerAdded = true;
    }
</script>
