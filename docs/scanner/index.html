<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07851b">
  <title>Pemindai QR Tamu Wisuda | UIN Ar-Raniry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --primary: #07851b;
      --primary-dark: #045a12;
      --primary-light: #e6f4e8;
      --ink: #111827;
      --muted: #4b5563;
      --line: #d1d5db;
      --canvas: #f8faf8;
      --white: #ffffff;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --info: #0284c7;
      --info-light: #f0f9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .scanner-app-card {
      width: 100%;
      max-width: 490px;
      background: var(--white);
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .app-title-wrap {
      flex: 1;
      min-width: 0;
    }
    .app-title {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.25;
    }
    .app-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Connection Status */
    .connection-banner {
      padding: 9px 16px;
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }
    .conn-online {
      background: var(--success-light);
      color: var(--success);
      border-color: #bbf7d0;
    }
    .conn-standalone {
      background: var(--warning-light);
      color: var(--warning);
      border-color: #fde68a;
    }

    /* Camera Viewport */
    .viewport-section {
      padding: 16px 20px 12px;
    }
    .camera-box {
      position: relative;
      background: #0f1710;
      border-radius: 14px;
      overflow: hidden;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.4);
    }
    #reader {
      width: 100% !important;
      border: none !important;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
      border-radius: 14px;
    }

    /* Viewfinder Guidelines */
    .viewfinder-guide {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .viewfinder-box {
      width: 210px;
      height: 210px;
      border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      transition: border-color 0.25s, transform 0.25s;
    }
    .viewfinder-box.scanned {
      border-color: #22c55e;
      transform: scale(1.03);
    }
    .viewfinder-box.locked {
      border-color: #eab308;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
    }
    .viewfinder-box::before,
    .viewfinder-box::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #4ade80;
      border-style: solid;
    }
    .viewfinder-box::before {
      top: -2px; left: -2px;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 10px;
    }
    .viewfinder-box::after {
      bottom: -2px; right: -2px;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 10px;
    }
    .viewfinder-label {
      margin-top: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.2px;
      transition: background 0.2s, color 0.2s;
    }

    /* Live Backend Transaction Result Card */
    .result-box-container {
      margin-top: 12px;
    }
    .result-card {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid transparent;
      animation: fadeIn 0.25s ease-out;
    }
    .result-header {
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-body {
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.45;
    }
    .result-meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .result-meta-label {
      color: var(--muted);
      font-weight: 600;
    }
    .result-meta-val {
      font-weight: 700;
      color: var(--ink);
    }

    /* Card Themes */
    .card-entry {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .card-entry .result-header {
      background: #dcfce7;
      color: #15803d;
      border-bottom: 1px solid #bbf7d0;
    }
    .card-exit {
      background: #f0f9ff;
      border-color: #7dd3fc;
    }
    .card-exit .result-header {
      background: #e0f2fe;
      color: #0369a1;
      border-bottom: 1px solid #bae6fd;
    }
    .card-error {
      background: #fef2f2;
      border-color: #fca5a5;
    }
    .card-error .result-header {
      background: #fee2e2;
      color: #991b1b;
      border-bottom: 1px solid #fecaca;
    }
    .card-pending {
      background: #fffbeb;
      border-color: #fde68a;
    }
    .card-pending .result-header {
      background: #fef3c7;
      color: #92400e;
      border-bottom: 1px solid #fde68a;
    }
    .card-unconfirmed {
      background: #fffbeb;
      border-color: #f59e0b;
    }
    .card-unconfirmed .result-header {
      background: #fef3c7;
      color: #b45309;
      border-bottom: 1px solid #fde68a;
    }

    /* Controls */
    .controls-section {
      padding: 0 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .camera-select-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .camera-select-wrap label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select.camera-select {
      width: 100%;
      height: 40px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #ffffff;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }
    .btn-outline {
      background: #ffffff;
      color: var(--ink);
      border-color: var(--line);
    }
    .btn-outline:hover:not(:disabled) {
      background: #f3f4f6;
    }
    .btn-danger-outline {
      background: #ffffff;
      color: var(--danger);
      border-color: #fca5a5;
    }

    /* Scan History */
    .history-section {
      padding: 14px 20px 16px;
      border-top: 1px solid var(--line);
      background: #fbfdfa;
    }
    .history-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      padding: 7px 10px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 11.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-badge {
      font-weight: 800;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-right: 6px;
    }
    .badge-in {
      background: #dcfce7;
      color: #15803d;
    }
    .badge-out {
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge-err {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-warn {
      background: #fef3c7;
      color: #b45309;
    }
    .history-time {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <main class="scanner-app-card" role="main">
    <!-- Header -->
    <header class="app-header">
      <img class="app-logo" src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Logo_UIN_Ar-Raniry.png" alt="Logo UIN Ar-Raniry" onerror="this.src='https://ar-raniry.ac.id/wp-content/uploads/2023/02/cropped-logo-uin-192x192.png'">
      <div class="app-title-wrap">
        <h1 class="app-title">Pemindai QR Undangan Tamu</h1>
        <div class="app-sub">Sistem Pengelolaan Wisuda UIN Ar-Raniry</div>
      </div>
    </header>

    <!-- Connection Status Banner -->
    <div id="conn-banner" class="connection-banner conn-standalone">
      <span id="conn-text">Memeriksa koneksi ke aplikasi utama...</span>
      <span id="conn-badge" style="font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,0.06);">Standby</span>
    </div>

    <!-- Camera Viewport -->
    <section class="viewport-section" aria-label="Area Kamera">
      <div class="camera-box">
        <div id="reader"></div>
        <div class="viewfinder-guide" id="viewfinder">
          <div class="viewfinder-box" id="viewfinder-box"></div>
          <div class="viewfinder-label" id="viewfinder-label">Arahkan QR Code ke dalam kotak</div>
        </div>
      </div>

      <!-- Real Backend Result Box -->
      <div id="result-box-container" class="result-box-container">
        <!-- Default Idle Instruction -->
        <div id="status-card-idle" class="result-card card-entry" style="background:#fcfdfa;border-color:#e2ebe1;">
          <div class="result-body" style="text-align:center;color:var(--muted);padding:10px;">
            <span id="idle-instruction-text">🟢 Kamera aktif. Hadapkan QR undangan tamu ke kotak kamera.</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls-section">
      <div class="camera-select-wrap">
        <label for="camera-select">Pilih Kamera</label>
        <select id="camera-select" class="camera-select" onchange="onCameraSelectChange()">
          <option value="environment">Kamera Belakang (Utama)</option>
          <option value="user">Kamera Depan</option>
        </select>
      </div>

      <div class="btn-row">
        <button id="btn-start" class="btn btn-primary" onclick="startScanner()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Aktifkan</span>
        </button>
        <button id="btn-stop" class="btn btn-outline" onclick="stopScanner()" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"></rect></svg>
          <span>Hentikan</span>
        </button>
      </div>

      <button class="btn btn-danger-outline" onclick="closeScannerWindow()" style="height:36px;font-size:12px;">
        <span>✕ Tutup Jendela Pemindai</span>
      </button>
    </section>

    <!-- Scan History List -->
    <section class="history-section">
      <div class="history-title">Riwayat Transaksi Presensi (Sesi Ini)</div>
      <div id="history-list" class="history-list">
        <div style="color:var(--muted);font-size:11.5px;font-style:italic;">Belum ada QR yang diproses.</div>
      </div>
    </section>
  </main>

  <script>
    // State management
    let html5QrCode = null;
    let isScanning = false;
    let activeLockedCode = null;          // QR yang saat ini terkunci di depan kamera
    let lastSeenTimestamp = 0;            // Timestamp terakhir kali QR terdeteksi di kamera
    let isProcessingTransaction = false;  // Sedang menunggu konfirmasi server
    let pendingRequestId = null;          // Correlation ID transaksi aktif
    let pendingPayload = null;            // Payload QR transaksi aktif
    let pendingTransactionTimer = null;   // Timer 10 detik deteksi timeout
    let targetOrigin = null;
    let audioCtx = null;
    const recentScans = [];

    // Parse target origin from query parameter (?parentOrigin=...)
    (function initOrigin() {
      const params = new URLSearchParams(window.location.search);
      const rawOrigin = params.get('parentOrigin');
      if (rawOrigin) {
        try {
          const parsed = new URL(rawOrigin);
          targetOrigin = parsed.origin;
        } catch (e) {
          console.warn('Invalid parentOrigin URL param:', rawOrigin);
        }
      }

      // Check opener relationship
      const banner = document.getElementById('conn-banner');
      const text = document.getElementById('conn-text');
      const badge = document.getElementById('conn-badge');

      if (window.opener && !window.opener.closed) {
        banner.className = 'connection-banner conn-online';
        text.innerHTML = '🟢 <strong>Terhubung</strong> ke Sistem Pengelolaan Wisuda';
        badge.textContent = 'Induk Aktif';

        // Notify parent that scanner is ready
        sendToParent({
          type: 'UIN_ARRANIRY_SCANNER_READY',
          timestamp: Date.now()
        });
      } else {
        banner.className = 'connection-banner conn-standalone';
        text.innerHTML = '🟡 Mode Mandiri (Buka dari aplikasi untuk mencatat presensi)';
        badge.textContent = 'Stand-alone';
      }
    })();

    // Setup listener for incoming messages from Parent Window (GAS Web App)
    window.addEventListener('message', function (event) {
      // Validate origin if targetOrigin is configured
      if (targetOrigin && event.origin !== targetOrigin) {
        const isGoogle = event.origin.endsWith('script.google.com') ||
                         event.origin.endsWith('script.googleusercontent.com');
        if (!isGoogle) {
          console.warn('[Security] Diabaikan pesan dari origin asing:', event.origin);
          return;
        }
      }

      const data = event.data;
      if (!data || typeof data !== 'object') return;

      // 1. ACK received from parent
      if (data.type === 'UIN_ARRANIRY_SCAN_ACK') {
        if (!pendingRequestId || data.requestId === pendingRequestId) {
          const lbl = document.getElementById('viewfinder-label');
          if (lbl) lbl.textContent = '🔄 2/2 Diterima Induk — Memvalidasi di Google Sheets...';
        }
        return;
      }

      // 2. REAL BACKEND RESULT RECEIVED
      if (data.type === 'UIN_ARRANIRY_SCAN_RESULT') {
        // Cocokkan correlation ID requestId jika tersedia
        if (pendingRequestId && data.requestId && data.requestId !== pendingRequestId) {
          console.warn('[CorrelationID] Mengabaikan respons lama:', data.requestId, 'Expected:', pendingRequestId);
          return;
        }

        // Hentikan timer timeout transaksi
        clearPendingTimer();
        isProcessingTransaction = false;
        pendingRequestId = null;
        pendingPayload = null;

        renderBackendResult(data.result);
      }
    });

    function clearPendingTimer() {
      if (pendingTransactionTimer) {
        clearTimeout(pendingTransactionTimer);
        pendingTransactionTimer = null;
      }
    }

    // Penanganan timeout jika server tidak merespons dalam 10 detik
    function onTransactionTimeout() {
      clearPendingTimer();
      isProcessingTransaction = false;

      const vfBox = document.getElementById('viewfinder-box');
      const vfLabel = document.getElementById('viewfinder-label');
      if (vfBox) vfBox.classList.add('locked');
      if (vfLabel) vfLabel.textContent = '⚠️ Transaksi Belum Terkonfirmasi';

      playBeep('error');

      const container = document.getElementById('result-box-container');
      const reqDisplay = pendingRequestId || '—';
      const codeDisplay = pendingPayload || '—';

      container.innerHTML = `
        <div class="result-card card-unconfirmed">
          <div class="result-header">
            <span>⚠️</span>
            <span>TRANSAKSI BELUM TERKONFIRMASI</span>
          </div>
          <div class="result-body">
            <div style="font-weight:700;margin-bottom:6px;color:#92400e;">
              Server belum memberikan konfirmasi akhir dalam 10 detik.
            </div>
            <div class="result-meta-row">
              <span class="result-meta-label">ID Transaksi</span>
              <span class="result-meta-val" style="font-family:monospace;font-size:11px;">${escapeHtml(reqDisplay)}</span>
            </div>
            <div class="result-meta-row">
              <span class="result-meta-label">Kode QR</span>
              <span class="result-meta-val" style="font-family:monospace;font-size:11px;">${escapeHtml(codeDisplay)}</span>
            </div>
            <div style="font-size:11.5px;color:var(--muted);margin:8px 0;line-height:1.4;">
              Data mungkin telah tersimpan di Google Sheets. Periksa status transaksi sebelum memindai ulang untuk mencegah kesalahan status.
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="btn btn-primary" onclick="checkCurrentTransactionStatus()" style="flex:1;height:38px;font-size:12px;">
                🔍 Periksa Status Transaksi
              </button>
              <button class="btn btn-outline" onclick="resetPendingTransaction()" style="flex:1;height:38px;font-size:12px;">
                ↻ Reset Pemindai
              </button>
            </div>
          </div>
        </div>
      `;

      addHistory('BELUM TERKONFIRMASI', 'badge-warn', codeDisplay);
    }

    // Memeriksa status transaksi saat ini ke server dengan requestId yang sama
    function checkCurrentTransactionStatus() {
      if (!pendingRequestId && !activeLockedCode) {
        resetPendingTransaction();
        return;
      }

      const reqId = pendingRequestId || '';
      const payload = pendingPayload || activeLockedCode || '';

      const vfLabel = document.getElementById('viewfinder-label');
      if (vfLabel) vfLabel.textContent = '🔄 Menghubungi server untuk cek status...';

      // Set timer singkat untuk respon periksa status (6s)
      clearPendingTimer();
      pendingTransactionTimer = setTimeout(function () {
        clearPendingTimer();
        if (vfLabel) vfLabel.textContent = '⚠️ Status Masih Belum Terkonfirmasi';
      }, 6000);

      sendToParent({
        type: 'UIN_ARRANIRY_CHECK_TX',
        requestId: reqId,
        payload: payload,
        timestamp: Date.now()
      });
    }

    // Reset paksa keadaan pemindai
    function resetPendingTransaction() {
      clearPendingTimer();
      isProcessingTransaction = false;
      pendingRequestId = null;
      pendingPayload = null;
      activeLockedCode = null;

      const vfBox = document.getElementById('viewfinder-box');
      const vfLabel = document.getElementById('viewfinder-label');
      if (vfBox) {
        vfBox.classList.remove('locked');
        vfBox.classList.remove('scanned');
      }
      if (vfLabel) {
        vfLabel.textContent = '🟢 Kamera Siap — Arahkan QR Code';
      }

      const container = document.getElementById('result-box-container');
      container.innerHTML = `
        <div class="result-card card-entry" style="background:#fcfdfa;border-color:#e2ebe1;">
          <div class="result-body" style="text-align:center;color:var(--muted);padding:10px;">
            <span>🟢 Pemindai di-reset. Hadapkan QR undangan tamu ke kotak kamera.</span>
          </div>
        </div>
      `;
    }

    // Sound beep helper using Web Audio API
    function playBeep(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'exit') {
          // Double chime descending for check-out (E5 -> C5)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(523.25, now + 0.1);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'error') {
          // Low buzz for rejection/error
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          // Cheerful chime ascending for check-in (A5 -> C6)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1046.5, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {}

      if (navigator.vibrate) {
        try { navigator.vibrate(type === 'error' ? [120, 80, 120] : 80); } catch (e) {}
      }
    }

    // Safely send message to opener
    function sendToParent(msg) {
      if (!window.opener || window.opener.closed) return false;
      try {
        const dest = targetOrigin || '*';
        window.opener.postMessage(msg, dest);
        return true;
      } catch (e) {
        console.error('Error posting message to opener:', e);
        return false;
      }
    }

    // Render backend result onto scanner UI
    function renderBackendResult(res) {
      if (!res) return;

      const container = document.getElementById('result-box-container');
      const vfBox = document.getElementById('viewfinder-box');
      const vfLabel = document.getElementById('viewfinder-label');

      const isEntry = res.resultCode === 'BERHASIL_MASUK';
      const isExit = res.resultCode === 'BERHASIL_KELUAR';
      const isStatusInside = res.resultCode === 'STATUS_DI_DALAM';
      const isStatusOutside = res.resultCode === 'STATUS_DI_LUAR';
      const isSuccess = res.success && (isEntry || isExit || isStatusInside || isStatusOutside);

      // Play appropriate sound
      if (isExit || isStatusOutside) {
        playBeep('exit');
      } else if (isEntry || isStatusInside) {
        playBeep('entry');
      } else {
        playBeep('error');
      }

      // Card styling
      let cardClass = 'card-error';
      let icon = '✕';
      if (isEntry || isStatusInside) {
        cardClass = 'card-entry';
        icon = '✓';
      } else if (isExit || isStatusOutside) {
        cardClass = 'card-exit';
        icon = '✓';
      }

      let studentRows = '';
      if (res.student) {
        const s = res.student;
        studentRows = `
          <div class="result-meta-row">
            <span class="result-meta-label">Wisudawan</span>
            <span class="result-meta-val" style="color:var(--primary);">${escapeHtml(s.name || '—')}</span>
          </div>
          <div class="result-meta-row">
            <span class="result-meta-label">NIM</span>
            <span class="result-meta-val">${escapeHtml(s.nim || '—')}</span>
          </div>
          <div class="result-meta-row">
            <span class="result-meta-label">Kursi Wisudawan</span>
            <span class="result-meta-val">${escapeHtml(s.seat || '—')}</span>
          </div>
        `;
      }

      let timeInfo = '';
      if (res.time) {
        timeInfo = `
          <div class="result-meta-row">
            <span class="result-meta-label">${isExit ? 'Waktu Keluar' : 'Waktu Masuk'}</span>
            <span class="result-meta-val" style="font-family:monospace;">${escapeHtml(res.time)}</span>
          </div>
        `;
      }

      let idInfo = '';
      if (res.requestId) {
        idInfo = `
          <div class="result-meta-row" style="font-size:10.5px;color:var(--muted);margin-top:4px;">
            <span class="result-meta-label">ID Transaksi</span>
            <span class="result-meta-val" style="font-family:monospace;font-weight:normal;">${escapeHtml(res.requestId)}</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="result-card ${cardClass}">
          <div class="result-header">
            <span>${icon}</span>
            <span>${escapeHtml(res.badge || (isSuccess ? 'BERHASIL' : 'TRANSAKSI GAGAL'))}</span>
          </div>
          <div class="result-body">
            <div style="font-weight:700;margin-bottom:8px;">${escapeHtml(res.message || '')}</div>
            ${studentRows}
            ${timeInfo}
            ${idInfo}
            <div style="margin-top:8px;padding-top:6px;border-top:1px dashed rgba(0,0,0,0.1);font-size:11px;color:var(--muted);text-align:center;">
              ${isSuccess ? '🔒 Transaksi tercatat. <strong>Angkat QR dari kamera</strong> untuk transaksi berikutnya.' : 'Silakan coba kembali.'}
            </div>
          </div>
        </div>
      `;

      // Visual Viewfinder lock
      if (vfBox) {
        vfBox.classList.add('locked');
      }
      if (vfLabel) {
        vfLabel.innerHTML = '🔒 QR Terkunci — <strong>Angkat QR</strong> untuk transaksi berikutnya';
      }

      // Add to recent list
      const label = isEntry ? 'BERHASIL MASUK' : (isExit ? 'BERHASIL KELUAR' : (res.badge || 'GAGAL'));
      const badgeClass = isEntry ? 'badge-in' : (isExit ? 'badge-out' : 'badge-err');
      const name = (res.student && res.student.name) ? res.student.name : (activeLockedCode || 'QR');
      addHistory(label, badgeClass, name);
    }

    // Heartbeat check (every 250ms) to detect when the QR code is lifted away from the camera
    setInterval(function () {
      if (activeLockedCode) {
        const now = Date.now();
        // If QR has not been detected for > 1300 ms, user has lifted the QR away!
        if (now - lastSeenTimestamp > 1300) {
          activeLockedCode = null;

          // Jangan reset jika sedang memproses konfirmasi server
          if (!isProcessingTransaction) {
            const vfBox = document.getElementById('viewfinder-box');
            const vfLabel = document.getElementById('viewfinder-label');
            if (vfBox) {
              vfBox.classList.remove('locked');
              vfBox.classList.remove('scanned');
            }
            if (vfLabel) {
              vfLabel.textContent = '🟢 Siap Memindai QR Baru / Hadapkan Kembali untuk Check-out';
            }
          }
        }
      }
    }, 250);

    // On scan success (callback from html5-qrcode)
    function onScanSuccess(decodedText) {
      const clean = String(decodedText || '').trim();
      if (!clean) return;

      const now = Date.now();

      // 1. KASUS QR SAMA DAN MASIH BERADA DI KAMERA:
      // Selama QR masih terbaca, perbarui timestamp agar lock tidak terlepas.
      // JANGAN kirim transaksi baru selama masih dalam satu siklus kehadiran!
      if (activeLockedCode === clean) {
        lastSeenTimestamp = now;
        return;
      }

      // 2. KASUS SEDANG PROSES TRANSAKSI SEBELUMNYA:
      if (isProcessingTransaction) {
        return;
      }

      // 3. KODE BARU / PRESENTASI SENGAJA BERIKUTNYA (SETELAH DIANGKAT):
      const currentRequestId = 'TX-' + now + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      activeLockedCode = clean;
      lastSeenTimestamp = now;
      isProcessingTransaction = true;
      pendingRequestId = currentRequestId;
      pendingPayload = clean;

      // Pasang timeout 10 detik untuk memastikan UI tidak pernah macet
      clearPendingTimer();
      pendingTransactionTimer = setTimeout(onTransactionTimeout, 10000);

      // Animate viewfinder
      const vfBox = document.getElementById('viewfinder-box');
      const vfLabel = document.getElementById('viewfinder-label');
      if (vfBox) {
        vfBox.classList.add('scanned');
      }
      if (vfLabel) {
        vfLabel.textContent = '⏳ 1/2 QR Dibaca — Mengirim ke Aplikasi Induk...';
      }

      // Display pending state card
      const container = document.getElementById('result-box-container');
      container.innerHTML = `
        <div class="result-card card-pending">
          <div class="result-header">
            <span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid #92400e;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:6px;"></span>
            <span>MEMVERIFIKASI TRANSAKSI PRESENSI...</span>
          </div>
          <div class="result-body">
            <div style="font-family:monospace;font-weight:700;color:#92400e;margin-bottom:4px;">${escapeHtml(clean)}</div>
            <div style="font-size:11.5px;color:#78350f;">Memeriksa status sesi di Google Sheets (Check-in / Check-out otomatis)...</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:4px;font-family:monospace;">ID: ${currentRequestId}</div>
          </div>
        </div>
      `;

      // Send to parent window with correlation ID requestId
      const sent = sendToParent({
        type: 'UIN_ARRANIRY_QR_SCAN',
        payload: clean,
        requestId: currentRequestId,
        timestamp: now
      });

      if (!sent) {
        // Standalone mode simulation
        setTimeout(function () {
          clearPendingTimer();
          isProcessingTransaction = false;
          pendingRequestId = null;
          pendingPayload = null;
          renderBackendResult({
            success: true,
            resultCode: 'BERHASIL_MASUK',
            badge: 'SIMULASI MANDIRI',
            message: 'Mode mandiri: Buka pemindai melalui aplikasi utama untuk mencatat ke Google Sheets.',
            student: { name: clean, nim: clean, seat: '—' },
            time: new Date().toLocaleTimeString('id-ID'),
            requestId: currentRequestId
          });
        }, 600);
      }
    }

    function onScanProgress() {
      // Periodic tick
    }

    // Populate camera devices
    async function populateCameras() {
      const select = document.getElementById('camera-select');
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        if (videoDevices.length > 0) {
          select.innerHTML = '';
          const backOpt = document.createElement('option');
          backOpt.value = 'environment';
          backOpt.textContent = 'Kamera Belakang (Utama)';
          select.appendChild(backOpt);

          const frontOpt = document.createElement('option');
          frontOpt.value = 'user';
          frontOpt.textContent = 'Kamera Depan';
          select.appendChild(frontOpt);

          videoDevices.forEach((device, index) => {
            const opt = document.createElement('option');
            opt.value = device.deviceId;
            opt.textContent = device.label || ('Kamera ' + (index + 1));
            select.appendChild(opt);
          });
        }
      } catch (e) {
        console.warn('Unable to enumerate cameras:', e);
      }
    }

    function onCameraSelectChange() {
      if (isScanning) {
        startScanner();
      }
    }

    // Start scanner
    async function startScanner() {
      const select = document.getElementById('camera-select');
      const chosenValue = select.value || 'environment';

      let cameraConfig;
      if (chosenValue === 'environment' || chosenValue === 'user') {
        cameraConfig = { facingMode: chosenValue };
      } else {
        cameraConfig = { deviceId: { exact: chosenValue } };
      }

      if (isScanning && html5QrCode) {
        await stopScanner();
      }

      html5QrCode = new Html5Qrcode('reader');

      const config = {
        fps: 12,
        qrbox: { width: 210, height: 210 },
        aspectRatio: 1.0
      };

      try {
        await html5QrCode.start(
          cameraConfig,
          config,
          onScanSuccess,
          onScanProgress
        );

        isScanning = true;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
        document.getElementById('viewfinder-label').textContent = 'Kamera Aktif — Siap Memindai';

        populateCameras();
      } catch (err) {
        console.error('Camera start error:', err);
        const name = err.name || 'CameraError';
        const msg = err.message || 'Kamera tidak dapat diakses.';
        document.getElementById('viewfinder-label').textContent = '✕ Gagal Membuka Kamera';
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;

        const container = document.getElementById('result-box-container');
        container.innerHTML = `
          <div class="result-card card-error">
            <div class="result-header">✕ ${escapeHtml(name)}</div>
            <div class="result-body">${escapeHtml(msg)}<br>Pastikan izin kamera diizinkan pada peramban.</div>
          </div>
        `;
      }
    }

    // Stop scanner
    async function stopScanner() {
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {
          console.warn('Error stopping scanner:', e);
        }
      }
      isScanning = false;
      activeLockedCode = null;
      isProcessingTransaction = false;
      clearPendingTimer();
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('viewfinder-label').textContent = 'Kamera Dihentikan';
    }

    // Close window safely
    async function closeScannerWindow() {
      await stopScanner();
      window.close();
    }

    // History helper
    function addHistory(badgeText, badgeClass, name) {
      const list = document.getElementById('history-list');
      const timeStr = new Date().toLocaleTimeString('id-ID');
      recentScans.unshift({ badgeText, badgeClass, name, time: timeStr });
      if (recentScans.length > 5) recentScans.pop();

      list.innerHTML = recentScans.map(item => `
        <div class="history-item">
          <div>
            <span class="history-badge ${item.badgeClass}">${escapeHtml(item.badgeText)}</span>
            <strong>${escapeHtml(item.name)}</strong>
          </div>
          <span class="history-time">${item.time}</span>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('beforeunload', () => {
      if (html5QrCode && isScanning) {
        try { html5QrCode.stop(); } catch (e) {}
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      populateCameras();
      if (window.opener) {
        setTimeout(startScanner, 400);
      }
    });
  </script>
</body>
</html>
