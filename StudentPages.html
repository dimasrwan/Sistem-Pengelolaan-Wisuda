<script>
    function renderStudents() {
      if (APP.session.role !== 'Admin') {
        showToast('Akses ditolak.');
        return;
      }

      document.getElementById('page-content').innerHTML =
        pageHeader(
          'Data Wisudawan',
          'Kelola data wisudawan untuk setiap gelombang wisuda.',
          '<button class="btn" onclick="navigate(\'import-students\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
            'Import Data Wisudawan' +
          '</button>'
        ) +
        '<div class="panel"><div class="panel-head"><h2>Data induk wisudawan</h2></div>' +
          '<div class="panel-body">' +
            '<div class="student-filter-grid">' +
              '<input id="student-search" class="field" placeholder="Cari nama, NIM, atau prodi" onkeydown="if(event.key===\'Enter\')searchStudentRows()">' +
              '<select id="filter-period" class="field"><option value="">Semua gelombang</option></select>' +
              '<select id="filter-faculty" class="field" onchange="onStudentFacultyFilterChange()"><option value="">Semua fakultas</option></select>' +
              '<select id="filter-program" class="field"><option value="">Semua program studi</option></select>' +
              '<select id="filter-level" class="field"><option value="">Semua jenjang</option></select>' +
            '</div><div class="toolbar" style="margin:12px 0 16px">' +
              '<button class="btn" onclick="searchStudentRows()">Terapkan Filter</button>' +
              '<button class="btn btn-outline" onclick="searchStudentRows(true)">Reset Filter</button>' +
              '<label style="display:flex;align-items:center;gap:8px">Baris <select id="student-page-size" class="field" style="width:auto" onchange="searchStudentRows()"><option>25</option><option>50</option><option>100</option></select></label>' +
            '</div><div id="student-table"><div class="table-empty">Memuat data...</div></div><div id="student-pagination" class="student-pagination"></div></div></div>';

      ['filter-period', 'filter-faculty', 'filter-program', 'filter-level', 'student-page-size'].forEach(syncCustomSelect);

      loadStudentImportSetup(null, function () {
        loadStudentFilterOptions();
        searchStudentRows(true);
      });
    }

    function toggleStudentImport() {
      navigate('import-students');
    }

    function renderImportStudents() {
      if (APP.session.role !== 'Admin') {
        showToast('Akses ditolak.');
        return;
      }

      const content = document.getElementById('page-content');
      content.innerHTML =
        '<div class="breadcrumb" aria-label="Breadcrumb">' +
          '<a href="javascript:void(0)" onclick="navigate(\'students\')">Data Wisudawan</a>' +
          '<span class="sep">/</span>' +
          '<span class="current">Import Data</span>' +
        '</div>' +
        pageHeader(
          'Import Data Wisudawan',
          'Unggah data wisudawan dari SIAKAD (Excel/CSV) ke gelombang wisuda tujuan.',
          '<button class="btn btn-outline" onclick="navigate(\'students\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>' +
            'Kembali ke Data Wisudawan</button>'
        ) +
        '<div class="import-steps">' +
          '<div class="import-step-card">' +
            '<div class="import-step-num">1</div>' +
            '<div class="import-step-info"><strong>Pilih Gelombang</strong><span>Tentukan periode wisuda</span></div>' +
          '</div>' +
          '<div class="import-step-card">' +
            '<div class="import-step-num">2</div>' +
            '<div class="import-step-info"><strong>Unggah File</strong><span>File Excel atau CSV</span></div>' +
          '</div>' +
          '<div class="import-step-card">' +
            '<div class="import-step-num">3</div>' +
            '<div class="import-step-info"><strong>Validasi & Pratinjau</strong><span>Pemeriksaan integritas</span></div>' +
          '</div>' +
          '<div class="import-step-card">' +
            '<div class="import-step-num">4</div>' +
            '<div class="import-step-info"><strong>Konfirmasi Impor</strong><span>Simpan ke Google Sheets</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-head"><div><h2>Formulir Import Data Wisudawan</h2>' +
          '<div class="import-status-line">Data akan ditambahkan ke periode terpilih tanpa menghapus gelombang lain.</div></div></div>' +
          '<div class="panel-body">' +
            '<div class="notice notice-info" style="margin-bottom:18px;">' +
              '<strong>Ketentuan Import Data:</strong>' +
              '<ul style="margin:6px 0 0 18px;padding:0;font-size:12.5px;line-height:1.6;">' +
                '<li>Data akan ditambahkan ke gelombang wisuda yang dipilih. Data wisudawan pada gelombang lain <strong>tidak akan terhapus</strong>.</li>' +
                '<li>Kolom <strong>NIM</strong> dan <strong>Nama</strong> wajib tersedia pada file. Kolom prodi, fakultas, dan jenjang akan disinkronkan otomatis.</li>' +
                '<li>Data dengan NIM yang sudah ada pada database atau berulang dalam file akan otomatis terdeteksi saat validasi.</li>' +
              '</ul>' +
            '</div>' +
            '<div class="import-grid">' +
              '<div class="import-field">' +
                '<label for="import-period">1. Gelombang Wisuda Tujuan</label>' +
                '<select id="import-period" class="field" onchange="runStudentImportPreview()">' +
                  '<option value="">Memuat periode...</option>' +
                '</select>' +
                '<div id="import-period-info" class="import-status-line">Memuat daftar periode...</div>' +
              '</div>' +
              '<div class="import-field">' +
                '<label>Periode Belum Tersedia?</label>' +
                '<div>' +
                  '<button type="button" class="btn btn-outline" onclick="toggleNewPeriodForm()">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
                    'Buat Gelombang Baru' +
                  '</button>' +
                '</div>' +
                '<div class="import-status-line">Periode baru akan langsung tersimpan dan siap dipilih.</div>' +
              '</div>' +
            '</div>' +
            '<div class="period-form hidden" id="new-period-form">' +
              '<h3 style="margin:0 0 12px;font:800 14px Manrope,sans-serif">Buat Periode Wisuda Baru</h3>' +
              '<div class="period-form-grid">' +
                '<div class="import-field"><label for="new-period-name">Nama periode</label><input id="new-period-name" class="field" placeholder="Wisuda Gelombang IV Tahun 2027"></div>' +
                '<div class="import-field"><label for="new-period-year">Tahun</label><input id="new-period-year" class="field" type="number" min="2000" max="2100" placeholder="2027"></div>' +
                '<div class="import-field"><label for="new-period-wave">Gelombang</label><input id="new-period-wave" class="field" placeholder="IV"></div>' +
                '<div class="import-field"><label for="new-period-date">Tanggal pelaksanaan</label><input id="new-period-date" class="field" type="date"></div>' +
                '<div class="import-field" style="grid-column:1/-1"><label for="new-period-location">Lokasi</label><input id="new-period-location" class="field" placeholder="Contoh: Auditorium Prof. Ali Hasjmy"></div>' +
              '</div>' +
              '<div class="toolbar" style="margin-top:14px">' +
                '<button type="button" class="btn" onclick="createStudentPeriod()">Simpan Periode</button>' +
                '<button type="button" class="btn btn-outline" onclick="toggleNewPeriodForm(false)">Batal</button>' +
              '</div>' +
              '<div id="new-period-message" style="margin-top:10px"></div>' +
            '</div>' +
            '<div class="import-drop" style="margin-top:20px;">' +
              '<strong>2. Unggah File Excel atau CSV</strong>' +
              '<p>Format yang didukung: <code>.xlsx</code>, <code>.xls</code>, atau <code>.csv</code>. Baris pertama file harus berupa nama kolom (header). Maksimal 10.000 baris dan ukuran berkas maksimal 10 MB.</p>' +
              '<div style="max-width:420px;margin:0 auto;">' +
                '<input type="file" id="student-import-file" class="field" accept=".xlsx,.xls,.csv" onchange="processStudentImportFile(this.files&&this.files[0])" style="width:100%">' +
              '</div>' +
              '<div id="import-file-info" class="import-status-line" style="margin-top:12px;font-weight:600;">Belum ada file yang dipilih.</div>' +
            '</div>' +
            '<div style="margin-top:24px;">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
                '<h3 style="margin:0;font:800 15px Manrope,sans-serif">3. Hasil Validasi & Pratinjau Data</h3>' +
                '<button type="button" id="btn-revalidate" class="btn btn-outline btn-sm" onclick="runStudentImportPreview()">' +
                  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>' +
                  'Validasi Ulang' +
                '</button>' +
              '</div>' +
              '<div id="import-preview-container"><div class="table-empty">Pilih gelombang dan unggah file untuk memeriksa validasi data.</div></div>' +
            '</div>' +
            '<div id="import-summary-container" style="margin-top:16px;"></div>' +
            '<div class="toolbar" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">' +
              '<button type="button" class="btn" id="confirm-import-btn" onclick="confirmStudentImport()" disabled>' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
                '4. Konfirmasi & Impor Data Valid' +
              '</button>' +
              '<button type="button" class="btn btn-outline" onclick="resetStudentImport()">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>' +
                'Reset File' +
              '</button>' +
              '<button type="button" class="btn btn-outline" onclick="navigate(\'students\')" style="margin-left:auto;">' +
                'Kembali ke Data Wisudawan' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      syncCustomSelect('import-period');
      loadStudentImportSetup(null, function () {
        if (APP.importRows && APP.importRows.length) {
          const info = document.getElementById('import-file-info');
          if (info && APP.importFileName) {
            info.textContent = APP.importFileName + ' · ' + APP.importRows.length.toLocaleString('id-ID') + ' baris dimuat';
          }
          runStudentImportPreview();
        }
      });
    }

    function loadStudentImportSetup(selectPeriodId, onComplete) {
      google.script.run
        .withSuccessHandler(function (setup) {
          APP.importPeriods = (setup && setup.periods) || [];

          const select = document.getElementById('import-period');
          if (select) {
            const previous = select.value;

            select.innerHTML = '<option value="">Pilih gelombang tujuan...</option>' +
              APP.importPeriods.map(function (period) {
                const label = [
                  period.name,
                  period.wave ? 'Gel. ' + period.wave : '',
                  period.year
                ].filter(Boolean).join(' · ');

                return '<option value="' + escapeAttr(period.id) + '">' +
                  escapeHtml(label + ' [' + period.id + ']') + '</option>';
              }).join('');

            if (selectPeriodId && APP.importPeriods.some(function (p) {
              return p.id === selectPeriodId;
            })) {
              select.value = selectPeriodId;
            } else if (previous && APP.importPeriods.some(function (p) {
              return p.id === previous;
            })) {
              select.value = previous;
            }
            syncCustomSelect('import-period');
          }

          const info = document.getElementById('import-period-info');
          if (info) {
            info.textContent = APP.importPeriods.length
              ? Number((setup && setup.totalStudents) || 0).toLocaleString('id-ID') +
                ' baris saat ini di data induk. Pastikan periode tujuan benar.'
              : 'Belum ada periode terdaftar. Buat periode baru terlebih dahulu.';
          }

          if (selectPeriodId) runStudentImportPreview();
          if (typeof onComplete === 'function') onComplete(setup, null);
        })
        .withFailureHandler(function (error) {
          APP.importPeriods = [];

          const select = document.getElementById('import-period');
          if (select) {
            select.innerHTML = '<option value="">Pilih gelombang tujuan...</option>';
            syncCustomSelect('import-period');
          }

          const info = document.getElementById('import-period-info');
          if (info) {
            info.textContent = 'Gagal memuat daftar periode wisuda.';
          }

          showError(error);
          if (typeof onComplete === 'function') onComplete(null, error);
        })
        .getStudentImportSetup();
    }

    function toggleNewPeriodForm(forceOpen) {
      const form = document.getElementById('new-period-form');
      if (!form) return;

      const open = typeof forceOpen === 'boolean'
        ? forceOpen
        : form.classList.contains('hidden');

      form.classList.toggle('hidden', !open);
    }

    function createStudentPeriod() {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const payload = {
        name: document.getElementById('new-period-name').value.trim(),
        year: document.getElementById('new-period-year').value.trim(),
        wave: document.getElementById('new-period-wave').value.trim(),
        date: document.getElementById('new-period-date').value,
        location: document.getElementById('new-period-location').value.trim()
      };

      const message = document.getElementById('new-period-message');
      message.innerHTML = '';

      if (!payload.name || !payload.year || !payload.wave) {
        message.innerHTML = '<div class="notice notice-warn">Nama periode, tahun, dan gelombang wajib diisi.</div>';
        return;
      }

      google.script.run
        .withSuccessHandler(function (result) {
          message.innerHTML = '<div class="notice notice-success">' +
            escapeHtml(result.message) + '</div>';

          loadStudentImportSetup(result.period && result.period.id);
          showToast('Periode baru berhasil dibuat.');
        })
        .withFailureHandler(function (error) {
          message.innerHTML = '<div class="notice notice-error">' +
            escapeHtml(getErrorMessage(error)) + '</div>';
        })
        .createWisudaPeriod(payload);
    }

    function processStudentImportFile(file) {
      if (!file) return;
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const info = document.getElementById('import-file-info');
      const preview = document.getElementById('import-preview-container');
      const button = document.getElementById('confirm-import-btn');

      if (file.size > 10 * 1024 * 1024) {
        info.textContent = 'Ukuran file melebihi batas 10 MB.';
        APP.importRows = null;
        button.disabled = true;
        return;
      }

      if (!window.XLSX) {
        info.textContent = 'Pustaka pembaca Excel belum termuat. Muat ulang halaman dan coba kembali.';
        return;
      }

      info.textContent = 'Membaca ' + file.name + '...';
      preview.innerHTML = '<div class="table-empty">Sedang membaca file...</div>';
      button.disabled = true;

      const reader = new FileReader();

      reader.onload = function (event) {
        try {
          const workbook = XLSX.read(event.target.result, {
            type: 'array',
            cellDates: true
          });

          const sheetName = workbook.SheetNames[0];
          if (!sheetName) throw new Error('File tidak memiliki sheet yang dapat dibaca.');

          const matrix = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
            header: 1,
            defval: '',
            raw: false,
            blankrows: false
          });

          if (!matrix || matrix.length < 2) {
            throw new Error('File harus memiliki baris header dan setidaknya satu baris data.');
          }

          const headers = matrix[0].map(function (header) {
            return String(header == null ? '' : header).trim();
          });

          if (!headers.some(Boolean)) {
            throw new Error('Header tidak ditemukan pada baris pertama.');
          }

          const rows = matrix.slice(1)
            .filter(function (row) {
              return row.some(function (cell) {
                return String(cell == null ? '' : cell).trim() !== '';
              });
            })
            .map(function (row) {
              const obj = {};
              headers.forEach(function (header, index) {
                if (header) {
                  obj[header] = String(
                    row[index] == null ? '' : row[index]
                  ).trim();
                }
              });
              return obj;
            });

          if (!rows.length) throw new Error('Tidak ada baris data setelah header.');

          if (rows.length > 10000) {
            throw new Error('File berisi lebih dari 10.000 baris. Pisahkan file terlebih dahulu.');
          }

          APP.importRows = rows;
          APP.importFileName = file.name;
          APP.importPreview = null;

          info.textContent = file.name + ' · ' +
            rows.length.toLocaleString('id-ID') +
            ' baris · sheet: ' + sheetName;

          runStudentImportPreview();
        } catch (error) {
          APP.importRows = null;
          APP.importPreview = null;
          button.disabled = true;

          preview.innerHTML = '<div class="notice notice-error">' +
            escapeHtml(getErrorMessage(error)) + '</div>';

          info.textContent = 'File belum berhasil dibaca.';
        }
      };

      reader.onerror = function () {
        APP.importRows = null;
        button.disabled = true;
        info.textContent = 'Gagal membaca file dari komputer.';
      };

      reader.readAsArrayBuffer(file);
    }

    function runStudentImportPreview() {
      const periodId = (document.getElementById('import-period') || {}).value || '';
      const container = document.getElementById('import-preview-container');
      const button = document.getElementById('confirm-import-btn');

      if (!container || !button) return;

      APP.importPreview = null;
      button.disabled = true;
      button.textContent = '4. Konfirmasi & Impor Data Valid';

      if (!APP.importRows || !APP.importRows.length) {
        container.innerHTML = '<div class="table-empty">Unggah file Excel/CSV untuk melihat pratinjau.</div>';
        return;
      }

      if (!periodId) {
        container.innerHTML = '<div class="notice notice-warn">Pilih gelombang tujuan atau buat periode baru sebelum validasi.</div>';
        return;
      }

      container.innerHTML = '<div class="table-empty">Memvalidasi NIM, nama, dan duplikat...</div>';

      google.script.run
        .withSuccessHandler(function (result) {
          APP.importPreview = result;
          renderStudentImportPreview(result);
          button.disabled = !(result.importable > 0);
          button.textContent = result.importable > 0
            ? '4. Impor ' + Number(result.importable).toLocaleString('id-ID') + ' Data Valid'
            : '4. Konfirmasi & Impor Data Valid';
        })
        .withFailureHandler(function (error) {
          APP.importPreview = null;
          button.disabled = true;
          button.textContent = '4. Konfirmasi & Impor Data Valid';

          container.innerHTML = '<div class="notice notice-error">' +
            escapeHtml(getErrorMessage(error)) + '</div>';
        })
        .previewStudentImport({
          periodId: periodId,
          rows: APP.importRows
        });
    }

    function importStat(label, value) {
      return '<div class="import-stat"><span>' + escapeHtml(label) +
        '</span><strong>' + Number(value || 0).toLocaleString('id-ID') +
        '</strong></div>';
    }

    function renderStudentImportPreview(result) {
      const container = document.getElementById('import-preview-container');
      if (!container) return;

      const stats = '<div class="import-stats">' +
        importStat('Total baris', result.total) +
        importStat('Siap diimpor', result.importable) +
        importStat('Sudah ada', result.duplicateExisting) +
        importStat('Duplikat / invalid', result.duplicateFile + result.invalid) +
        '</div>';

      const rows = (result.sample || []).map(function (row) {
        const cls = row.status === 'Siap diimpor'
          ? 'badge-green'
          : row.status === 'Tidak valid'
            ? 'badge-red'
            : 'badge-yellow';

        return '<tr><td>' + row.rowNumber +
          '</td><td>' + escapeHtml(row.nim || '—') +
          '</td><td>' + escapeHtml(row.name || '—') +
          '</td><td>' + escapeHtml(row.faculty || '—') +
          '</td><td>' + escapeHtml(row.program || '—') +
          '</td><td><span class="badge ' + cls + '">' +
          escapeHtml(row.status) +
          '</span></td><td>' + escapeHtml(row.reason || '—') +
          '</td></tr>';
      }).join('');

      container.innerHTML =
        '<div class="notice notice-info">Tujuan impor: <strong>' +
        escapeHtml(result.periodName) +
        '</strong>. Pratinjau menampilkan maksimal 30 baris pertama; seluruh data akan divalidasi server.</div>' +
        stats +
        '<div class="import-preview-table"><table><thead><tr>' +
        '<th>Baris file</th><th>NIM</th><th>Nama</th><th>Fakultas</th><th>Program Studi</th><th>Status</th><th>Keterangan</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function confirmStudentImport() {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      if (!APP.importRows || !APP.importPreview || APP.importPreview.importable < 1) {
        return showToast('Validasi file terlebih dahulu.');
      }

      const periodId = (document.getElementById('import-period') || {}).value || '';
      const count = APP.importPreview.importable;
      const name = APP.importPreview.periodName;

      if (!confirm('Impor ' + count + ' data valid ke ' + name + '? Data gelombang lain tidak akan dihapus.')) {
        return;
      }

      const button = document.getElementById('confirm-import-btn');
      button.disabled = true;
      button.textContent = 'Menyimpan data...';

      google.script.run
        .withSuccessHandler(function (result) {
          button.textContent = 'Impor Data Valid';
          button.disabled = true;

          const container = document.getElementById('import-preview-container');

          if (container) {
            container.insertAdjacentHTML(
              'afterbegin',
              '<div class="notice ' +
              (result.success ? 'notice-success' : 'notice-warn') +
              '">' + escapeHtml(result.message) + '</div>'
            );
          }

          showToast(result.message);

          APP.importRows = null;
          APP.importPreview = null;
          APP.importFileName = '';

          const input = document.getElementById('student-import-file');
          if (input) input.value = '';

          const info = document.getElementById('import-file-info');
          if (info) info.textContent = 'Import selesai. Pilih file lain untuk impor berikutnya.';

          const summaryContainer = document.getElementById('import-summary-container');
          if (summaryContainer) {
            summaryContainer.innerHTML =
              '<div class="notice notice-success" style="margin-top:14px;">' +
                '<h4 style="margin:0 0 6px;font:800 14px Manrope,sans-serif">Ringkasan Hasil Import</h4>' +
                '<p style="margin:0 0 10px;font-size:12.5px;">' + escapeHtml(result.message) + '</p>' +
                '<div style="font-size:12px;color:var(--muted);margin-bottom:12px;">' +
                  'Data wisudawan telah berhasil disimpan ke Google Sheets. Anda dapat langsung melihat data pada tabel Data Wisudawan atau mengimpor file gelombang lain.' +
                '</div>' +
                '<div class="toolbar">' +

    function formatCleanProdiLabel(raw) {
      if (!raw) return '';
      let clean = String(raw).replace(/\s*\([^)]*\)/g, '').trim();
      clean = clean.replace(/^(S[123]|D[34])\s*[-–]\s*/i, '$1 ');
      clean = clean.replace(/[`’]/g, "'");
      return clean;
    }

    function normalizeProdiForMatch(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/\s*\([^)]*\)/g, '')
        .replace(/^(s[123]|d[34])\s*[-–]\s*/i, '$1 ')
        .replace(/\bdan\b/g, '')
        .replace(/[`'’\-–]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function matchProdiToRef(rawProdi, refList) {
      if (!refList || !refList.length) return -1;
      const normRaw = normalizeProdiForMatch(rawProdi);
      let idx = refList.findIndex(function(ref) {
        return normalizeProdiForMatch(ref) === normRaw;
      });
      if (idx !== -1) return idx;

      idx = refList.findIndex(function(ref) {
        const normRef = normalizeProdiForMatch(ref);
        return normRaw.startsWith(normRef) || normRef.startsWith(normRaw);
      });
      return idx;
    }

    function normalizeFacultyKey_(value) {
      return String(value == null ? '' : value)
        .trim()
        .toLowerCase()
        .replace(/[`’'‘‛]/g, "'")
        .replace(/\\'/g, "'")
        .replace(/\s*[-–—]\s*/g, ' - ')
        .replace(/\s+/g, ' ');
    }

    function getOrderedProdisForFaculty(facName) {
      if (!facName) return [];
      if (ORDERED_PRODIS_BY_FACULTY[facName]) return ORDERED_PRODIS_BY_FACULTY[facName];
      const normFac = normalizeFacultyKey_(facName);
      for (const key in ORDERED_PRODIS_BY_FACULTY) {
        if (normalizeFacultyKey_(key) === normFac) {
          return ORDERED_PRODIS_BY_FACULTY[key];
        }
      }
      return [];
    }

    function getFacultyRank(facName) {
      const norm = normalizeFacultyKey_(facName);
      for (let i = 0; i < ORDERED_FACULTIES.length; i++) {
        if (normalizeFacultyKey_(ORDERED_FACULTIES[i]) === norm) return i;
      }
      for (let i = 0; i < ORDERED_FACULTIES.length; i++) {
        const cNorm = normalizeFacultyKey_(ORDERED_FACULTIES[i]);
        if (norm.includes(cNorm) || cNorm.includes(norm)) return i;
      }
      return 999;
    }

    function buildStudentFilterData(rows) {
      rows = rows || [];
      const facultiesSet = new Set();
      const prodiByFac = {};
      const facByProdi = {};

      rows.forEach(function(r) {
        const fac = String(value(r, ['Fakultas']) || '').trim();
        const prodi = String(value(r, ['Program_Studi', 'Program Studi']) || '').trim();
        if (!fac || !prodi) return;

        facultiesSet.add(fac);
        if (!prodiByFac[fac]) prodiByFac[fac] = new Map();

        if (!prodiByFac[fac].has(prodi)) {
          const refList = getOrderedProdisForFaculty(fac);
          const matchedIdx = matchProdiToRef(prodi, refList);
          const label = matchedIdx !== -1 ? refList[matchedIdx] : formatCleanProdiLabel(prodi);
          const rank = matchedIdx !== -1 ? matchedIdx : 999;
          prodiByFac[fac].set(prodi, { raw: prodi, label: label, rank: rank });
        }
        facByProdi[prodi] = fac;
      });

      const sortedFaculties = Array.from(facultiesSet).sort(function(a, b) {
        const rankA = getFacultyRank(a);
        const rankB = getFacultyRank(b);
        if (rankA !== rankB) return rankA - rankB;
        return a.localeCompare(b);
      });

      const sortedProdisByFac = {};
      sortedFaculties.forEach(function(fac) {
        const map = prodiByFac[fac] || new Map();
        const list = Array.from(map.values()).sort(function(a, b) {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.label.localeCompare(b.label);
        });
        sortedProdisByFac[fac] = list;
      });

      return {
        faculties: sortedFaculties,
        prodisByFac: sortedProdisByFac,
        facByProdi: facByProdi
      };
    }

    function getProdisForFaculty(selectedFaculty) {
      if (!selectedFaculty || !studentFilterData) return [];
      if (studentFilterData.prodisByFac[selectedFaculty]) {
        return studentFilterData.prodisByFac[selectedFaculty];
      }
      const norm = normalizeFacultyKey_(selectedFaculty);
      for (const fac in studentFilterData.prodisByFac) {
        if (normalizeFacultyKey_(fac) === norm) {
          return studentFilterData.prodisByFac[fac];
        }
      }
      return [];
    }

    function populateStudentProgramOptions(selectedFaculty, preserveValue) {
      const el = document.getElementById('filter-program');
      if (!el || !studentFilterData) return;

      selectedFaculty = String(selectedFaculty || '').trim();
      let html = '<option value="">Semua program studi</option>';

      if (selectedFaculty) {
        // Menampilkan program studi untuk fakultas yang dipilih
        const prodis = getProdisForFaculty(selectedFaculty);
        prodis.forEach(function(p) {
          html += '<option value="' + escapeAttr(p.raw) + '">' + escapeHtml(p.label) + '</option>';
        });
      } else {
        // "Semua fakultas" dipilih: tampilkan semua program studi dikelompokkan per fakultas
        studentFilterData.faculties.forEach(function(fac) {
          const prodis = studentFilterData.prodisByFac[fac] || [];
          if (!prodis.length) return;
          html += '<optgroup label="' + escapeAttr(fac) + '">';
          prodis.forEach(function(p) {
            html += '<option value="' + escapeAttr(p.raw) + '">' + escapeHtml(p.label) + '</option>';
          });
          html += '</optgroup>';
        });
      }

      el.innerHTML = html;

      // Cek apakah prodi yang dipilih sebelumnya masih berlaku dalam opsi baru
      let isValid = false;
      if (preserveValue) {
        if (selectedFaculty) {
          const prodis = getProdisForFaculty(selectedFaculty);
          isValid = prodis.some(function(p) { return p.raw === preserveValue; });
        } else {
          isValid = Boolean(studentFilterData.facByProdi[preserveValue]);
        }
      }

      if (isValid) {
        el.value = preserveValue;
      } else {
        el.value = '';
      }
      syncCustomSelect('filter-program');
    }

    function loadStudentFilterOptions() {
      google.script.run.withSuccessHandler(function(rows) {
        // 1. Filter Gelombang (Periode)
        const periodEl = document.getElementById('filter-period');
        if (periodEl) {
          const currentVal = periodEl.value;
          let periodOptions = '<option value="">Semua gelombang</option>';

            periodOptions += APP.importPeriods.map(function(period) {

                period.year
              ].filter(Boolean).join(' · ');
              return '<option value="' + escapeAttr(period.id) + '">' + escapeHtml(label) + '</option>';
            }).join('');
          }
          periodEl.innerHTML = periodOptions;
          if (currentVal && APP.importPeriods && APP.importPeriods.some(function(p){ return p.id === currentVal; })) {
            periodEl.value = currentVal;
          }
        }

        // 2. Olah data filter fakultas dan program studi
        studentFilterData = buildStudentFilterData(rows || []);

        // 3. Dropdown Fakultas (Semua fakultas di urutan pertama)
        const facultyEl = document.getElementById('filter-faculty');
        if (facultyEl) {
          const currentFac = facultyEl.value;
          let facultyHtml = '<option value="">Semua fakultas</option>';
          studentFilterData.faculties.forEach(function(fac) {
            facultyHtml += '<option value="' + escapeAttr(fac) + '">' + escapeHtml(fac) + '</option>';
          });
          facultyEl.innerHTML = facultyHtml;
          if (currentFac) {
            const normCurrent = normalizeFacultyKey_(currentFac);
            const matchedFac = studentFilterData.faculties.find(function(f) {
              return normalizeFacultyKey_(f) === normCurrent;
            });
            if (matchedFac) facultyEl.value = matchedFac;
          }
        }

        // 4. Dropdown Program Studi (Semua program studi di urutan pertama)
        const programEl = document.getElementById('filter-program');
        const currentProgram = programEl ? programEl.value : '';
        populateStudentProgramOptions(facultyEl ? facultyEl.value : '', currentProgram);

        // 5. Dropdown Jenjang (Semua jenjang di urutan pertama)
        const levelEl = document.getElementById('filter-level');
        if (levelEl) {
          const currentLevel = levelEl.value;
          const levelOrder = ['S3', 'S2', 'Profesi', 'S1', 'D4', 'D3'];
          const levels = Array.from(new Set((rows || []).map(function(r) {
            return String(value(r, ['Jenjang']) || '').trim();
          }).filter(Boolean))).sort(function(a, b) {
            const idxA = levelOrder.indexOf(a);
            const idxB = levelOrder.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b);
          });
          levelEl.innerHTML = '<option value="">Semua jenjang</option>' + levels.map(function(l) {
            return '<option value="' + escapeAttr(l) + '">' + escapeHtml(l) + '</option>';
          }).join('');
          if (currentLevel && levels.includes(currentLevel)) {
            levelEl.value = currentLevel;
          }
        }

        // 6. Sinkronisasi tampilan dropdown kustom
        ['filter-period', 'filter-faculty', 'filter-program', 'filter-level'].forEach(syncCustomSelect);
      }).withFailureHandler(showError).searchStudents('');
    }

    function searchStudentRows(reset) {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');
      if (reset) {
        ['student-search','filter-period','filter-faculty','filter-program','filter-level'].forEach(function(id){ const el=document.getElementById(id); if(el) el.value=''; });

      const query = (document.getElementById('student-search') || {}).value || '';

        period: (document.getElementById('filter-period') || {}).value || '',

      const target = document.getElementById('student-table');
      if (target) target.innerHTML = '<div class="table-empty">Memuat data...</div>';
      google.script.run.withSuccessHandler(function(rows) {
        studentRowsCache = rows || [];
        const pages = Math.max(1, Math.ceil(studentRowsCache.length / size));
        studentCurrentPage = Math.min(Math.max(1, studentCurrentPage), pages);
        const from = (studentCurrentPage - 1) * size;
        const visible = studentRowsCache.slice(from, from + size);

        if (!visible.length) {
          if (target) target.innerHTML = '<div class="table-empty">Belum ada data untuk ditampilkan.</div>';

            '<th>Aksi</th>' +

            const no = from + idx + 1;

            const nama = escapeHtml(value(row, ['Nama_Lengkap', 'Nama']) || '—');

              '<td><strong>' + nama + '</strong></td>' +
              '<td>' + fakultas + '</td>' +

        }

        const pager = document.getElementById('student-pagination');
        if (pager) {
          let buttons = '';
          const lo = Math.max(1, studentCurrentPage - 2), hi = Math.min(pages, studentCurrentPage + 2);
          for (let p=lo; p<=hi; p++) buttons += '<button class="student-page-btn '+(p===studentCurrentPage?'active':'')+'" onclick="goStudentPage('+p+')">'+p+'</button>';

        }
      }).withFailureHandler(showError).searchStudents(query, filters);
    }

              detailBox('Tempat Lahir', value(row, ['Tempat_Lahir', 'Tempat Lahir'])) +
              detailBox('Tanggal Lahir', value(row, ['Tanggal_Lahir', 'Tanggal Lahir'])) +
              detailBox('Fakultas', value(row, ['Fakultas'])) +
              detailBox('Program Studi', value(row, ['Program_Studi', 'Program Studi'])) +
              detailBox('Jenjang', value(row, ['Jenjang'])) +
              detailBox('IPK', value(row, ['IPK', 'Indeks Prestasi Kumulatif', 'Indeks_Prestasi'])) +
              detailBox('Predikat', value(row, ['Predikat', 'Predikat Kelulusan', 'Yudisium'])) +
              detailBox('Gelombang Wisuda', formatStudentPeriodLabel(row)) +
              statusDataHtml +
              '<div class="detail-box" style="grid-column:1/-1"><span>Judul Skripsi / Tugas Akhir</span><strong>' +
                escapeHtml(value(row, ['Judul_Skripsi', 'Judul Skripsi', 'Judul_TA', 'Judul TA', 'Judul', 'Tugas_Akhir']) || 'Belum tersedia') +
              '</strong></div>' +
            '</div>' +
            '<div class="toolbar" style="margin-top:18px;justify-content:flex-end">' +
              '<button class="btn btn-outline" onclick="closeStudentDetailModal()">Tutup</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeStudentDetailModal() {
      const modal = document.getElementById('student-detail-modal');
      if (modal) modal.remove();
    }

    /* DAFTAR PANGGIL */
</script>
