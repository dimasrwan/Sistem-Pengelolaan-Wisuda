<script>
    function renderStudents() {
      if (APP.session.role !== 'Admin') {
        showToast('Akses ditolak.');
        return;
      }

      document.getElementById('page-content').innerHTML =
        pageHeader(
          'Data Wisudawan',
          'Kelola data wisudawan untuk setiap gelombang wisuda.',
          '<button class="btn" onclick="navigate(\'import-students\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
            'Import Data Wisudawan' +
          '</button>'
        ) +
        '<div class="panel"><div class="panel-head"><h2>Data induk wisudawan</h2></div>' +
          '<div class="panel-body">' +
            '<div class="student-filter-grid">' +
              '<input id="student-search" class="field" placeholder="Cari nama, NIM, atau prodi" onkeydown="if(event.key===\'Enter\')searchStudentRows()">' +
              '<select id="filter-period" class="field"><option value="">Semua gelombang</option></select>' +
              '<select id="filter-faculty" class="field" onchange="onStudentFacultyFilterChange()"><option value="">Semua fakultas</option></select>' +
              '<select id="filter-program" class="field"><option value="">Semua program studi</option></select>' +
              '<select id="filter-level" class="field"><option value="">Semua jenjang</option></select>' +
            '</div><div class="toolbar" style="margin:12px 0 16px">' +
              '<button class="btn" onclick="searchStudentRows()">Terapkan Filter</button>' +
              '<button class="btn btn-outline" onclick="searchStudentRows(true)">Reset Filter</button>' +
              '<label style="display:flex;align-items:center;gap:8px">Baris <select id="student-page-size" class="field" style="width:auto" onchange="searchStudentRows()"><option>25</option><option>50</option><option>100</option></select></label>' +
            '</div><div id="student-table"><div class="table-empty">Memuat data...</div></div><div id="student-pagination" class="student-pagination"></div></div></div>';

      ['filter-period', 'filter-faculty', 'filter-program', 'filter-level', 'student-page-size'].forEach(syncCustomSelect);

      loadStudentImportSetup(null, function () {
        loadStudentFilterOptions();
        searchStudentRows(true);
      });
    }

    function toggleStudentImport() {
      navigate('import-students');
    }

    function renderImportStudents() {
      if (APP.session.role !== 'Admin') {
        showToast('Akses ditolak.');
        return;
      }

      const content = document.getElementById('page-content');
      content.innerHTML =
        '<div class="import-container">' +
          '<div class="breadcrumb" aria-label="Breadcrumb">' +
            '<a href="javascript:void(0)" onclick="navigate(\'students\')">Data Wisudawan</a>' +
            '<span class="sep">/</span>' +
            '<span class="current">Import Data</span>' +
          '</div>' +
          pageHeader(
            'Import Data Wisudawan',
            'Unggah data wisudawan dari SIAKAD (Excel/CSV) ke gelombang wisuda tujuan secara terstruktur dan aman.',
            '<button class="btn btn-outline" onclick="navigate(\'students\')">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>' +
              'Kembali ke Data Wisudawan</button>'
          ) +

          '<!-- Stepper 4 Tahap -->' +
          '<div class="import-steps" id="import-stepper">' +
            '<div class="import-step-card step-active" id="import-step-1">' +
              '<div class="import-step-num" id="import-step-num-1">1</div>' +
              '<div class="import-step-info"><strong>Pilih Gelombang</strong><span>Tentukan periode wisuda</span></div>' +
            '</div>' +
            '<div class="import-step-card step-pending" id="import-step-2">' +
              '<div class="import-step-num" id="import-step-num-2">2</div>' +
              '<div class="import-step-info"><strong>Unggah Berkas</strong><span>File Excel atau CSV</span></div>' +
            '</div>' +
            '<div class="import-step-card step-pending" id="import-step-3">' +
              '<div class="import-step-num" id="import-step-num-3">3</div>' +
              '<div class="import-step-info"><strong>Validasi & Pratinjau</strong><span>Pemeriksaan integritas</span></div>' +
            '</div>' +
            '<div class="import-step-card step-pending" id="import-step-4">' +
              '<div class="import-step-num" id="import-step-num-4">4</div>' +
              '<div class="import-step-info"><strong>Konfirmasi Impor</strong><span>Simpan ke database</span></div>' +
            '</div>' +
          '</div>' +

          '<!-- Kotak Ketentuan Import Data -->' +
          '<div class="import-notice-box">' +
            '<div class="import-notice-icon">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>' +
            '</div>' +
            '<div class="import-notice-content">' +
              '<div class="import-notice-head">Ketentuan Import Data Wisudawan</div>' +
              '<ul class="import-notice-list">' +
                '<li>Data akan ditambahkan ke <strong>gelombang wisuda terpilih</strong>. Data wisudawan pada gelombang lain <strong>tidak akan terhapus</strong>.</li>' +
                '<li>Kolom <strong>NIM</strong> dan <strong>Nama</strong> wajib tersedia pada file. Kolom program studi, fakultas, dan jenjang akan disinkronkan otomatis.</li>' +
                '<li>Data dengan NIM yang sudah ada pada database atau berulang dalam file akan otomatis terdeteksi pada tahap validasi.</li>' +
              '</ul>' +
            '</div>' +
          '</div>' +

          '<div class="panel">' +
            '<div class="panel-body">' +

              '<!-- TAHAP 1: Gelombang Wisuda Tujuan -->' +
              '<div class="form-subcard">' +
                '<div class="form-subcard-head">' +
                  '<div class="form-subcard-title">' +
                    '<span class="step-pill active">1</span>' +
                    '<span>Gelombang Wisuda Tujuan</span>' +
                  '</div>' +
                  '<button type="button" class="btn btn-outline btn-sm" onclick="toggleNewPeriodForm()">' +
                    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
                    'Buat Gelombang Baru' +
                  '</button>' +
                '</div>' +

                '<div class="period-select-wrap">' +
                  '<div class="period-select-main">' +
                    '<label for="import-period" style="display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;">Pilih Gelombang Wisuda</label>' +
                    '<select id="import-period" class="field" onchange="runStudentImportPreview(); updateImportStepper();" style="width:100%;height:42px;">' +
                      '<option value="">Memuat periode...</option>' +
                    '</select>' +
                    '<div id="import-period-info" class="import-status-line" style="margin-top:6px;font-size:12px;color:var(--muted);">Memuat daftar periode...</div>' +
                  '</div>' +
                '</div>' +

                '<!-- Form Pembuatan Periode Baru (Collapsible) -->' +
                '<div class="period-form hidden" id="new-period-form" style="margin-top:16px;padding:16px;background:#f8faf8;border:1px solid #dce8db;border-radius:12px;">' +
                  '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
                    '<h4 style="margin:0;font:800 14px Manrope,sans-serif;color:#075e19;">Buat Periode Wisuda Baru</h4>' +
                    '<button type="button" class="btn-icon btn-sm" onclick="toggleNewPeriodForm(false)" title="Tutup form">' +
                      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
                    '</button>' +
                  '</div>' +
                  '<div class="period-form-grid">' +
                    '<div class="import-field"><label for="new-period-name">Nama Periode</label><input id="new-period-name" class="field" placeholder="Wisuda Gelombang IV Tahun 2027"></div>' +
                    '<div class="import-field"><label for="new-period-year">Tahun</label><input id="new-period-year" class="field" type="number" min="2000" max="2100" placeholder="2027"></div>' +
                    '<div class="import-field"><label for="new-period-wave">Gelombang</label><input id="new-period-wave" class="field" placeholder="IV"></div>' +
                    '<div class="import-field"><label for="new-period-date">Tanggal Pelaksanaan</label><input id="new-period-date" class="field" type="date"></div>' +
                    '<div class="import-field" style="grid-column:1/-1"><label for="new-period-location">Lokasi Pelaksanaan</label><input id="new-period-location" class="field" placeholder="Contoh: Auditorium Prof. Ali Hasjmy"></div>' +
                  '</div>' +
                  '<div class="toolbar" style="margin-top:14px">' +
                    '<button type="button" class="btn btn-sm" onclick="createStudentPeriod()">' +
                      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
                      'Simpan Periode' +
                    '</button>' +
                    '<button type="button" class="btn btn-outline btn-sm" onclick="toggleNewPeriodForm(false)">Batal</button>' +
                  '</div>' +
                  '<div id="new-period-message" style="margin-top:10px"></div>' +
                '</div>' +
              '</div>' +

              '<!-- TAHAP 2: Unggah Berkas Excel/CSV -->' +
              '<div class="form-subcard">' +
                '<div class="form-subcard-head">' +
                  '<div class="form-subcard-title">' +
                    '<span class="step-pill" id="subcard-step-2">2</span>' +
                    '<span>Unggah Berkas Excel atau CSV</span>' +
                  '</div>' +
                '</div>' +

                '<!-- Dropzone Area -->' +
                '<div class="import-drop-zone" id="import-dropzone" onclick="triggerImportFileInput()" ondragover="onImportDragOver(event)" ondragleave="onImportDragLeave(event)" ondrop="onImportFileDrop(event)">' +
                  '<input type="file" id="student-import-file" accept=".xlsx,.xls,.csv" onchange="processStudentImportFile(this.files&&this.files[0])" style="display:none">' +
                  '<div id="dropzone-prompt">' +
                    '<div class="drop-icon-circle">' +
                      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>' +
                        '<polyline points="17 8 12 3 7 8"></polyline>' +
                        '<line x1="12" y1="3" x2="12" y2="15"></line>' +
                      '</svg>' +
                    '</div>' +
                    '<div class="drop-title">Unggah File Excel atau CSV</div>' +
                    '<div class="drop-sub">Seret berkas ke sini atau <span style="color:var(--primary);font-weight:700;text-decoration:underline;">pilih berkas dari perangkat</span></div>' +
                    '<div class="drop-meta">' +
                      '<span class="drop-meta-tag">.xlsx</span>' +
                      '<span class="drop-meta-tag">.xls</span>' +
                      '<span class="drop-meta-tag">.csv</span>' +
                      '<span>·</span>' +
                      '<span>Maksimal 10.000 baris</span>' +
                      '<span>·</span>' +
                      '<span>Batas ukuran 10 MB</span>' +
                    '</div>' +
                  '</div>' +

                  '<!-- Card Tampilan Berkas Terpilih -->' +
                  '<div id="dropzone-file-card" class="file-card-box hidden" onclick="event.stopPropagation()">' +
                    '<div class="file-card-left">' +
                      '<div class="file-icon-badge">XLS</div>' +
                      '<div class="file-card-info" style="text-align:left;">' +
                        '<div class="file-card-name" id="dropzone-file-name">file.xlsx</div>' +
                        '<div class="file-card-meta">' +
                          '<span id="dropzone-file-size">0 KB</span>' +
                          '<span>·</span>' +
                          '<span id="dropzone-file-rows">0 baris</span>' +
                          '<span>·</span>' +
                          '<span id="dropzone-file-sheet">Sheet1</span>' +
                        '</div>' +
                      '</div>' +
                    '</div>' +
                    '<div class="file-card-actions">' +
                      '<button type="button" class="btn btn-outline btn-sm" onclick="triggerImportFileInput()">' +
                        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>' +
                        'Ganti Berkas' +
                      '</button>' +
                      '<button type="button" class="btn btn-outline btn-sm" onclick="resetStudentImport()" style="color:#cf2e2e;border-color:#f5c6cb;">' +
                        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
                        'Hapus' +
                      '</button>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
                '<div id="import-file-info" class="import-status-line" style="margin-top:8px;font-size:12px;color:var(--muted);display:none;"></div>' +
              '</div>' +

              '<!-- TAHAP 3: Validasi & Pratinjau Data -->' +
              '<div class="form-subcard">' +
                '<div class="form-subcard-head">' +
                  '<div class="form-subcard-title">' +
                    '<span class="step-pill" id="subcard-step-3">3</span>' +
                    '<span>Validasi & Pratinjau Data</span>' +
                  '</div>' +
                  '<button type="button" id="btn-revalidate" class="btn btn-outline btn-sm" onclick="runStudentImportPreview()">' +
                    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>' +
                    'Validasi Ulang' +
                  '</button>' +
                '</div>' +

                '<div id="import-preview-container">' +
                  '<div class="preview-empty-state">' +
                    '<div class="empty-icon-circle">' +
                      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>' +
                    '</div>' +
                    '<div class="empty-title">Belum Ada Pratinjau Data</div>' +
                    '<div class="empty-desc">Pilih gelombang dan unggah file Excel atau CSV untuk memeriksa kelengkapan data sebelum impor.</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              '<!-- Ringkasan Pasca-Impor -->' +
              '<div id="import-summary-container"></div>' +

              '<!-- TAHAP 4: Tombol Aksi & Konfirmasi Impor -->' +
              '<div class="toolbar" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap;gap:10px;">' +
                '<button type="button" class="btn" id="confirm-import-btn" onclick="confirmStudentImport()" disabled>' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
                  '4. Konfirmasi & Impor Data Valid' +
                '</button>' +
                '<button type="button" class="btn btn-outline" onclick="resetStudentImport()">' +
                  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>' +
                  'Reset File' +
                '</button>' +
                '<button type="button" class="btn btn-outline" onclick="navigate(\'students\')" style="margin-left:auto;">' +
                  'Kembali ke Data Wisudawan' +
                '</button>' +
              '</div>' +

            '</div>' +
          '</div>' +
        '</div>';

      syncCustomSelect('import-period');
      loadStudentImportSetup(null, function () {
        if (APP.importRows && APP.importRows.length) {
          renderDropzoneSelectedFile(
            APP.importFileName,
            APP.importFileSize || 0,
            APP.importRows.length,
            APP.importSheetName || ''
          );
          runStudentImportPreview();
        } else {
          renderDropzoneEmpty();
        }
        updateImportStepper();
      });
    }

    /* Helper Status Stepper Dinamis */
    function updateImportStepper() {
      const periodId = (document.getElementById('import-period') || {}).value || '';
      const hasFile = !!(APP.importRows && APP.importRows.length);
      const hasPreview = !!(APP.importPreview && APP.importPreview.importable !== undefined);
      const isImportable = hasPreview && APP.importPreview.importable > 0;

      const checkIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

      // Step 1: Gelombang Wisuda
      const s1 = document.getElementById('import-step-1');
      const num1 = document.getElementById('import-step-num-1');
      if (s1 && num1) {
        if (periodId) {
          s1.className = 'import-step-card step-completed';
          num1.innerHTML = checkIcon;
        } else {
          s1.className = 'import-step-card step-active';
          num1.textContent = '1';
        }
      }

      // Step 2: Unggah Berkas
      const s2 = document.getElementById('import-step-2');
      const num2 = document.getElementById('import-step-num-2');
      const pill2 = document.getElementById('subcard-step-2');
      if (s2 && num2) {
        if (hasFile) {
          s2.className = 'import-step-card step-completed';
          num2.innerHTML = checkIcon;
          if (pill2) pill2.className = 'step-pill active';
        } else if (periodId) {
          s2.className = 'import-step-card step-active';
          num2.textContent = '2';
          if (pill2) pill2.className = 'step-pill active';
        } else {
          s2.className = 'import-step-card step-pending';
          num2.textContent = '2';
          if (pill2) pill2.className = 'step-pill';
        }
      }

      // Step 3: Validasi & Pratinjau
      const s3 = document.getElementById('import-step-3');
      const num3 = document.getElementById('import-step-num-3');
      const pill3 = document.getElementById('subcard-step-3');
      if (s3 && num3) {
        if (isImportable) {
          s3.className = 'import-step-card step-completed';
          num3.innerHTML = checkIcon;
          if (pill3) pill3.className = 'step-pill active';
        } else if (hasFile) {
          s3.className = 'import-step-card step-active';
          num3.textContent = '3';
          if (pill3) pill3.className = 'step-pill active';
        } else {
          s3.className = 'import-step-card step-pending';
          num3.textContent = '3';
          if (pill3) pill3.className = 'step-pill';
        }
      }

      // Step 4: Konfirmasi Impor
      const s4 = document.getElementById('import-step-4');
      const num4 = document.getElementById('import-step-num-4');
      if (s4 && num4) {
        if (isImportable) {
          s4.className = 'import-step-card step-active';
          num4.textContent = '4';
        } else {
          s4.className = 'import-step-card step-pending';
          num4.textContent = '4';
        }
      }
    }

    /* Helper Drag and Drop Area File */
    function onImportDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      const dropzone = document.getElementById('import-dropzone');
      if (dropzone) dropzone.classList.add('drag-active');
    }

    function onImportDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      const dropzone = document.getElementById('import-dropzone');
      if (dropzone) dropzone.classList.remove('drag-active');
    }

    function onImportFileDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      const dropzone = document.getElementById('import-dropzone');
      if (dropzone) dropzone.classList.remove('drag-active');

      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length > 0) {
        processStudentImportFile(files[0]);
      }
    }

    function triggerImportFileInput() {
      const input = document.getElementById('student-import-file');
      if (input) input.click();
    }

    function formatImportFileSize(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function renderDropzoneSelectedFile(fileName, fileSize, rowCount, sheetName) {
      const prompt = document.getElementById('dropzone-prompt');
      const card = document.getElementById('dropzone-file-card');
      const nameEl = document.getElementById('dropzone-file-name');
      const sizeEl = document.getElementById('dropzone-file-size');
      const rowsEl = document.getElementById('dropzone-file-rows');
      const sheetEl = document.getElementById('dropzone-file-sheet');
      const infoEl = document.getElementById('import-file-info');

      if (prompt) prompt.classList.add('hidden');
      if (card) card.classList.remove('hidden');

      if (nameEl) nameEl.textContent = fileName || 'Berkas Terpilih';
      if (sizeEl) sizeEl.textContent = fileSize ? formatImportFileSize(fileSize) : '';
      if (rowsEl) rowsEl.textContent = (rowCount || 0).toLocaleString('id-ID') + ' baris data';
      if (sheetEl) sheetEl.textContent = sheetName ? 'Sheet: ' + sheetName : 'Data Utama';
      if (infoEl) infoEl.textContent = fileName + ' · ' + (rowCount || 0).toLocaleString('id-ID') + ' baris';
    }

    function renderDropzoneEmpty() {
      const prompt = document.getElementById('dropzone-prompt');
      const card = document.getElementById('dropzone-file-card');
      const infoEl = document.getElementById('import-file-info');

      if (prompt) prompt.classList.remove('hidden');
      if (card) card.classList.add('hidden');
      if (infoEl) infoEl.textContent = 'Belum ada file yang dipilih.';
    }

    function loadStudentImportSetup(selectPeriodId, onComplete) {
      google.script.run
        .withSuccessHandler(function (setup) {

    function processStudentImportFile(file) {
      if (!file) return;
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const preview = document.getElementById('import-preview-container');
      const button = document.getElementById('confirm-import-btn');

      if (file.size > 10 * 1024 * 1024) {
        APP.importRows = null;
        APP.importFileName = '';
        APP.importFileSize = 0;
        button.disabled = true;
        renderDropzoneEmpty();
        updateImportStepper();
        if (preview) {
          preview.innerHTML =
            '<div class="notice notice-error" style="display:flex;align-items:center;gap:10px;">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>' +
              '<div><strong>Batas Ukuran Terlampaui:</strong> Ukuran file melebihi batas 10 MB (' + formatImportFileSize(file.size) + ').</div>' +
            '</div>';
        }
        return;
      }

      if (!window.XLSX) {
        if (preview) {
          preview.innerHTML =
            '<div class="notice notice-warn">Pustaka pembaca Excel (XLSX) belum selesai dimuat. Silakan muat ulang halaman.</div>';
        }
        return;
      }

      if (preview) {
        preview.innerHTML =
          '<div style="text-align:center;padding:36px 20px;background:#fafbfa;border:1px dashed #d5e2d4;border-radius:12px;">' +
            '<span class="spinner-sm" style="width:22px;height:22px;border-width:2.5px;border-color:rgba(7,133,27,0.25);border-top-color:#07851b;margin-bottom:12px;"></span>' +
            '<div style="font-size:14px;font-weight:700;color:#172014;margin-bottom:4px;">Membaca Berkas ' + escapeHtml(file.name) + '...</div>' +
            '<div style="font-size:12px;color:var(--muted);">Mengekstrak baris data dan struktur kolom berkas.</div>' +
          '</div>';
      }
      button.disabled = true;

      const reader = new FileReader();

      reader.onload = function (event) {
        try {
          const workbook = XLSX.read(event.target.result, {
            type: 'array',
            cellDates: true
          });

          const sheetName = workbook.SheetNames[0];
          if (!sheetName) throw new Error('Berkas tidak memiliki sheet yang dapat dibaca.');

          const matrix = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
            header: 1,
            defval: '',
            raw: false,
            blankrows: false
          });

          if (!matrix || matrix.length < 2) {
            throw new Error('Berkas harus memiliki baris header dan setidaknya satu baris data.');
          }

          const headers = matrix[0].map(function (header) {
            return String(header == null ? '' : header).trim();
          });

          if (!headers.some(Boolean)) {
            throw new Error('Header kolom tidak ditemukan pada baris pertama.');
          }

          const rows = matrix.slice(1)
            .filter(function (row) {
              return row.some(function (cell) {
                return String(cell == null ? '' : cell).trim() !== '';
              });
            })
            .map(function (row) {
              const obj = {};
              headers.forEach(function (header, index) {
                if (header) {
                  obj[header] = String(
                    row[index] == null ? '' : row[index]
                  ).trim();
                }
              });
              return obj;
            });

          if (!rows.length) throw new Error('Tidak ada baris data setelah header.');

          if (rows.length > 10000) {
            throw new Error('Berkas berisi lebih dari 10.000 baris. Silakan bagi berkas menjadi beberapa bagian.');
          }

          APP.importRows = rows;
          APP.importFileName = file.name;
          APP.importFileSize = file.size;
          APP.importSheetName = sheetName;
          APP.importPreview = null;

          renderDropzoneSelectedFile(file.name, file.size, rows.length, sheetName);
          updateImportStepper();
          runStudentImportPreview();
        } catch (error) {
          APP.importRows = null;
          APP.importPreview = null;
          APP.importFileName = '';
          APP.importFileSize = 0;
          button.disabled = true;

          renderDropzoneEmpty();
          updateImportStepper();

          if (preview) {
            preview.innerHTML =
              '<div class="notice notice-error" style="display:flex;align-items:center;gap:10px;">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>' +
                '<div><strong>Gagal Membaca Berkas:</strong> ' + escapeHtml(getErrorMessage(error)) + '</div>' +
              '</div>';
          }
        }
      };

      reader.onerror = function () {
        APP.importRows = null;
        APP.importPreview = null;
        button.disabled = true;
        renderDropzoneEmpty();
        updateImportStepper();
        if (preview) {
          preview.innerHTML =
            '<div class="notice notice-error">Gagal membaca berkas dari perangkat Anda.</div>';
        }
      };

      reader.readAsArrayBuffer(file);
    }

    function formatCleanProdiLabel(raw) {
      if (!raw) return '';
      let clean = String(raw).replace(/\s*\([^)]*\)/g, '').trim();
      clean = clean.replace(/^(S[123]|D[34])\s*[-–]\s*/i, '$1 ');
      clean = clean.replace(/[`’]/g, "'");
      return clean;
    }

    function normalizeProdiForMatch(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/\s*\([^)]*\)/g, '')
        .replace(/^(s[123]|d[34])\s*[-–]\s*/i, '$1 ')
        .replace(/\bdan\b/g, '')
        .replace(/[`'’\-–]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function matchProdiToRef(rawProdi, refList) {
      if (!refList || !refList.length) return -1;
      const normRaw = normalizeProdiForMatch(rawProdi);
      let idx = refList.findIndex(function(ref) {
        return normalizeProdiForMatch(ref) === normRaw;
      });
      if (idx !== -1) return idx;

      idx = refList.findIndex(function(ref) {
        const normRef = normalizeProdiForMatch(ref);
        return normRaw.startsWith(normRef) || normRef.startsWith(normRaw);
      });
      return idx;
    }

    function normalizeFacultyKey_(value) {
      return String(value == null ? '' : value)
        .trim()
        .toLowerCase()
        .replace(/[`’'‘‛]/g, "'")
        .replace(/\\'/g, "'")
        .replace(/\s*[-–—]\s*/g, ' - ')
        .replace(/\s+/g, ' ');
    }

    function getOrderedProdisForFaculty(facName) {
      if (!facName) return [];
      if (ORDERED_PRODIS_BY_FACULTY[facName]) return ORDERED_PRODIS_BY_FACULTY[facName];
      const normFac = normalizeFacultyKey_(facName);
      for (const key in ORDERED_PRODIS_BY_FACULTY) {
        if (normalizeFacultyKey_(key) === normFac) {
          return ORDERED_PRODIS_BY_FACULTY[key];
        }
      }
      return [];
    }

    function getFacultyRank(facName) {
      const norm = normalizeFacultyKey_(facName);
      for (let i = 0; i < ORDERED_FACULTIES.length; i++) {
        if (normalizeFacultyKey_(ORDERED_FACULTIES[i]) === norm) return i;
      }
      for (let i = 0; i < ORDERED_FACULTIES.length; i++) {
        const cNorm = normalizeFacultyKey_(ORDERED_FACULTIES[i]);
        if (norm.includes(cNorm) || cNorm.includes(norm)) return i;
      }
      return 999;
    }

    function buildStudentFilterData(rows) {
      rows = rows || [];
      const facultiesSet = new Set();
      const prodiByFac = {};
      const facByProdi = {};

      rows.forEach(function(r) {
        const fac = String(value(r, ['Fakultas']) || '').trim();
        const prodi = String(value(r, ['Program_Studi', 'Program Studi']) || '').trim();
        if (!fac || !prodi) return;

        facultiesSet.add(fac);
        if (!prodiByFac[fac]) prodiByFac[fac] = new Map();

        if (!prodiByFac[fac].has(prodi)) {
          const refList = getOrderedProdisForFaculty(fac);
          const matchedIdx = matchProdiToRef(prodi, refList);
          const label = matchedIdx !== -1 ? refList[matchedIdx] : formatCleanProdiLabel(prodi);
          const rank = matchedIdx !== -1 ? matchedIdx : 999;
          prodiByFac[fac].set(prodi, { raw: prodi, label: label, rank: rank });
        }
        facByProdi[prodi] = fac;
      });

      const sortedFaculties = Array.from(facultiesSet).sort(function(a, b) {
        const rankA = getFacultyRank(a);
        const rankB = getFacultyRank(b);
        if (rankA !== rankB) return rankA - rankB;
        return a.localeCompare(b);
      });

      const sortedProdisByFac = {};
      sortedFaculties.forEach(function(fac) {
        const map = prodiByFac[fac] || new Map();
        const list = Array.from(map.values()).sort(function(a, b) {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.label.localeCompare(b.label);
        });
        sortedProdisByFac[fac] = list;
      });

      return {
        faculties: sortedFaculties,
        prodisByFac: sortedProdisByFac,
        facByProdi: facByProdi
      };
    }

    function getProdisForFaculty(selectedFaculty) {
      if (!selectedFaculty || !studentFilterData) return [];
      if (studentFilterData.prodisByFac[selectedFaculty]) {
        return studentFilterData.prodisByFac[selectedFaculty];
      }
      const norm = normalizeFacultyKey_(selectedFaculty);
      for (const fac in studentFilterData.prodisByFac) {
        if (normalizeFacultyKey_(fac) === norm) {
          return studentFilterData.prodisByFac[fac];
        }
      }
      return [];
    }

    function populateStudentProgramOptions(selectedFaculty, preserveValue) {
      const el = document.getElementById('filter-program');
      if (!el || !studentFilterData) return;

      selectedFaculty = String(selectedFaculty || '').trim();
      let html = '<option value="">Semua program studi</option>';

      if (selectedFaculty) {
        // Menampilkan program studi untuk fakultas yang dipilih
        const prodis = getProdisForFaculty(selectedFaculty);
        prodis.forEach(function(p) {
          html += '<option value="' + escapeAttr(p.raw) + '">' + escapeHtml(p.label) + '</option>';
        });
      } else {
        // "Semua fakultas" dipilih: tampilkan semua program studi dikelompokkan per fakultas
        studentFilterData.faculties.forEach(function(fac) {
          const prodis = studentFilterData.prodisByFac[fac] || [];
          if (!prodis.length) return;
          html += '<optgroup label="' + escapeAttr(fac) + '">';
          prodis.forEach(function(p) {
            html += '<option value="' + escapeAttr(p.raw) + '">' + escapeHtml(p.label) + '</option>';
          });
          html += '</optgroup>';
        });
      }

      el.innerHTML = html;

      // Cek apakah prodi yang dipilih sebelumnya masih berlaku dalam opsi baru
      let isValid = false;
      if (preserveValue) {
        if (selectedFaculty) {
          const prodis = getProdisForFaculty(selectedFaculty);
          isValid = prodis.some(function(p) { return p.raw === preserveValue; });
        } else {
          isValid = Boolean(studentFilterData.facByProdi[preserveValue]);
        }
      }

      if (isValid) {
        el.value = preserveValue;
      } else {
        el.value = '';
      }
      syncCustomSelect('filter-program');
    }

    function onStudentFacultyFilterChange() {
      const facEl = document.getElementById('filter-faculty');
      const prodiEl = document.getElementById('filter-program');
      const selectedFac = facEl ? facEl.value : '';
      const currentProdi = prodiEl ? prodiEl.value : '';
      populateStudentProgramOptions(selectedFac, currentProdi);
      syncCustomSelect('filter-faculty');
    }

    /* Menggunakan helper custom dropdown global dari AppCore.html */

    function loadStudentFilterOptions() {
      google.script.run.withSuccessHandler(function(rows) {
        // 1. Filter Gelombang (Periode)
        const periodEl = document.getElementById('filter-period');
        if (periodEl) {
          const currentVal = periodEl.value;
          let periodOptions = '<option value="">Semua gelombang</option>';
          if (APP.importPeriods && APP.importPeriods.length) {
            periodOptions += APP.importPeriods.map(function(period) {
              const label = [
                period.name,
                period.wave ? 'Gel. ' + period.wave : '',
                period.year
              ].filter(Boolean).join(' · ');
              return '<option value="' + escapeAttr(period.id) + '">' + escapeHtml(label) + '</option>';
            }).join('');
          }
          periodEl.innerHTML = periodOptions;
          if (currentVal && APP.importPeriods && APP.importPeriods.some(function(p){ return p.id === currentVal; })) {
            periodEl.value = currentVal;
          }
        }

        // 2. Olah data filter fakultas dan program studi
        studentFilterData = buildStudentFilterData(rows || []);

        // 3. Dropdown Fakultas (Semua fakultas di urutan pertama)
        const facultyEl = document.getElementById('filter-faculty');
        if (facultyEl) {
          const currentFac = facultyEl.value;
          let facultyHtml = '<option value="">Semua fakultas</option>';
          studentFilterData.faculties.forEach(function(fac) {
            facultyHtml += '<option value="' + escapeAttr(fac) + '">' + escapeHtml(fac) + '</option>';
          });
          facultyEl.innerHTML = facultyHtml;
          if (currentFac) {
            const normCurrent = normalizeFacultyKey_(currentFac);
            const matchedFac = studentFilterData.faculties.find(function(f) {
              return normalizeFacultyKey_(f) === normCurrent;
            });
            if (matchedFac) facultyEl.value = matchedFac;
          }
        }

        // 4. Dropdown Program Studi (Semua program studi di urutan pertama)
        const programEl = document.getElementById('filter-program');
        const currentProgram = programEl ? programEl.value : '';
        populateStudentProgramOptions(facultyEl ? facultyEl.value : '', currentProgram);

        // 5. Dropdown Jenjang (Semua jenjang di urutan pertama)
        const levelEl = document.getElementById('filter-level');
        if (levelEl) {
          const currentLevel = levelEl.value;
          const levelOrder = ['S3', 'S2', 'Profesi', 'S1', 'D4', 'D3'];
          const levels = Array.from(new Set((rows || []).map(function(r) {
            return String(value(r, ['Jenjang']) || '').trim();
          }).filter(Boolean))).sort(function(a, b) {
            const idxA = levelOrder.indexOf(a);
            const idxB = levelOrder.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b);
          });
          levelEl.innerHTML = '<option value="">Semua jenjang</option>' + levels.map(function(l) {
            return '<option value="' + escapeAttr(l) + '">' + escapeHtml(l) + '</option>';
          }).join('');
          if (currentLevel && levels.includes(currentLevel)) {
            levelEl.value = currentLevel;
          }
        }

        // 6. Sinkronisasi tampilan dropdown kustom
        ['filter-period', 'filter-faculty', 'filter-program', 'filter-level'].forEach(syncCustomSelect);
      }).withFailureHandler(showError).searchStudents('');
    }

    function searchStudentRows(reset) {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');
      if (reset) {
        ['student-search','filter-period','filter-faculty','filter-program','filter-level'].forEach(function(id){ const el=document.getElementById(id); if(el) el.value=''; });
        populateStudentProgramOptions('', '');
        ['filter-period', 'filter-faculty', 'filter-program', 'filter-level'].forEach(syncCustomSelect);
        studentCurrentPage = 1;
      }
      const query = (document.getElementById('student-search') || {}).value || '';
      const filters = {
        period: (document.getElementById('filter-period') || {}).value || '',
        faculty: (document.getElementById('filter-faculty') || {}).value || '',
        program: (document.getElementById('filter-program') || {}).value || '',
        level: (document.getElementById('filter-level') || {}).value || ''
      };
      const size = parseInt((document.getElementById('student-page-size') || {}).value || '25',10);
      const target = document.getElementById('student-table');
      if (target) target.innerHTML = '<div class="table-empty">Memuat data...</div>';
      google.script.run.withSuccessHandler(function(rows) {
        studentRowsCache = rows || [];
        const pages = Math.max(1, Math.ceil(studentRowsCache.length / size));
        studentCurrentPage = Math.min(Math.max(1, studentCurrentPage), pages);
        const from = (studentCurrentPage - 1) * size;
        const visible = studentRowsCache.slice(from, from + size);

        if (!visible.length) {
          if (target) target.innerHTML = '<div class="table-empty">Belum ada data untuk ditampilkan.</div>';
        } else {
          const heads = '<thead><tr>' +
            '<th>No.</th>' +
            '<th>NIM</th>' +
            '<th>Nama Lengkap</th>' +
            '<th>Fakultas</th>' +
            '<th>Program Studi</th>' +
            '<th>Jenjang</th>' +
            '<th>Gelombang Wisuda</th>' +
            '<th>Aksi</th>' +
            '</tr></thead>';

          const body = visible.map(function (row, idx) {
            const no = from + idx + 1;
            const nim = escapeHtml(value(row, ['NIM', 'Nomor Induk Mahasiswa']) || '—');
            const nama = escapeHtml(value(row, ['Nama_Lengkap', 'Nama']) || '—');
            const fakultas = escapeHtml(value(row, ['Fakultas']) || '—');
            const prodi = escapeHtml(value(row, ['Program_Studi', 'Program Studi']) || '—');
            const jenjang = escapeHtml(value(row, ['Jenjang']) || '—');
            const gelombang = escapeHtml(formatStudentPeriodLabel(row));
            const rowIdx = from + idx;

            return '<tr>' +
              '<td>' + no + '</td>' +
              '<td>' + nim + '</td>' +
              '<td><strong>' + nama + '</strong></td>' +
              '<td>' + fakultas + '</td>' +
              '<td>' + prodi + '</td>' +
              '<td>' + jenjang + '</td>' +
              '<td>' + gelombang + '</td>' +
              '<td><button class="btn btn-outline btn-sm" onclick="showStudentDetailModal(' + rowIdx + ')">Detail</button></td>' +
              '</tr>';
          }).join('');

          if (target) target.innerHTML = '<div class="table-wrap"><table>' + heads + '<tbody>' + body + '</tbody></table></div>';
        }

        const pager = document.getElementById('student-pagination');
        if (pager) {
          let buttons = '';
          const lo = Math.max(1, studentCurrentPage - 2), hi = Math.min(pages, studentCurrentPage + 2);
          for (let p=lo; p<=hi; p++) buttons += '<button class="student-page-btn '+(p===studentCurrentPage?'active':'')+'" onclick="goStudentPage('+p+')">'+p+'</button>';
          pager.innerHTML = '<span class="student-page-summary">Menampilkan '+(studentRowsCache.length ? from+1 : 0)+'–'+Math.min(from+visible.length,studentRowsCache.length)+' dari '+studentRowsCache.length+' data</span><div class="student-pagination-pages"><button class="student-page-btn" '+(studentCurrentPage<=1?'disabled':'')+' onclick="goStudentPage('+(studentCurrentPage-1)+')">Sebelumnya</button>'+buttons+'<button class="student-page-btn" '+(studentCurrentPage>=pages?'disabled':'')+' onclick="goStudentPage('+(studentCurrentPage+1)+')">Berikutnya</button></div>';
        }
      }).withFailureHandler(showError).searchStudents(query, filters);
    }

    function goStudentPage(page) {
      studentCurrentPage = page;
      searchStudentRows();
    }

    function formatStudentPeriodLabel(row) {
      if (!row) return '—';
      const directName = String(value(row, ['Nama_Periode', 'Nama Periode', 'Gelombang', 'Gelombang_Wisuda']) || '').trim();
      if (directName) return directName;
      const periodId = String(value(row, ['ID_Periode', 'ID Periode']) || '').trim();
      if (periodId && APP.importPeriods && APP.importPeriods.length) {
        const found = APP.importPeriods.find(function (p) { return p.id === periodId; });
        if (found) {
          return [found.name, found.wave ? 'Gel. ' + found.wave : '', found.year].filter(Boolean).join(' · ');
        }
      }
      return '—';
    }

    function showStudentDetailModal(index) {
      const row = studentRowsCache[index];
      if (!row) return;

      const existing = document.getElementById('student-detail-modal');
      if (existing) existing.remove();

      const statusDataVal = value(row, ['Status_Data', 'Status Data']);
      const statusDataHtml = statusDataVal ? detailBox('Status Data', statusDataVal) : '';

      const modalHtml = '<div id="student-detail-modal" class="student-modal-overlay" onclick="if(event.target===this)closeStudentDetailModal()">' +
        '<div class="student-modal-card">' +
          '<div class="panel-head">' +
            '<div><h2>Biodata Lengkap Wisudawan</h2><div class="import-status-line">Data induk hasil impor SIAKAD</div></div>' +
            '<button class="btn btn-outline btn-sm" onclick="closeStudentDetailModal()">Tutup</button>' +
          '</div>' +
          '<div class="panel-body">' +
            '<div class="student-card">' +
              detailBox('Nama Lengkap', value(row, ['Nama_Lengkap', 'Nama'])) +
              detailBox('NIM', value(row, ['NIM', 'Nomor Induk Mahasiswa'])) +
              detailBox('Jenis Kelamin', value(row, ['Jenis_Kelamin', 'Jenis Kelamin'])) +
              detailBox('Tempat Lahir', value(row, ['Tempat_Lahir', 'Tempat Lahir'])) +
              detailBox('Tanggal Lahir', value(row, ['Tanggal_Lahir', 'Tanggal Lahir'])) +
              detailBox('Fakultas', value(row, ['Fakultas'])) +
              detailBox('Program Studi', value(row, ['Program_Studi', 'Program Studi'])) +
              detailBox('Jenjang', value(row, ['Jenjang'])) +
              detailBox('IPK', value(row, ['IPK', 'Indeks Prestasi Kumulatif', 'Indeks_Prestasi'])) +
              detailBox('Predikat', value(row, ['Predikat', 'Predikat Kelulusan', 'Yudisium'])) +
              detailBox('Gelombang Wisuda', formatStudentPeriodLabel(row)) +
              statusDataHtml +
              '<div class="detail-box" style="grid-column:1/-1"><span>Judul Skripsi / Tugas Akhir</span><strong>' +
                escapeHtml(value(row, ['Judul_Skripsi', 'Judul Skripsi', 'Judul_TA', 'Judul TA', 'Judul', 'Tugas_Akhir']) || 'Belum tersedia') +
              '</strong></div>' +
            '</div>' +
            '<div class="toolbar" style="margin-top:18px;justify-content:flex-end">' +
              '<button class="btn btn-outline" onclick="closeStudentDetailModal()">Tutup</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeStudentDetailModal() {
      const modal = document.getElementById('student-detail-modal');
      if (modal) modal.remove();
    }
