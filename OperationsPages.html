          timeDetails =
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Waktu Masuk</span>' +
              '<span class="scan-identity-val" style="color:#15803d;">' + escapeHtml(result.time) + '</span>' +
            '</div>';
        }

        studentHtml =
          '<div class="scan-identity-card">' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Nama Wisudawan</span>' +
              '<span class="scan-identity-val" style="font-size:14px;color:#07851b;font-weight:900;">' + escapeHtml(s.name || '—') + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">NIM Resmi</span>' +
              '<span class="scan-identity-val" style="font-family:monospace;font-size:13px;">' + escapeHtml(s.nim || '—') + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">ID Wisudawan</span>' +
              '<span class="scan-identity-val">' + escapeHtml(s.id || '—') + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Fakultas / Prodi</span>' +
              '<span class="scan-identity-val">' + escapeHtml((s.faculty || '') + (s.prodi ? ' / ' + s.prodi : '')) + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Nomor Kursi</span>' +
              '<span class="scan-identity-val"><span class="badge badge-green">' + escapeHtml(s.seat || '—') + '</span></span>' +
            '</div>' +
            timeDetails +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Status Akses Tamu</span>' +
              '<span class="scan-identity-val">' + statusBadge + '</span>' +
            '</div>' +
          '</div>';

        // Mekanisme keluar terkontrol jika tamu sedang berada di dalam gedung
        if (isInside) {
          const checkinForModal = result.previousCheckinTime || result.time || '';
          exitActionHtml =
            '<div class="scan-exit-box">' +
              '<div style="font-size:12.5px;color:#0369a1;font-weight:700;margin-bottom:10px;">' +
                'Tamu saat ini tercatat berada di dalam gedung. Hendak mencatat tamu keluar?' +
              '</div>' +
              '<button type="button" class="btn btn-outline" style="border-color:#0284c7;color:#0284c7;font-weight:800;padding:8px 18px;" ' +
                'data-id="' + escapeAttr(s.id) + '" ' +
                'data-name="' + escapeAttr(s.name) + '" ' +
                'data-checkin="' + escapeAttr(checkinForModal) + '" ' +
                'data-seat="' + escapeAttr(s.seat) + '" ' +
                'data-nim="' + escapeAttr(s.nim) + '" ' +
                'onclick="openGuestExitModal(this.dataset.id, this.dataset.name, this.dataset.checkin, this.dataset.seat, this.dataset.nim)">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>' +
                '<span>Catat Tamu Keluar</span>' +
              '</button>' +
            '</div>';
        }
      }

      const noticeClass = result.success ? 'notice-success' : (code === 'DITOLAK_TIDAK_ADA_SESI_MASUK' ? 'notice-warn' : 'notice-error');

      target.innerHTML =
        '<div class="scan-result-card">' +
          '<div class="scan-badge-banner ' + bannerClass + '">' +
            iconSvg +
            '<span>' + escapeHtml(badgeText) + '</span>' +
          '</div>' +
          '<div class="notice ' + noticeClass + '" style="margin-bottom:0;font-size:13.5px;line-height:1.45;">' +
            escapeHtml(result.message || 'Pemindaian selesai.') +
          '</div>' +
          studentHtml +
          exitActionHtml +
        '</div>';

      // Update riwayat lokal sesi ini
      addScanToHistoryList_(badgeText, result.student ? result.student.name : 'QR', result.success);
    }

    // Modal Konfirmasi Tamu Keluar Terkontrol
    function handleGuestExitKeydown_(e) {
      if (e.key === 'Escape' && APP.pendingGuestExit && !APP.pendingGuestExit.isSubmitting) {
        closeGuestExitModal();
      }
    }

    function openGuestExitModal(studentId, studentName, checkinTime, seat, nim) {
      if (!studentId) return;

      APP.pendingGuestExit = {
        id: studentId,
        name: studentName,
        checkinTime: checkinTime,
        seat: seat,
        nim: nim,
        isSubmitting: false
      };

      const modalHtml = '<div id="guest-exit-modal-wrap">' +
        '<div id="guest-exit-modal" class="student-modal-overlay" onclick="if(event.target===this)closeGuestExitModal()">' +
          '<div class="call-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="guest-exit-title">' +
            '<div class="call-confirm-header">' +
              '<h3 id="guest-exit-title" class="call-confirm-title">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="color:#0284c7;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>' +
                'Konfirmasi Tamu Keluar' +
              '</h3>' +
              '<button type="button" class="btn btn-outline btn-sm" id="btn-guest-exit-close" onclick="closeGuestExitModal()" aria-label="Tutup" style="min-height:auto;padding:3px 8px;border-radius:6px;font-size:12px;">✕</button>' +
            '</div>' +
            '<div class="call-student-card">' +
              '<div class="call-student-name">' + escapeHtml(studentName) + '</div>' +
              '<div class="call-student-meta">' +
                '<span><strong>NIM:</strong> ' + escapeHtml(nim || '—') + '</span>' +
                '<span>•</span>' +
                '<span><strong>Kursi:</strong> <span class="badge badge-green" style="font-size:10px;padding:2px 7px;">' + escapeHtml(seat || '—') + '</span></span>' +
                (checkinTime ? ('<span>•</span><span><strong>Masuk:</strong> ' + escapeHtml(checkinTime) + '</span>') : '') +
              '</div>' +
            '</div>' +
            '<div class="call-status-flow">' +
              '<div class="call-status-box">' +
                '<div class="call-status-label">Status Saat Ini</div>' +
                '<span class="badge badge-green">DI DALAM GEDUNG</span>' +
              '</div>' +
              '<div class="call-status-arrow">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>' +
              '</div>' +
              '<div class="call-status-box">' +
                '<div class="call-status-label">Status Tujuan</div>' +
                '<span class="badge" style="background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;">DI LUAR GEDUNG</span>' +
              '</div>' +
            '</div>' +
            '<p style="margin:0 0 20px 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.5;">' +
              'Apakah Anda yakin ingin mencatat tamu dari <strong>' + escapeHtml(studentName) + '</strong> keluar dari gedung? Setelah keluar dicatat, kuota tamu wisudawan ini akan kembali tersedia.' +
            '</p>' +
            '<div style="display:flex;justify-content:flex-end;gap:10px;">' +
              '<button type="button" class="btn btn-outline btn-sm" id="btn-guest-exit-cancel" onclick="closeGuestExitModal()">Batal</button>' +
              '<button type="button" class="btn btn-sm btn-primary" id="btn-guest-exit-submit" onclick="executeConfirmedGuestExit()" style="background:#0284c7;border-color:#0284c7;">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>' +
                '<span>Konfirmasi Keluar</span>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

      const wrap = document.createElement('div');
      wrap.innerHTML = modalHtml;
      document.body.appendChild(wrap.firstElementChild);

      window.addEventListener('keydown', handleGuestExitKeydown_);

      const submitBtn = document.getElementById('btn-guest-exit-submit');
      if (submitBtn) submitBtn.focus();
    }

    function closeGuestExitModal(force) {
      if (!force && APP.pendingGuestExit && APP.pendingGuestExit.isSubmitting) return;
      window.removeEventListener('keydown', handleGuestExitKeydown_);
      APP.pendingGuestExit = null;
      const wrap = document.getElementById('guest-exit-modal-wrap');
      if (wrap) wrap.remove();
    }

    function executeConfirmedGuestExit() {
      if (!APP.pendingGuestExit || APP.pendingGuestExit.isSubmitting) return;
      APP.pendingGuestExit.isSubmitting = true;

      const submitBtn = document.getElementById('btn-guest-exit-submit');
      const cancelBtn = document.getElementById('btn-guest-exit-cancel');
      const closeBtn = document.getElementById('btn-guest-exit-close');

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-sm"></span> <span>Memproses...</span>';
      }
      if (cancelBtn) cancelBtn.disabled = true;
      if (closeBtn) closeBtn.disabled = true;

      const studentId = APP.pendingGuestExit.id;

      google.script.run
        .withSuccessHandler(function (result) {
          closeGuestExitModal(true);
          renderScanResult(result);
          showToast(result.message || 'Sesi keluar berhasil dicatat.');
          setTimeout(function () {
            APP.scanBusy = false;
          }, 1400);
        })
        .withFailureHandler(function (error) {
          if (APP.pendingGuestExit) {
            APP.pendingGuestExit.isSubmitting = false;
          }
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Konfirmasi Keluar</span>';
          }
          if (cancelBtn) cancelBtn.disabled = false;
          if (closeBtn) closeBtn.disabled = false;
          showError(error);
          setTimeout(function () {
            APP.scanBusy = false;
          }, 1400);
        })
        .recordGuestExit(studentId, 'Petugas Pintu');
    }

    function addScanToHistoryList_(badgeText, studentName, isSuccess) {
      APP.scanHistory = APP.scanHistory || [];
      const timeStr = new Date().toLocaleTimeString('id-ID');
      APP.scanHistory.unshift({
        time: timeStr,
        badge: badgeText,
        name: studentName,
        success: isSuccess
      });
      if (APP.scanHistory.length > 5) APP.scanHistory.pop();

      const box = document.getElementById('scanner-history-box');
      const list = document.getElementById('scanner-history-list');
      if (!box || !list) return;

      box.style.display = 'block';
      let html = '';
      APP.scanHistory.forEach(function (h) {
        const color = h.success ? '#15803d' : '#b91c1c';
        html += '<div style="padding:6px 10px;background:#fbfdfa;border-radius:8px;border:1px solid #e2ebe1;display:flex;justify-content:space-between;align-items:center;font-size:12px;">' +
          '<span><strong style="color:' + color + ';">[' + escapeHtml(h.badge) + ']</strong> ' + escapeHtml(h.name) + '</span>' +
          '<span style="color:var(--muted);font-family:monospace;font-size:11px;">' + h.time + '</span>' +
        '</div>';
      });
      list.innerHTML = html;
    }

    function handleScannedGuest(text, requestId) {
      if (!['Admin','Panitia'].includes(APP.session.role)) {
        APP.scanBusy = false;
        return showToast('Akses ditolak.');
      }

      const raw = String(text || '').trim();
      const reqId = String(requestId || ('TX-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase())).trim();

      if (!raw) {
        APP.scanBusy = false;
        sendResultToScannerPopup_({
          type: 'UIN_ARRANIRY_SCAN_RESULT',
          requestId: reqId,
          result: {
            success: false,
            resultCode: 'QR_EMPTY',
            badge: 'QR KOSONG',
            message: 'Data QR kosong.',
            requestId: reqId
          }
        });
        return showToast('Data QR kosong.');
      }

      displayScanProcessing_(raw);

      let isFinished = false;
      // Client-side safety timeout (12 detik) untuk mencegah UI macet jika jaringan/Apps Script hang
      const clientTimeoutId = setTimeout(function () {
        if (!isFinished) {
          isFinished = true;
          APP.scanBusy = false;
          console.warn('[' + reqId + '] Timeout pemanggilan backend Apps Script (12 detik)');
          const timeoutRes = {
            success: false,
            resultCode: 'TIMEOUT_UNCONFIRMED',
            badge: 'TRANSAKSI BELUM TERKONFIRMASI',
            message: 'Server belum memberikan konfirmasi akhir. Periksa status presensi sebelum mencoba kembali.',
            requestId: reqId
          };
          renderScanResult(timeoutRes);
          sendResultToScannerPopup_({
            type: 'UIN_ARRANIRY_SCAN_RESULT',
            requestId: reqId,
            result: timeoutRes
          });
        }
      }, 12000);

      const successCallback = function (result) {
        if (isFinished) return;
        isFinished = true;
        clearTimeout(clientTimeoutId);

        if (!result) {
          result = {
            success: false,
            resultCode: 'EMPTY_RESPONSE',
            badge: 'RESPONS KOSONG',
            message: 'Server mengembalikan respons kosong.'
          };
        }
        result.requestId = reqId;

        renderScanResult(result);
        sendResultToScannerPopup_({
          type: 'UIN_ARRANIRY_SCAN_RESULT',
          requestId: reqId,
          result: result
        });

        showToast(result.message || 'Pemindaian selesai.');
        setTimeout(function () {
          APP.scanBusy = false;
        }, 1000);
      };

      const failureCallback = function (error) {
        if (isFinished) return;
        isFinished = true;
        clearTimeout(clientTimeoutId);

        const errorMsg = getErrorMessage(error);
        console.error('[' + reqId + '] FailureHandler backend:', errorMsg);

        const errResult = {
          success: false,
          resultCode: 'SERVER_ERROR',
          badge: 'TRANSAKSI GAGAL',
          message: errorMsg || 'Terjadi kesalahan sistem di server Apps Script.',
          requestId: reqId
        };
        renderScanResult(errResult);
        sendResultToScannerPopup_({
          type: 'UIN_ARRANIRY_SCAN_RESULT',
          requestId: reqId,
          result: errResult
        });

        showToast(errorMsg);
        setTimeout(function () {
          APP.scanBusy = false;
        }, 1000);
      };

      // Alur adaptif otomatis dengan correlation ID requestId
      google.script.run
        .withSuccessHandler(successCallback)
        .withFailureHandler(failureCallback)
        .processGuestScan(raw, 'QR Code', reqId);
    }

    function submitManualGuest() {
      const input = document.getElementById('manual-guest-id');
      const val = input ? input.value.trim() : '';

      if (!val) return showToast('Masukkan NIM atau ID wisudawan terlebih dahulu.');
      if (APP.scanBusy) return;

      const manualReqId = 'MAN-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      input.value = ''; // Bersihkan input agar operator siap mengetik berikutnya
      APP.scanBusy = true;
      APP.activeCameraCode = null;
      handleScannedGuest(val, manualReqId);
    }



    /* LAPORAN */

    function renderReports() {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      document.getElementById('page-content').innerHTML =
        pageHeader('Laporan','Ekspor data untuk kebutuhan administrasi.') +
        '<div class="notice notice-info">Laporan dapat diunduh sebagai CSV dan dibuka menggunakan Excel.</div>' +
        '<div class="panel"><div class="panel-head"><h2>Ekspor data</h2></div>' +
        '<div class="panel-body"><div class="toolbar">' +
          '<button class="btn" onclick="exportReport(\'students\')">Data Wisudawan</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'calls\')">Daftar Panggil</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'seats\')">Denah Kursi</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'guests\')">Data Tamu</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'guestAttendance\')">Presensi Tamu</button>' +
        '</div><div id="report-status" class="import-status-line" style="margin-top:15px"></div></div></div>';
    }

    function exportReport(key) {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const status = document.getElementById('report-status');
      if (!status) return;

      status.textContent = 'Menyiapkan laporan...';

      function download(data) {
        const rows = data[key] || [];
        if (!rows.length) {
          status.textContent = 'Tidak ada data untuk diekspor.';
          return;
        }

        const headers = Object.keys(rows[0]);
        const csv = [headers]
          .concat(rows.map(function (row) {
            return headers.map(function (header) { return row[header]; });
          }))
          .map(function (row) {
            return row.map(csvCell).join(',');
          }).join('\r\n');

        const blob = new Blob(['\uFEFF' + csv], {
          type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        a.href = url;
        a.download = key + '_wisuda.csv';

        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        status.textContent = 'Laporan disiapkan: ' + rows.length + ' baris.';
      }

      if (APP.reportCache) {
        download(APP.reportCache);
        return;
      }

      google.script.run
        .withSuccessHandler(function (data) {
          APP.reportCache = data;
          download(data);
        })
        .withFailureHandler(function (error) {
          status.textContent = getErrorMessage(error);
        })
        .getReportData();
    }

    function csvCell(value) {
      let text = String(value == null ? '' : value);
      if (/^[=+@]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    }

    /* TABEL DAN UTILITAS */

    function buildTable(rows, columns, actionRenderer) {
      if (!rows || !rows.length) {
        return '<div class="table-empty">Belum ada data untuk ditampilkan.</div>';
      }

      const heads = '<thead><tr>' +
        columns.map(function (column) {
          return '<th>' + escapeHtml(column[1]) + '</th>';
        }).join('') +
        (actionRenderer ? '<th>Aksi</th>' : '') +
        '</tr></thead>';

      const body = rows.map(function (row) {
        return '<tr>' +
          columns.map(function (column) {
            return '<td>' + formatCell(
              column[0],
              value(row, [column[0]])
            ) + '</td>';
          }).join('') +
          (actionRenderer ? '<td>' + actionRenderer(row) + '</td>' : '') +
          '</tr>';
      }).join('');

      return '<div class="table-wrap"><table>' +
        heads + '<tbody>' + body + '</tbody></table></div>';
    }

    function formatCell(key, val) {
      const safe = escapeHtml(val || '—');

      if (/status/i.test(key)) {
        let cls = 'badge';
        const normalized = String(val || '').toLowerCase();

        if (
          normalized.includes('sudah') ||
          normalized.includes('hadir') ||
          normalized === 'aktif'
        ) {
          cls += ' badge-green';
        } else if (
          normalized.includes('belum') ||
          normalized.includes('siap')
        ) {
          cls += ' badge-yellow';
        } else if (
          normalized.includes('nonaktif') ||
          normalized.includes('batal')
        ) {
          cls += ' badge-red';
        }

        return '<span class="' + cls + '">' + safe + '</span>';
      }

      return safe;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeJs(value) {
      return String(value == null ? '' : value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
    }

    function getErrorMessage(error) {
      return error && error.message
        ? error.message
        : String(error || 'Terjadi kesalahan.');
    }

    function showError(error) {
      showToast(getErrorMessage(error));
      console.error(error);
    }

    let toastTimer;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.add('hidden');
      }, 3500);
    }

    function logout() {
      stopScanner();
      APP.session = null;
      APP.dashboard = null;
      APP.reportCache = null;
      APP.importRows = null;
      APP.importPreview = null;
      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.logoutSession === 'function') {
        google.script.run.logoutSession();
      }
      showLanding();
    }

    // Landing page selalu menjadi halaman pertama.
    showOnly('landing-view');
</script>
