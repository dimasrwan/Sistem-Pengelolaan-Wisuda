<script>
    /* STATE MODUL OPERATIONS */
    APP.callListFilters = APP.callListFilters || { day: '', period: '' };
    APP.seatMapFilters = APP.seatMapFilters || { day: '1', period: '' };
    APP.seatViewMode = APP.seatViewMode || 'visual'; // 'visual' atau 'table'

    function renderCalls() {
      const role = APP.session.role;

      if (role === 'Wisudawan') {
        document.getElementById('page-content').innerHTML =
          pageHeader('Daftar Panggil Saya', 'Informasi pemanggilan wisuda Anda.') +
          '<div id="wisudawan-call-container">' +
          '<div class="panel" style="padding:32px 20px; text-align:center; color:var(--muted);">' +
          '<span class="spinner" style="margin-right:8px;"></span>Memuat informasi pemanggilan Anda...' +
          '</div>' +
          '</div>';

        // Render initial cached data if already present in APP.dashboard
        if (APP.dashboard && APP.dashboard.callList && APP.dashboard.callList.length > 0) {
          renderWisudawanCallCard(APP.dashboard.callList);
        }

        google.script.run
          .withSuccessHandler(function (rows) {
            APP.dashboard = APP.dashboard || {};
            APP.dashboard.callList = rows || [];
            renderWisudawanCallCard(rows);
          })
          .withFailureHandler(function (error) {
            const target = document.getElementById('wisudawan-call-container');
            if (target && (!APP.dashboard || !APP.dashboard.callList || !APP.dashboard.callList.length)) {
              const msg = getErrorMessage(error);
              target.innerHTML =
                '<div class="notice notice-danger" style="margin-top:12px; padding:20px; border-radius:12px;">' +
                '<h3 style="margin:0 0 8px 0; color:var(--red); font-size:16px;">Gagal Memuat Data Pemanggilan</h3>' +
                '<p style="margin:0 0 14px 0;">' + escapeHtml(msg) + '</p>' +
                '<button class="btn btn-outline btn-sm" onclick="renderCalls()">Coba Lagi</button>' +
                '</div>';
            }
          })
          .getCallList();
        return;
      }

      if (role !== 'Admin') return showToast('Akses ditolak.');

      const dayFilter = APP.callListFilters.day || '';
      const periodFilter = APP.callListFilters.period || '';

      document.getElementById('page-content').innerHTML =
        pageHeader('Daftar Panggil','Tinjau, filter, dan perbarui status pemanggilan wisudawan.') +
        '<div class="panel" style="margin-bottom:15px;">' +
        '<div class="panel-body responsive-filter-bar">' +
        '<div class="responsive-filter-inputs">' +
        '<div><label style="font-size:11px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px;">Filter Hari Wisuda</label>' +
        '<select id="call-filter-day" class="field" onchange="onCallDayFilterChange(this.value)">' +
        '<option value="" ' + (!dayFilter ? 'selected' : '') + '>Semua Hari</option>' +
        '<option value="1" ' + (dayFilter === '1' ? 'selected' : '') + '>Hari Pertama (Selasa)</option>' +
        '<option value="2" ' + (dayFilter === '2' ? 'selected' : '') + '>Hari Kedua (Rabu)</option>' +
        '<option value="3" ' + (dayFilter === '3' ? 'selected' : '') + '>Hari Ketiga (Kamis)</option>' +
        '</select></div>' +
        '</div>' +
        '<div class="responsive-filter-actions">' +
        '<button class="btn btn-outline btn-sm" onclick="openCallListReportModal()">Pratinjau / Cetak Laporan PDF</button>' +
        '<button class="btn btn-outline btn-sm" onclick="renderCalls()">Muat ulang</button>' +
        '</div>' +
        '</div></div>' +
        '<div class="panel"><div class="panel-head"><h2>Daftar pemanggilan</h2>' +
        '<span id="calls-count" style="font-size:12px; font-weight:700; color:var(--muted);"></span></div>' +
        '<div class="panel-body"><div id="calls-table">Memuat data...</div></div></div>';

      syncCustomSelect('call-filter-day');

      google.script.run
        .withSuccessHandler(function (rows) {
          const target = document.getElementById('calls-table');
          if (!target) return;

          APP.currentCallsData = rows || [];
          const countTarget = document.getElementById('calls-count');
          if (countTarget) countTarget.textContent = 'Total: ' + (rows ? rows.length : 0) + ' wisudawan';

          target.innerHTML = buildTable(rows, [
            ['ID_Panggil','ID Panggil'],
            ['Urutan_Panggil','Urutan'],
            ['Nama_Wisudawan','Nama Wisudawan'],
            ['NIM','NIM'],
            ['Fakultas','Fakultas'],
            ['Program_Studi','Program Studi'],
            ['Nomor_Kursi','Kursi'],
            ['Status_Panggil','Status']
          ], function (row) {
            return renderCallActionButton(row);
          });
        })
        .withFailureHandler(showError)
        .getCallList(APP.callListFilters);
    }

    function renderWisudawanCallCard(rows) {
      const target = document.getElementById('wisudawan-call-container');
      if (!target) return;

      if (!rows || rows.length === 0) {
        target.innerHTML =
          '<div class="panel" style="padding:24px; border-radius:12px; border-left:4px solid #b45309; background:#fffdfa;">' +
          '<div style="display:flex; align-items:flex-start; gap:16px;">' +
          '<div style="font-size:24px; line-height:1;">ℹ️</div>' +
          '<div style="flex:1;">' +
          '<h3 style="margin:0 0 6px 0; font-size:16px; font-weight:700; color:#92400e;">Data Pemanggilan Belum Tersedia</h3>' +
          '<p style="margin:0 0 14px 0; font-size:14px; color:#78350f; line-height:1.5;">' +
          'Data pemanggilan Anda belum tersedia. Silakan hubungi panitia wisuda.' +
          '</p>' +
          '<button class="btn btn-outline btn-sm" onclick="renderCalls()">Muat Ulang</button>' +
          '</div>' +
          '</div>' +
          '</div>';
        return;
      }

      const call = rows[0];
      const urutan = call.Urutan_Panggil ? escapeHtml(call.Urutan_Panggil) : '—';
      const statusRaw = String(call.Status_Panggil || 'Belum Dipanggil').trim();
      const sLower = statusRaw.toLowerCase();

      // Kelompok / Fakultas
      const kelompok = escapeHtml(call.Kelompok_Panggil || call.Fakultas ||
        (APP.dashboard && APP.dashboard.student && APP.dashboard.student.Fakultas) || '—');

      // Nomor Kursi
      const kursi = escapeHtml(call.Nomor_Kursi ||
        (APP.dashboard && APP.dashboard.seats && APP.dashboard.seats[0] && APP.dashboard.seats[0].Nomor_Kursi) ||
        (APP.dashboard && APP.dashboard.student && APP.dashboard.student.Nomor_Kursi) || '—');

      // Waktu Pemanggilan
      let waktuText = 'Belum tersedia';
      if (call.Waktu_Panggil && String(call.Waktu_Panggil).trim() !== '') {
        waktuText = escapeHtml(call.Waktu_Panggil);
      }

      // Status Badge & Panduan
      let statusBadgeClass = 'wisudawan-call-status-yellow';
      let guideClass = 'wisudawan-call-guide-yellow';
      let guideIcon = '⏳';
      let guideText = 'Perhatikan arahan panitia dan tunggu nama Anda dipanggil.';

      if (sLower.includes('sudah') || sLower.includes('hadir')) {
        statusBadgeClass = 'wisudawan-call-status-green';
        guideClass = 'wisudawan-call-guide-green';
        guideIcon = '✅';
        guideText = 'Pemanggilan Anda telah dikonfirmasi oleh panitia.';
      } else if (sLower.includes('siap')) {
        statusBadgeClass = 'wisudawan-call-status-blue';
        guideClass = 'wisudawan-call-guide-blue';
        guideIcon = '📢';
        guideText = 'Bersiaplah mengikuti arahan panitia untuk proses pemanggilan.';
      } else if (sLower.includes('belum')) {
        statusBadgeClass = 'wisudawan-call-status-yellow';
        guideClass = 'wisudawan-call-guide-yellow';
        guideIcon = '⏳';
        guideText = 'Perhatikan arahan panitia dan tunggu nama Anda dipanggil.';
      } else {
        statusBadgeClass = 'badge';
        guideClass = 'wisudawan-call-guide-neutral';
        guideIcon = 'ℹ️';
        guideText = 'Ikuti arahan panitia wisuda pada saat prosesi pemanggilan berlangsung.';
      }

      let html = '<div class="wisudawan-call-card">';

      // Header card
      html += '<div class="wisudawan-call-header">' +
        '<div style="display:flex; align-items:center; gap:8px;">' +
        '<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primary);"></span>' +
        '<span style="font-size:13px; font-weight:800; color:var(--ink);">Informasi Pemanggilan Pribadi</span>' +
        '</div>' +
        '<button class="btn btn-outline btn-sm" onclick="renderCalls()">Muat Ulang</button>' +
        '</div>';

      // Body card
      html += '<div class="wisudawan-call-body">';

      // Main box: Giant Urutan Pemanggilan + Status Badge
      html += '<div class="wisudawan-call-main-box">' +
        '<div>' +
        '<div class="wisudawan-call-seq-label">Urutan Pemanggilan Anda</div>' +
        '<div class="wisudawan-call-seq-num">' + urutan + '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
        '<div style="font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase;">Status Saat Ini</div>' +
        '<span class="wisudawan-call-status-badge ' + statusBadgeClass + '">' +
        escapeHtml(statusRaw) +
        '</span>' +
        '</div>' +
        '</div>';

      // Grid of Details: Kelompok, Kursi, Waktu
      html += '<div class="wisudawan-call-grid">' +
        '<div class="wisudawan-call-grid-item">' +
        '<span class="wisudawan-call-grid-label">Kelompok Wisuda</span>' +
        '<div class="wisudawan-call-grid-val">' + kelompok + '</div>' +
        '</div>' +
        '<div class="wisudawan-call-grid-item">' +
        '<span class="wisudawan-call-grid-label">Nomor Kursi</span>' +
        '<div class="wisudawan-call-grid-val" style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px;">' +
        '<span>' + kursi + '</span>' +
        '<button type="button" class="btn btn-outline btn-sm" onclick="navigate(\'seats\')" style="font-size:11px; padding:3px 8px; border-radius:6px; line-height:1.2;">Lihat Denah Kursi →</button>' +
        '</div>' +
        '</div>' +
        '<div class="wisudawan-call-grid-item">' +
        '<span class="wisudawan-call-grid-label">Waktu Pemanggilan</span>' +
        '<div class="wisudawan-call-grid-val" style="font-size:14px; font-weight:600; color:' + (waktuText === 'Belum tersedia' ? 'var(--muted)' : 'var(--ink)') + ';">' +
        waktuText +
        '</div>' +
        '</div>' +
        '</div>';

      html += '</div>'; // end wisudawan-call-body
      html += '</div>'; // end wisudawan-call-card

      // Panduan Pemanggilan Panel
      html += '<div class="wisudawan-call-guide-panel ' + guideClass + '">' +
        '<div style="font-size:22px; line-height:1; flex-shrink:0;">' + guideIcon + '</div>' +
        '<div>' +
        '<div style="font-size:14px; font-weight:800; margin-bottom:3px;">Panduan Pemanggilan</div>' +
        '<div style="font-size:13.5px; line-height:1.5;">' + escapeHtml(guideText) + '</div>' +
        '</div>' +
        '</div>';

      target.innerHTML = html;
    }

    /* =========================================================
       QR UNDANGAN TAMU (ROLE WISUDAWAN)
       ========================================================= */

    function renderGuestQr() {
      if (APP.session.role !== 'Wisudawan') {
        showToast('Akses ditolak.');
        return;
      }

      document.getElementById('page-content').innerHTML =
        pageHeader('QR Undangan Tamu', 'Unduh QR undangan untuk satu orang tamu yang mewakili Anda.') +
        '<div id="guest-qr-container" class="guest-qr-container">' +
          '<div class="panel" style="padding:32px 20px; text-align:center; color:var(--muted);">' +
            '<span class="spinner" style="margin-right:8px;"></span>Memuat data QR undangan tamu...' +
          '</div>' +
        '</div>' +
        '<div id="guest-qr-print-container" style="display:none;"></div>';

      google.script.run
        .withSuccessHandler(function (res) {
          renderGuestQrView(res);
        })
        .withFailureHandler(function (error) {
          renderGuestQrError(error);
        })
        .getMyGuestQrData();
    }

    function renderGuestQrError(error) {
      const target = document.getElementById('guest-qr-container');
      if (!target) return;
      const msg = getErrorMessage(error);
      target.innerHTML =
        '<div class="notice notice-danger" style="margin-top:12px; padding:20px; border-radius:12px;">' +
          '<h3 style="margin:0 0 8px 0; color:var(--red); font-size:16px;">Gagal Memuat Data QR Undangan</h3>' +
          '<p style="margin:0 0 14px 0;">' + escapeHtml(msg) + '</p>' +
          '<button class="btn btn-outline btn-sm" onclick="renderGuestQr()">Coba Lagi</button>' +
        '</div>';
    }

    function renderGuestQrView(res) {
      const target = document.getElementById('guest-qr-container');
      if (!target) return;

      if (!res || !res.success) {
        const isMissingNim = res && res.code === 'EMPTY_NIM';
        const isAmbiguous = res && res.code === 'AMBIGUOUS_NIM';
        const msg = (res && res.message) ? res.message : 'Data QR undangan tidak dapat dimuat.';
        const student = (res && res.student) || (APP.dashboard && APP.dashboard.student) || {};

        let alertClass = isMissingNim ? 'notice notice-warn' : 'notice notice-danger';
        let alertTitle = isMissingNim ? 'NIM Resmi Belum Tersedia' : (isAmbiguous ? 'Validasi Data Wisudawan' : 'Data Belum Tersedia');

        let html = '<div class="' + alertClass + '" style="margin-bottom:20px; padding:18px 20px; border-radius:12px;">' +
          '<h3 style="margin:0 0 6px 0; font-size:15px; font-weight:800;">' + escapeHtml(alertTitle) + '</h3>' +
          '<p style="margin:0 0 12px 0; font-size:13.5px; line-height:1.5;">' + escapeHtml(msg) + '</p>' +
          '<button class="btn btn-outline btn-sm" onclick="renderGuestQr()">Muat Ulang</button>' +
        '</div>';

        // Tampilkan kartu identitas dengan status nonaktif agar informatif
        html += '<div class="guest-qr-grid">' +
          '<div class="guest-qr-card">' +
            '<div class="guest-qr-header">' +
              '<span class="guest-qr-header-title">Identitas Wisudawan</span>' +
              '<span class="badge badge-warn">Menunggu Data Resmi</span>' +
            '</div>' +
            '<div class="guest-qr-body">' +
              '<div class="guest-qr-identity-card">' +
                '<div class="guest-qr-identity-title">' + escapeHtml(student.nama || '—') + '</div>' +
                '<div class="guest-qr-meta-list">' +
                  '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">ID Wisudawan</span><span class="guest-qr-meta-value">' + escapeHtml(student.idWisudawan || '—') + '</span></div>' +
                  '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">NIM</span><span class="guest-qr-meta-value" style="color:var(--red);font-weight:800;">Belum tersedia</span></div>' +
                  '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Fakultas</span><span class="guest-qr-meta-value">' + escapeHtml(student.fakultas || '—') + '</span></div>' +
                  '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Program Studi</span><span class="guest-qr-meta-value">' + escapeHtml(student.prodi || '—') + '</span></div>' +
                  '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Nomor Kursi</span><span class="guest-qr-meta-value">' + escapeHtml(student.kursi || '—') + '</span></div>' +
                  '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Periode</span><span class="guest-qr-meta-value">' + escapeHtml(student.periode || '—') + '</span></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="guest-qr-card">' +
            '<div class="guest-qr-header">' +
              '<span class="guest-qr-header-title">QR Code Undangan Tamu</span>' +
              '<span class="badge badge-warn">Tidak Tersedia</span>' +
            '</div>' +
            '<div class="guest-qr-body">' +
              '<div class="guest-qr-preview-box" style="background:#fffaf0;border-color:#feebc8;">' +
                '<div style="font-size:36px;margin-bottom:8px;">⚠️</div>' +
                '<div style="font-size:14px;font-weight:700;color:#9c4221;margin-bottom:6px;">QR Belum Dapat Dibuat</div>' +
                '<p class="guest-qr-caption" style="color:#7b341e;">' + escapeHtml(msg) + '</p>' +
              '</div>' +
              '<div class="guest-qr-actions">' +
                '<div class="guest-qr-actions-row">' +
                  '<button class="btn btn-outline" disabled title="NIM resmi belum tersedia">Unduh QR PNG</button>' +
                  '<button class="btn btn-outline" disabled title="NIM resmi belum tersedia">Cetak / Simpan PDF</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

        target.innerHTML = html;
        return;
      }

      APP.guestQrData = res;
      const student = res.student || {};
      const qrPayload = res.qrPayload || ('NIM:' + student.nim);

      let html = '<div class="guest-qr-grid">' +
        // Kolom Kiri: Identitas Wisudawan & Kuota
        '<div class="guest-qr-card">' +
          '<div class="guest-qr-header">' +
            '<span class="guest-qr-header-title">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>' +
              'Identitas Wisudawan' +
            '</span>' +
            '<span class="badge badge-green">Wisudawan Terdaftar</span>' +
          '</div>' +
          '<div class="guest-qr-body">' +
            '<div class="guest-qr-identity-card">' +
              '<div class="guest-qr-identity-title">' + escapeHtml(student.nama || '—') + '</div>' +
              '<div class="guest-qr-meta-list">' +
                '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">NIM Resmi</span><span class="guest-qr-meta-value" style="font-family:monospace;font-size:14px;color:var(--primary);">' + escapeHtml(student.nim || '—') + '</span></div>' +
                '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">ID Wisudawan</span><span class="guest-qr-meta-value">' + escapeHtml(student.idWisudawan || '—') + '</span></div>' +
                '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Fakultas</span><span class="guest-qr-meta-value">' + escapeHtml(student.fakultas || '—') + '</span></div>' +
                '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Program Studi</span><span class="guest-qr-meta-value">' + escapeHtml(student.prodi || '—') + '</span></div>' +
                '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Nomor Kursi</span><span class="guest-qr-meta-value"><span class="badge badge-green" style="font-size:11px;">' + escapeHtml(student.kursi || '—') + '</span></span></div>' +
                '<div class="guest-qr-meta-row"><span class="guest-qr-meta-label">Periode Wisuda</span><span class="guest-qr-meta-value">' + escapeHtml(student.periode || '—') + '</span></div>' +
              '</div>' +
            '</div>' +
            '<div class="guest-qr-quota-notice">' +
              '<span style="font-size:18px;line-height:1;">ℹ️</span>' +
              '<div>' +
                '<strong>Ketentuan Tamu Undangan:</strong><br>' +
                'Setiap wisudawan memiliki <strong>tepat satu QR undangan tamu</strong> yang berlaku untuk <strong>1 (satu) orang tamu pendamping</strong> memasuki gedung wisuda.' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        // Kolom Kanan: Kartu QR Code Undangan
        '<div class="guest-qr-card">' +
          '<div class="guest-qr-header">' +
            '<span class="guest-qr-header-title">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>' +
              'QR Code Undangan Tamu' +
            '</span>' +
            '<span class="badge badge-green">✓ Siap Digunakan</span>' +
          '</div>' +
          '<div class="guest-qr-body">' +
            '<div class="guest-qr-preview-box">' +
              '<div class="guest-qr-canvas-wrap">' +
                '<div id="guest-qr-code-element" style="display:flex;align-items:center;justify-content:center;min-width:240px;min-height:240px;">' +
                  '<span class="spinner"></span>' +
                '</div>' +
              '</div>' +
              '<div class="guest-qr-payload-badge">' + escapeHtml(qrPayload) + '</div>' +
              '<p class="guest-qr-caption">' +
                'Tunjukkan QR ini kepada panitia presensi saat memasuki gedung wisuda.' +
              '</p>' +
            '</div>' +
            '<div class="guest-qr-actions">' +
              '<div class="guest-qr-actions-row">' +
                '<button type="button" class="btn btn-primary" onclick="downloadGuestQrPng()">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
                  '<span>Unduh QR PNG</span>' +
                '</button>' +
                '<button type="button" class="btn btn-outline" onclick="printGuestQr()">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>' +
                  '<span>Cetak / Simpan PDF</span>' +
                '</button>' +
              '</div>' +
              '<button type="button" class="btn btn-outline btn-sm" onclick="renderGuestQr()" style="margin-top:4px;">' +
                'Muat Ulang Data QR' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // Panel Bawah: Panduan Penggunaan QR

    function generateGuestQrCode(container, payload) {
      if (!container) return;
      container.innerHTML = '';

      if (typeof QRCode !== 'undefined') {
        try {
          new QRCode(container, {
            text: payload,
            width: 240,
            height: 240,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
          return;
        } catch (e) {
          console.warn('QRCode creation error:', e);
        }
      }

      // Dynamic load fallback
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      script.onload = function () {
        if (typeof QRCode !== 'undefined') {
          new QRCode(container, {
            text: payload,
            width: 240,
            height: 240,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      };
      script.onerror = function () {
        container.innerHTML = '<div style="padding:16px;color:var(--red);font-size:12px;">Pustaka QR tidak dapat dimuat. Silakan periksa koneksi internet Anda.</div>';
      };
      document.head.appendChild(script);
    }

    function downloadGuestQrPng() {
      if (!APP.guestQrData || !APP.guestQrData.success) {
        showToast('Data QR belum siap untuk diunduh.');
        return;
      }
      const data = APP.guestQrData;
      const student = data.student || {};

      const qrWrap = document.getElementById('guest-qr-code-element');
      const qrCanvasOrImg = qrWrap ? (qrWrap.querySelector('canvas') || qrWrap.querySelector('img')) : null;
      if (!qrCanvasOrImg) {
        showToast('Gambar QR sedang dipersiapkan, silakan coba sesaat lagi.');
        return;
      }

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const w = 900;
      const h = 1200;
      canvas.width = w;
      canvas.height = h;

      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      // Border luar
      ctx.strokeStyle = '#e1e9e0';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, w - 40, h - 40);

      // Header pita hijau UIN Ar-Raniry
      ctx.fillStyle = '#07851b';
      ctx.fillRect(20, 20, w - 40, 160);

      // Header Text
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px "DM Sans", Arial, sans-serif';
      ctx.fillText('UNIVERSITAS ISLAM NEGERI AR-RANIRY BANDA ACEH', w / 2, 75);
      ctx.font = '600 20px "DM Sans", Arial, sans-serif';
      ctx.fillText('KARTU UNDANGAN RESMI TAMU WISUDA', w / 2, 115);
      ctx.font = '15px "DM Sans", Arial, sans-serif';
      ctx.fillText(student.periode ? ('PERIODE: ' + student.periode) : 'SISTEM PENGELOLAAN WISUDA', w / 2, 150);

      // Box QR Frame
      const qrBoxY = 220;
      const qrBoxSize = 460;
      ctx.fillStyle = '#f8faf7';
      ctx.strokeStyle = '#cfe0ce';
      ctx.lineWidth = 2;
      ctx.fillRect((w - qrBoxSize) / 2, qrBoxY, qrBoxSize, qrBoxSize);
      ctx.strokeRect((w - qrBoxSize) / 2, qrBoxY, qrBoxSize, qrBoxSize);

      // Gambar QR
      const qrDrawSize = 380;
      const qrX = (w - qrDrawSize) / 2;
      const qrY = qrBoxY + 36;
      ctx.drawImage(qrCanvasOrImg, qrX, qrY, qrDrawSize, qrDrawSize);

      // Payload Text
      ctx.fillStyle = '#334155';
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(data.qrPayload || ('NIM:' + student.nim), w / 2, qrBoxY + qrBoxSize - 12);

      // Box Identitas Wisudawan
      const infoY = 720;
      const infoW = w - 100;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#07851b';
      ctx.lineWidth = 2;
      ctx.strokeRect(50, infoY, infoW, 330);

      // Header Box Identitas
      ctx.fillStyle = '#f0fdf4';
      ctx.fillRect(51, infoY + 1, infoW - 2, 45);
      ctx.fillStyle = '#166534';
      ctx.font = 'bold 18px "DM Sans", Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('IDENTITAS WISUDAWAN PENDAMPING', 70, infoY + 30);

      // Rincian Identitas
      ctx.fillStyle = '#1f2937';
      ctx.font = 'bold 22px "DM Sans", Arial, sans-serif';
      ctx.fillText(student.nama || '—', 70, infoY + 85);

      ctx.font = '16px "DM Sans", Arial, sans-serif';
      ctx.fillStyle = '#6b7280';
      ctx.fillText('NIM:', 70, infoY + 125);
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 17px "DM Sans", Arial, sans-serif';
      ctx.fillText(student.nim || '—', 230, infoY + 125);

      ctx.font = '16px "DM Sans", Arial, sans-serif';
      ctx.fillStyle = '#6b7280';
      ctx.fillText('Fakultas:', 70, infoY + 165);
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 17px "DM Sans", Arial, sans-serif';
      ctx.fillText(student.fakultas || '—', 230, infoY + 165);

      ctx.font = '16px "DM Sans", Arial, sans-serif';
      ctx.fillStyle = '#6b7280';
      ctx.fillText('Program Studi:', 70, infoY + 205);
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 17px "DM Sans", Arial, sans-serif';
      ctx.fillText(student.prodi || '—', 230, infoY + 205);

      ctx.font = '16px "DM Sans", Arial, sans-serif';
      ctx.fillStyle = '#6b7280';
      ctx.fillText('Nomor Kursi:', 70, infoY + 245);
      ctx.fillStyle = '#07851b';
      ctx.font = 'bold 18px "DM Sans", Arial, sans-serif';
      ctx.fillText(student.kursi || '—', 230, infoY + 245);

      ctx.font = '16px "DM Sans", Arial, sans-serif';
      ctx.fillStyle = '#6b7280';
      ctx.fillText('Ketentuan Tamu:', 70, infoY + 285);
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 17px "DM Sans", Arial, sans-serif';
      ctx.fillText('1 (Satu) Orang Tamu Pendamping', 230, infoY + 285);

      // Petunjuk Bawah
      ctx.fillStyle = '#64748b';
      ctx.font = 'italic 13.5px "DM Sans", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('* Tunjukkan QR ini kepada panitia saat memasuki gedung wisuda.', w / 2, 1090);
      ctx.fillText('Tamu yang meninggalkan gedung wajib lapor ke panitia untuk scan keluar jika ingin masuk kembali.', w / 2, 1115);

      // Download
      const cleanName = String(student.nama || 'Wisudawan').replace(/[^a-zA-Z0-9]/g, '_').slice(0, 30);
      const cleanNim = String(student.nim || '').replace(/[^a-zA-Z0-9]/g, '');
      const fileName = 'QR_Tamu_' + cleanName + '_' + cleanNim + '.png';

      const link = document.createElement('a');
      link.download = fileName;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('Gambar QR Undangan Tamu berhasil diunduh.');
    }

      const s = String(status || '').toLowerCase();
      if (s.includes('sudah') || s.includes('hadir')) {
        return '<span class="badge badge-green">' + escapeHtml(status) + '</span>';
      } else if (s.includes('siap')) {
        return '<span class="badge" style="background:#d9f2db;color:#0b6819;font-weight:800;">' + escapeHtml(status) + '</span>';
      } else if (s.includes('belum')) {
        return '<span class="badge badge-yellow">' + escapeHtml(status) + '</span>';
      }
      return '<span class="badge">' + escapeHtml(status) + '</span>';
    }

    function closeCallStatusModal(force) {
      if (!force && APP.pendingCallStatus && APP.pendingCallStatus.isSubmitting) return;
      APP.pendingCallStatus = null;
      const wrap = document.getElementById('call-status-modal-wrap');
      if (wrap) wrap.remove();
    }

    function confirmCallStatusUpdate() {
      if (!APP.pendingCallStatus || APP.pendingCallStatus.isSubmitting) return;
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const submitBtn = document.getElementById('btn-call-modal-submit');
      const cancelBtn = document.getElementById('btn-call-modal-cancel');
      const closeBtn = document.getElementById('btn-call-modal-close');

      APP.pendingCallStatus.isSubmitting = true;

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-sm"></span> <span>Menyimpan...</span>';
      }
      if (cancelBtn) cancelBtn.disabled = true;
      if (closeBtn) closeBtn.disabled = true;

      const callId = APP.pendingCallStatus.id;
      const targetStatus = APP.pendingCallStatus.nextStatus;

      google.script.run
        .withSuccessHandler(function (result) {
          closeCallStatusModal(true);
          showToast(result && result.message ? result.message : 'Status pemanggilan berhasil diperbarui.');
          renderCalls();
        })
        .withFailureHandler(function (error) {
          if (APP.pendingCallStatus) {
            APP.pendingCallStatus.isSubmitting = false;
          }
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>Konfirmasi</span>';
          }
          if (cancelBtn) cancelBtn.disabled = false;
          if (closeBtn) closeBtn.disabled = false;
          showError(error);
        })
        .updateCallStatus(callId, targetStatus);
    }

    function cycleCallStatus(id, status) {
      const next = status === 'Belum Dipanggil'
        ? 'Siap Dipanggil'
        : status === 'Siap Dipanggil'
          ? 'Sudah Dipanggil'
          : 'Belum Dipanggil';

      let row = null;
      if (APP.currentCallsData && APP.currentCallsData.length) {
        row = APP.currentCallsData.find(function (r) {
          return String(value(r, ['ID_Panggil'])).trim() === String(id).trim();
        });
      }
      const fakeBtn = {
        dataset: {
          id: id,
          name: row ? value(row, ['Nama_Wisudawan']) : id,
          nim: row ? value(row, ['NIM']) : '—',
          seat: row ? value(row, ['Nomor_Kursi']) : '—',
          current: status,
          next: next
        }
      };
      openCallStatusModal(fakeBtn);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('call-status-modal');
        if (modal && (!APP.pendingCallStatus || !APP.pendingCallStatus.isSubmitting)) {
          closeCallStatusModal();
        }
      }
    });

    function drawSeatMapView() {
      const target = document.getElementById('seat-main-view');
      if (!target) return;

      const resp = APP.currentSeatMapResponse;
      if (!resp) {
        target.innerHTML = '<div class="notice notice-warn">Data denah belum tersedia. Silakan klik Muat Ulang.</div>';
        return;
      }

      if (resp.error) {
        target.innerHTML =
          '<div class="notice notice-danger" style="padding:18px; margin-top:12px;">' +
          '<h3 style="margin:0 0 6px 0; color:var(--red);">Denah Kursi Tidak Tersedia</h3>' +
          '<p style="margin:0;">' + escapeHtml(resp.error) + '</p>' +
          '</div>';
        return;
      }

      if (!resp.seats || resp.seats.length === 0) {
        target.innerHTML = '<div class="notice notice-warn">Tidak ada data penempatan kursi untuk filter yang dipilih.</div>';
        return;
      }

      // Helper validasi koordinat fisik gedung (Baris 1..25, Kolom 1..17, Blok Kanan/Kiri)
      const isValidCoord_ = function (seat) {
        if (!seat) return false;
        const sBaris = String(seat.Baris == null ? '' : seat.Baris).trim();
        const sKolom = String(seat.Kolom == null ? '' : seat.Kolom).trim();
        if (!sBaris || !sKolom) return false;
        if (!/^\d+$/.test(sBaris) || !/^\d+$/.test(sKolom)) return false;
        const baris = parseInt(sBaris, 10);
        const kolom = parseInt(sKolom, 10);
        if (baris < 1 || baris > 25) return false;
        if (kolom < 1 || kolom > 17) return false;
        const blok = String(seat.Blok || '').trim().toLowerCase();
        return blok === 'kanan' || blok === 'kiri';
      };

      if (APP.session.role === 'Admin' && APP.seatViewMode === 'table') {
        const blokOrder_ = function (b) {
          const s = String(b || '').trim().toLowerCase();
          if (s === 'kanan') return 0;
          if (s === 'kiri') return 1;
          return 2;
        };

        const sortedSeats = resp.seats.slice().sort(function (a, b) {
          const hasA = isValidCoord_(a);
          const hasB = isValidCoord_(b);

          // Kursi tanpa koordinat valid ditempatkan di akhir tabel
          if (hasA && !hasB) return -1;
          if (!hasA && hasB) return 1;
          if (!hasA && !hasB) {
            const partsA = String(a.Nomor_Kursi || '').trim().split('-');
            const partsB = String(b.Nomor_Kursi || '').trim().split('-');
            const numA = parseInt(partsA[0], 10) || 0;
            const numB = parseInt(partsB[0], 10) || 0;
            const unitA = (partsA[1] || '').toUpperCase();
            const unitB = (partsB[1] || '').toUpperCase();
            if (unitA !== unitB) return unitA.localeCompare(unitB);
            return numA - numB;
          }

          // 1. Urutkan berdasarkan Baris dari kecil ke besar (1, 2, ..., 25)
          const barisA = parseInt(a.Baris, 10) || 0;
          const barisB = parseInt(b.Baris, 10) || 0;
          if (barisA !== barisB) return barisA - barisB;

          // 2. Pada setiap baris: Blok Kanan terlebih dahulu (0), kemudian Blok Kiri (1)
          const bA = blokOrder_(a.Blok);
          const bB = blokOrder_(b.Blok);
          if (bA !== bB) return bA - bB;

          // 3. Pada setiap blok: Kolom dari 17 turun ke 1 (descending)
          const kolA = parseInt(a.Kolom, 10) || 0;
          const kolB = parseInt(b.Kolom, 10) || 0;
          return kolB - kolA;
        });

        // Pemeriksaan diagnostik untuk mendeteksi dua kursi yang memiliki kombinasi koordinat sama
        const seenCoords = {};
        const duplicateCoords = [];
        sortedSeats.forEach(function (s) {
          if (!isValidCoord_(s)) return;
          const key = parseInt(s.Baris, 10) + '-' + String(s.Blok).trim().toLowerCase() + '-' + parseInt(s.Kolom, 10);
          if (seenCoords[key]) {
            duplicateCoords.push({
              posisi: 'Blok ' + s.Blok + ', Baris ' + s.Baris + ', Kolom ' + s.Kolom,
              kursi1: seenCoords[key].Nomor_Kursi,
              kursi2: s.Nomor_Kursi
            });
          } else {
            seenCoords[key] = s;
          }
        });

        if (duplicateCoords.length > 0) {
          console.warn('[Diagnostik Denah Kursi] Ditemukan duplikasi koordinat:', duplicateCoords);
        }

        const tableData = sortedSeats.map(function (s) {
          const hasCoord = isValidCoord_(s);
          return {
            Nomor_Kursi: s.Nomor_Kursi || '—',
            Blok: s.Blok || '—',
            Baris: s.Baris || '—',
            Kolom: s.Kolom || '—',
            Status_Koordinat: hasCoord ? 'Tersedia' : 'Belum Ada',
            Nama_Wisudawan: s.Nama_Wisudawan || '—',
            NIM: s.NIM || '—',
            Fakultas: s.Fakultas || '—',
            Program_Studi: s.Program_Studi || '—',
            Jenis_Kelamin: s.Jenis_Kelamin || '—',
            Status_Kursi: s.Status_Kursi || '—'
          };
        });

        let duplicateNotice = '';
        if (duplicateCoords.length > 0) {
          duplicateNotice = '<div class="notice notice-warn" style="margin-bottom:12px;">' +
            '<strong>Peringatan Diagnostik:</strong> Terdeteksi ' + duplicateCoords.length + ' posisi koordinat ganda pada data alokasi: ' +
            duplicateCoords.map(function (d) {
              return escapeHtml(d.kursi1 + ' dan ' + d.kursi2 + ' (' + d.posisi + ')');
            }).join(', ') +
            '</div>';
        }

        target.innerHTML =
          duplicateNotice +
          '<div class="panel"><div class="panel-head"><h2>Data Penempatan Kursi (Administrasi)</h2>' +
          '<span style="font-size:12px; font-weight:700; color:var(--muted);">Total ' + tableData.length + ' Kursi Terdaftar</span></div>' +
          '<div class="panel-body">' + buildTable(tableData, [
            ['Nomor_Kursi', 'Nomor Kursi'],
            ['Blok', 'Blok'],
            ['Baris', 'Baris'],
            ['Kolom', 'Kolom'],
            ['Status_Koordinat', 'Status Koordinat'],
            ['Nama_Wisudawan', 'Nama Wisudawan'],
            ['NIM', 'NIM'],
            ['Fakultas', 'Fakultas'],
            ['Program_Studi', 'Program Studi'],
            ['Jenis_Kelamin', 'Jenis Kelamin'],
            ['Status_Kursi', 'Status Alokasi']
          ]) + '</div></div>';
        return;
      }

      // Mode Visual Denah 2D
      const hasValidCoords = resp.seats.some(isValidCoord_);

      if (!hasValidCoords) {
        if (APP.session.role === 'Wisudawan') {
          target.innerHTML =
            '<div class="notice notice-warn" style="margin-bottom:16px; padding:18px;">' +
            '<h3 style="margin:0 0 8px 0; color:#856404;">Koordinat Denah Visual Belum Tersedia</h3>' +
            '<p style="margin:0;">Data alokasi denah fisik untuk jadwal wisuda Anda belum terpetakan ke denah visual gedung. Silakan hubungi panitia wisuda.</p>' +
            '</div>';
          return;
        }

        target.innerHTML =
          '<div class="notice notice-warn" style="margin-bottom:16px; padding:18px;">' +
          '<h3 style="margin:0 0 8px 0; color:#856404;">Data Koordinat Visual Belum Tersedia</h3>' +
          '<p style="margin:0 0 12px 0;">Data alokasi kursi untuk periode dan hari ini berhasil dimuat (<strong>' + resp.seats.length + ' kursi</strong>), namun koordinat fisik (Blok, Baris, Kolom) belum terpetakan ke denah visual gedung. Silakan beralih ke <strong>Tabel Administrasi</strong> untuk melihat daftar alokasi kursi peserta secara lengkap.</p>' +
          '<button class="btn btn-green btn-sm" onclick="switchSeatViewMode(\'table\')">Buka Tabel Administrasi</button>' +
          '</div>';
        return;
      }

      const dayNum = String(resp.day || '1');
      const dayLabels = {
        '1': 'DENAH WISUDA GELOMBANG III TAHUN 2026 HARI PERTAMA',
        '2': 'DENAH WISUDA GELOMBANG III TAHUN 2026 HARI KEDUA',
        '3': 'DENAH WISUDA GELOMBANG III TAHUN 2026 HARI KETIGA'
      };
      const title = dayLabels[dayNum] || ('DENAH WISUDA HARI KE-' + dayNum);

      // Index kursi berdasarkan baris, blok, kolom
      // Key: "baris-blok-kolom"
      const seatLookup = {};
      resp.seats.forEach(function (s) {
        seatLookup[s.Baris + '-' + s.Blok + '-' + s.Kolom] = s;
      });

      let html = '<div class="seat-scroll-hint"><span>↔</span> Geser ke samping untuk menjelajahi seluruh denah kursi</div><div class="seat-plan-wrapper">';
      html += '<div class="seat-plan-header-title">' + escapeHtml(title) + '</div>';

      // Panggung dan Togawan
      html += '<div class="seat-stage-box">';
      html += '<div class="seat-stage-senat">ANGGOTA SENAT LAINNYA (51 ORANG)</div>';
      html += '<div class="seat-stage-officials">' +
        '<span class="seat-official-tag">D-FAH</span>' +
        '<span class="seat-official-tag">D-FDK</span>' +
        '<span class="seat-official-tag">D-FUF</span>' +
        '<span class="seat-official-tag">D-FTK</span>' +
        '<span class="seat-official-tag">D-FSH</span>' +
        '<span class="seat-official-tag">D-PPS</span>' +
        '<span class="seat-official-tag">WAREK-I</span>' +
        '<span class="seat-official-tag" style="background:#b3d7f4; font-weight:800;">REKTOR</span>' +
        '<span class="seat-official-tag">KET. SENAT</span>' +
        '<span class="seat-official-tag">WAREK-II</span>' +
        '<span class="seat-official-tag">WAREK-III</span>' +
        '<span class="seat-official-tag">D-FEBI</span>' +
        '<span class="seat-official-tag">D-FST</span>' +
        '<span class="seat-official-tag">D-FISIP</span>' +
        '<span class="seat-official-tag">D-FPSI</span>' +
        '</div>';
      html += '<div class="seat-togawan-label">TOGAWAN</div>';
      html += '</div>';

      // Baris VIP
      html += '<div class="seat-vip-row">' +
        '<div class="seat-vvip-banner">UNDANGAN VVIP</div>' +
        '<div class="seat-vvip-banner">UNDANGAN VVIP</div>' +
        '</div>';
      html += '<div class="seat-vip-row">' +
        '<div class="seat-vip-banner">UNDANGAN VIP</div>' +
        '<div class="seat-vip-banner">UNDANGAN VIP</div>' +
        '</div>';

      // Baris Angka Kolom 1..17 Kiri dan Kanan
      html += '<div class="seat-columns-bar">';
      html += '<div class="seat-cols-subgrid">';
      for (let c = 1; c <= 17; c++) html += '<div>' + c + '</div>';
      html += '</div>';
      html += '<div></div>'; // Lorong header
      html += '<div class="seat-cols-subgrid">';
      for (let c = 1; c <= 17; c++) html += '<div>' + c + '</div>';
      html += '</div>';
      html += '</div>';

      // Hall Grid 25 Baris
      html += '<div class="seat-hall-grid">';
      for (let r = 1; r <= 25; r++) {
        html += '<div class="seat-grid-row">';

        // Blok Kiri (Kolom 1..17)
        html += '<div class="seat-block-grid">';
        for (let c = 1; c <= 17; c++) {
          const s = seatLookup[r + '-Kiri-' + c];
          html += renderSeatCellHtml(s);
        }
        html += '</div>';

        // Nomor Baris Lorong Tengah (1..25)
        html += '<div class="seat-aisle-num">' + r + '</div>';

        // Blok Kanan (Kolom 1..17)
        html += '<div class="seat-block-grid">';
        for (let c = 1; c <= 17; c++) {
          const s = seatLookup[r + '-Kanan-' + c];
          html += renderSeatCellHtml(s);
        }
        html += '</div>';

        html += '</div>'; // seat-grid-row
      }
      html += '</div>'; // seat-hall-grid

      // Legenda Warna Unit
      html += buildSeatLegendHtml();

      // Tabel Rekapitulasi Alokasi Kursi Gedung
      html += buildSeatSummaryTableHtml(dayNum);

      html += '</div>'; // seat-plan-wrapper

      target.innerHTML = html;
    }

    function renderSeatCellHtml(seat) {
      if (!seat) {
        return '<div class="seat-cell seat-empty" title="Kosong / Lorong"></div>';
      }

      const code = seat.Nomor_Kursi;
      const parts = code.split('-');
      const unit = (parts[1] || '').toLowerCase();
      let cls = 'seat-unit-' + unit;

      const isSelf = Boolean(
        seat.isSelf ||
        (APP.selfSeatCode && String(code).trim().toUpperCase() === String(APP.selfSeatCode).trim().toUpperCase())
      );

      if (isSelf) {
        cls += ' seat-cell-self';
      }

      const name = seat.Nama_Wisudawan || '—';
      const nim = seat.NIM ? (' (' + seat.NIM + ')') : '';
      const tooltip = (isSelf ? '★ KURSI ANDA ★ ' : '') + code + ': ' + name + nim + ' - ' + (seat.Fakultas || '') + ' [' + (seat.Jenis_Kelamin || '') + ']';

      const label = isSelf ? ('★ ' + code) : code;

      return '<div class="seat-cell ' + cls + '" title="' + escapeAttr(tooltip) + '" data-seat="' +
        escapeAttr(code) + '" onclick="showSeatStudentDetail(this.dataset.seat)">' +
        escapeHtml(label) + '</div>';
    }

    function showSeatStudentDetail(seatCode) {
      const resp = APP.currentSeatMapResponse;
      if (!resp || !resp.seats) return;
      const s = resp.seats.find(function (item) { return item.Nomor_Kursi === seatCode; });
      if (!s) return;

      const isSelf = Boolean(
        s.isSelf ||
        (APP.selfSeatCode && String(s.Nomor_Kursi).trim().toUpperCase() === String(APP.selfSeatCode).trim().toUpperCase())
      );

      const html = '<div class="student-modal-overlay" onclick="if(event.target===this)closeSeatModal()">' +
        '<div class="student-modal-card" style="padding:22px;">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid var(--line); padding-bottom:10px;">' +
        '<div style="display:flex; align-items:center; gap:8px;">' +
        '<h3 style="margin:0; font-size:18px; color:var(--ink);">Detail Penempatan Kursi</h3>' +
        (isSelf ? '<span class="badge" style="background:#e65100; color:#fff; font-weight:800; font-size:11px;">★ KURSI ANDA</span>' : '') +
        '</div>' +

    function renderGuests() {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      document.getElementById('page-content').innerHTML =
        pageHeader('Data Tamu', 'Daftar riwayat akses dan kehadiran tamu wisudawan.') +
        '<div id="guest-stats-container" class="stat-grid stat-grid-3" style="margin-bottom: 20px;">' +
          '<div class="stat-card"><span class="stat-label">Total Tamu Masuk</span><strong id="stat-total-tamu">—</strong><div class="stat-foot">Periode ini</div></div>' +
          '<div class="stat-card"><span class="stat-label">Sedang di Dalam</span><strong id="stat-tamu-dalam" style="color:#2e7d32">—</strong><div class="stat-foot">Status DI_DALAM</div></div>' +
          '<div class="stat-card"><span class="stat-label">Sudah Keluar</span><strong id="stat-tamu-luar" style="color:#1976d2">—</strong><div class="stat-foot">Status DI_LUAR</div></div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-head">' +
            '<h2>Riwayat Akses Tamu</h2>' +
            '<button class="btn btn-outline" onclick="renderGuests()" style="font-size:12px;padding:6px 12px">Segarkan Data</button>' +
          '</div>' +
          '<div class="panel-body"><div id="guests-table">Memuat data...</div></div>' +
        '</div>';

      google.script.run
        .withSuccessHandler(function (rows) {
          const target = document.getElementById('guests-table');
          if (!target) return;

          rows = rows || [];

          let totalCount = rows.length;
          let insideCount = 0;
          let outsideCount = 0;

          rows.forEach(function (r) {
            const st = normalize_(r.Status);
            if (st === 'di_dalam') insideCount++;
            else outsideCount++;
          });

          const statTotal = document.getElementById('stat-total-tamu');
          const statInside = document.getElementById('stat-tamu-dalam');
          const statOutside = document.getElementById('stat-tamu-luar');

          if (statTotal) statTotal.textContent = totalCount;
          if (statInside) statInside.textContent = insideCount;
          if (statOutside) statOutside.textContent = outsideCount;

          if (rows.length === 0) {
            target.innerHTML = '<div class="table-empty">Belum ada riwayat pemindaian tamu pada periode ini.</div>';
            return;
          }

          let html = '<div class="table-wrap"><table><thead><tr>' +
            '<th>No</th>' +
            '<th>NIM</th>' +
            '<th>Nama Wisudawan</th>' +
            '<th>Fakultas / Prodi</th>' +
            '<th>No Kursi</th>' +
            '<th>Status</th>' +
            '<th>Waktu Masuk</th>' +
            '<th>Waktu Keluar</th>' +
            '<th>Petugas</th>' +
          '</tr></thead><tbody>';

          rows.forEach(function (row, idx) {
            const isInside = normalize_(row.Status) === 'di_dalam';
            const badgeClass = isInside ? 'badge-green' : 'badge-yellow';
            const statusText = isInside ? 'DI_DALAM' : 'DI_LUAR';

            html += '<tr>' +
              '<td>' + (idx + 1) + '</td>' +
              '<td><strong>' + escapeHtml(row.NIM || '—') + '</strong></td>' +
              '<td>' + escapeHtml(row.Nama_Wisudawan || '—') + '</td>' +
              '<td>' + escapeHtml((row.Fakultas || '') + (row.Program_Studi ? ' / ' + row.Program_Studi : '')) + '</td>' +
              '<td>' + escapeHtml(row.Nomor_Kursi || '—') + '</td>' +
              '<td><span class="badge ' + badgeClass + '">' + statusText + '</span></td>' +
              '<td>' + escapeHtml(row.Waktu_Checkin || row.Waktu_Masuk || '—') + '</td>' +
              '<td>' + escapeHtml(row.Waktu_Keluar || '—') + '</td>' +
              '<td>' + escapeHtml(row.Petugas || '—') + '</td>' +
            '</tr>';
          });

          html += '</tbody></table></div>';
          target.innerHTML = html;
        })
        .withFailureHandler(showError)
        .getGuests();
    }

    function setCameraStatus_(status) {
      const pill = document.getElementById('camera-status-pill');
      if (!pill) return;

      pill.className = 'scanner-status-pill';
      if (status === 'starting') {
        pill.classList.add('scanner-status-starting');
        pill.innerHTML = '<span class="spinner-sm" style="border-top-color:#92400e;border-color:rgba(146,64,14,0.3)"></span> Menghubungkan...';
      } else if (status === 'on') {
        pill.classList.add('scanner-status-on');
        pill.innerHTML = '<span class="scanner-pulse-dot"></span> Kamera Internal Aktif';
      } else if (status === 'external_on') {
        pill.classList.add('scanner-status-external');
        pill.innerHTML = '<span class="scanner-pulse-dot" style="background:#0284c7;box-shadow:0 0 0 4px rgba(2,132,199,0.25);"></span> Pemindai Eksternal Terhubung';
      } else if (status === 'error') {
        pill.classList.add('scanner-status-error');
        pill.innerHTML = '✕ Kamera Gagal Diakses';
      } else {
        pill.classList.add('scanner-status-off');
        pill.innerHTML = '● Kamera Belum Aktif';
      }
    }

    function updateCameraControls_(isActive) {
      const btnStart = document.getElementById('btn-start-camera');
      const btnStop = document.getElementById('btn-stop-camera');
      if (btnStart) btnStart.disabled = isActive;
      if (btnStop) btnStop.disabled = !isActive;
    }

    function showCameraDiag_(name, msg) {
      const diag = document.getElementById('camera-diag-box');
      const elName = document.getElementById('diag-error-name');
      const elMsg = document.getElementById('diag-error-msg');
      if (diag && elName && elMsg) {
        elName.textContent = name;
        elMsg.textContent = msg;

    function hideCameraDiag_() {
      const diag = document.getElementById('camera-diag-box');
      if (diag) diag.style.display = 'none';

    // =========================================================
    // INTEGRASI PEMINDAI EKSTERNAL (GITHUB PAGES / CLOUDFLARE PAGES)
    // =========================================================

    function isAllowedScannerOrigin(origin) {
      if (!origin) return false;
      try {
        const configuredOrigin = new URL(APP.externalScannerUrl).origin;
        if (origin === configuredOrigin) return true;
      } catch (e) {}

      // Origin tepercaya proyek UIN Ar-Raniry
      const trustedOrigins = [
        'https://dimasrwan.github.io',
        'https://uin-wisuda-scanner.pages.dev'
      ];
      if (trustedOrigins.includes(origin)) return true;

      // Pengujian lokal localhost
      if (origin.startsWith('http://localhost:') || origin.startsWith('http://127.0.0.1:')) return true;

      return false;
    }

    function setupExternalScannerListenerOnce_() {
      if (APP.hasScannerPostMessageListener) return;
      APP.hasScannerPostMessageListener = true;

      window.addEventListener('message', function (event) {
        // Tangkap window pengirim agar referensi balasan selalu valid dan hidup
        if (event.source) {
          APP.externalScannerWindow = event.source;
        }

        // 1. Validasi origin pengirim
        if (!isAllowedScannerOrigin(event.origin)) {
          console.warn('[Security] Diabaikan postMessage dari origin tidak terdaftar:', event.origin);
          return;
        }

        // 2. Validasi struktur pesan
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        // 3. Handshake status ready
        if (data.type === 'UIN_ARRANIRY_SCANNER_READY') {
          setCameraStatus_('external_on');
          showToast('Pemindai eksternal siap dan terhubung.');
          return;
        }

        // 4. Pemeriksaan status transaksi (Pemulihan setelah timeout atau koneksi lambat)
        if (data.type === 'UIN_ARRANIRY_CHECK_TX') {
          const checkReqId = data.requestId || '';
          const checkPayload = data.payload || '';
          console.log('[CheckTX] Menerima permintaan periksa transaksi:', checkReqId, checkPayload);

          google.script.run
            .withSuccessHandler(function (checkRes) {
              sendResultToScannerPopup_({
                type: 'UIN_ARRANIRY_SCAN_RESULT',
                requestId: checkReqId,
                result: checkRes
              });
            })
            .withFailureHandler(function (checkErr) {
              sendResultToScannerPopup_({
                type: 'UIN_ARRANIRY_SCAN_RESULT',
                requestId: checkReqId,
                result: {
                  success: false,
                  resultCode: 'CHECK_FAILED',
                  badge: 'GAGAL PERIKSA',
                  message: getErrorMessage(checkErr),
                  requestId: checkReqId
                }
              });
            })
            .checkTransactionStatus(checkReqId, checkPayload);
          return;
        }

        // 5. Data hasil scan QR
        if (data.type === 'UIN_ARRANIRY_QR_SCAN') {
          const rawPayload = typeof data.payload === 'string' ? data.payload.trim() : '';
          const reqId = data.requestId || ('TX-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase());
          if (!rawPayload) return;

          // Kirim ACK beserta requestId bahwa QR telah diterima oleh aplikasi induk
          sendResultToScannerPopup_({
            type: 'UIN_ARRANIRY_SCAN_ACK',
            requestId: reqId,
            payload: rawPayload
          });

          const now = Date.now();
          // Debounce kode yang sama
          if (rawPayload === APP.activeCameraCode && (now - (APP.lastCodeSeenTime || 0) < 1800)) {
            sendResultToScannerPopup_({
              type: 'UIN_ARRANIRY_SCAN_RESULT',
              requestId: reqId,
              result: {
                success: false,
                resultCode: 'DEBOUNCE_COOLDOWN',
                badge: 'KODE SEDANG AKTIF',
                message: 'QR code ini baru saja diproses. Harap angkat QR dari kamera terlebih dahulu.',
                requestId: reqId
              }
            });
            return;
          }

          if (APP.pendingGuestExit || document.getElementById('guest-exit-modal-wrap')) {
            return;
          }
          if (APP.scanBusy) {
            sendResultToScannerPopup_({
              type: 'UIN_ARRANIRY_SCAN_RESULT',
              requestId: reqId,
              result: {
                success: false,
                resultCode: 'SCAN_BUSY',
                badge: 'SISTEM SEDANG MEMPROSES',
                message: 'Sedang memproses transaksi sebelumnya di server. Harap tunggu sebentar.',
                requestId: reqId
              }
            });
            return;
          }

          APP.activeCameraCode = rawPayload;
          APP.lastCodeSeenTime = now;
          APP.scanBusy = true;
          handleScannedGuest(rawPayload, reqId);
        }
      });
    }

    function sendResultToScannerPopup_(data) {
      if (!APP.externalScannerWindow || APP.externalScannerWindow.closed) return;
      try {
        let dest = '*';
        if (APP.externalScannerUrl) {
          try {
            dest = new URL(APP.externalScannerUrl).origin;
          } catch (e) {}
        }
        APP.externalScannerWindow.postMessage(data, dest);
      } catch (e) {
        console.warn('[PostMessage] Gagal mengirim pesan ke popup pemindai:', e);
      }
    }

    function openExternalScanner() {
      if (!['Admin','Panitia'].includes(APP.session.role)) return showToast('Akses ditolak.');

      const parentOrigin = window.location.origin;
      const baseUrl = APP.externalScannerUrl || 'https://dimasrwan.github.io/Sistem-Pengelolaan-Wisuda/scanner/';
      const sep = baseUrl.includes('?') ? '&' : '?';
      const targetUrl = baseUrl + sep + 'parentOrigin=' + encodeURIComponent(parentOrigin);

      setCameraStatus_('starting');

      // Buka melalui klik langsung pengguna agar popup tidak diblokir
      APP.externalScannerWindow = window.open(
        targetUrl,
        'UIN_ArRaniry_QR_Scanner',
        'width=520,height=750,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes'
      );

      if (!APP.externalScannerWindow || APP.externalScannerWindow.closed || typeof APP.externalScannerWindow.closed === 'undefined') {
        setCameraStatus_('off');
        showToast('Popup diblokir oleh peramban. Harap izinkan pop-up untuk membuka kamera.');
        return;
      }

      setCameraStatus_('external_on');
      showToast('Jendela pemindai dibuka. Siap menerima hasil scan.');

      try { APP.externalScannerWindow.focus(); } catch (e) {}

      // Monitor penutupan jendela
      if (APP.externalScannerMonitorInterval) {
        clearInterval(APP.externalScannerMonitorInterval);
      }
      APP.externalScannerMonitorInterval = setInterval(function () {
        if (APP.externalScannerWindow && APP.externalScannerWindow.closed) {
          clearInterval(APP.externalScannerMonitorInterval);
          APP.externalScannerMonitorInterval = null;
          APP.externalScannerWindow = null;
          setCameraStatus_('off');
          showToast('Jendela pemindai ditutup.');
        }
      }, 1000);
    }

    function toggleExternalScannerConfig() {
      const box = document.getElementById('external-scanner-config-box');
      const arrow = document.getElementById('config-toggle-arrow');
      const input = document.getElementById('input-external-scanner-url');
      if (!box) return;

      const isHidden = box.style.display === 'none';
      box.style.display = isHidden ? 'block' : 'none';
      if (arrow) arrow.textContent = isHidden ? '▲' : '▼';

      if (isHidden && input) {
        input.value = APP.externalScannerUrl || '';
      }
    }

    function saveExternalScannerUrl() {
      const input = document.getElementById('input-external-scanner-url');
      const statusEl = document.getElementById('config-url-status');
      if (!input) return;

      const raw = input.value.trim();
      if (!raw) {
        showToast('Masukkan URL pemindai yang valid.');
        return;
      }

      try {
        const u = new URL(raw);
        if (!['http:', 'https:'].includes(u.protocol)) {
          showToast('URL harus menggunakan protokol HTTPS.');
          return;
        }
        APP.externalScannerUrl = raw;
        try { localStorage.setItem('uin_scanner_external_url', raw); } catch (e) {}
        if (statusEl) {
          statusEl.innerHTML = '<span style="color:#15803d;font-weight:700;">✓ URL tersimpan: ' + escapeHtml(u.origin) + '</span>';
        }
        showToast('URL pemindai eksternal berhasil disimpan.');
      } catch (e) {
        showToast('Format URL tidak valid.');
      }
    }

    function resetExternalScannerUrl() {
      const defaultUrl = 'https://dimasrwan.github.io/Sistem-Pengelolaan-Wisuda/scanner/';
      APP.externalScannerUrl = defaultUrl;
      try { localStorage.removeItem('uin_scanner_external_url'); } catch (e) {}
      const input = document.getElementById('input-external-scanner-url');
      const statusEl = document.getElementById('config-url-status');
      if (input) input.value = defaultUrl;
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:#15803d;font-weight:700;">✓ Reset ke URL default GitHub Pages</span>';
      }
      showToast('URL pemindai di-reset ke default.');
    }

    // =========================================================
    // KAMERA INTERNAL (DIAGNOSTIK & FALLBACK)
    // =========================================================

    function startScanner() {
      if (!['Admin','Panitia'].includes(APP.session.role)) return showToast('Akses ditolak.');
      if (!window.Html5Qrcode) return showToast('Library pemindai QR tidak dapat dimuat.');

      if (APP.scanner) stopScanner();

      setCameraStatus_('starting');
      updateCameraControls_(true);
      hideCameraDiag_();

      APP.scanner = new Html5Qrcode('qr-reader');
      APP.activeCameraCode = null;
      APP.lastCodeSeenTime = 0;
      APP.scanBusy = false;

      // Heartbeat interval untuk mendeteksi pengangkatan QR dari area pandang kamera
      if (APP.cameraPresenceInterval) {
        clearInterval(APP.cameraPresenceInterval);
      }
      APP.cameraPresenceInterval = setInterval(function () {
        if (APP.activeCameraCode && (Date.now() - (APP.lastCodeSeenTime || 0) > 1200)) {
          APP.activeCameraCode = null;
        }
      }, 300);

      APP.scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        function (text) {
          const clean = String(text || '').trim();
          if (!clean) return;

          const now = Date.now();

          // 1. KASUS QR SAMA DENGAN QR AKTIF
          if (APP.activeCameraCode === clean) {
            APP.lastCodeSeenTime = now;
            return;
          }

          // 2. KASUS QR BERBEDA ATAU KODE BARU
          if (APP.pendingGuestExit || document.getElementById('guest-exit-modal-wrap')) {
            return;
          }

          if (APP.scanBusy) {
            return;
          }

          // 3. QR baru siap diproses
          APP.activeCameraCode = clean;
          APP.lastCodeSeenTime = now;
          APP.scanBusy = true;
          handleScannedGuest(clean);
        },
        function () {
          // Callback frame kosong
          if (APP.activeCameraCode) {
            const now = Date.now();
            if (now - (APP.lastCodeSeenTime || 0) > 1200) {
              APP.activeCameraCode = null;
            }
          }
        }
      ).then(function () {
        setCameraStatus_('on');
        updateCameraControls_(true);
      }).catch(function (error) {
        if (APP.cameraPresenceInterval) {
          clearInterval(APP.cameraPresenceInterval);
          APP.cameraPresenceInterval = null;
        }
        APP.scanner = null;
        setCameraStatus_('error');
        updateCameraControls_(false);

        // Catat error.name dan error.message secara spesifik
        const errName = (error && error.name) ? error.name : 'NotAllowedError / SandboxRestriction';
        const errMsg = (error && error.message) ? error.message : String(error || 'Izin kamera ditolak.');
        console.error('Kamera Internal Gagal (Name, Message):', errName, errMsg, error);

        showCameraDiag_(errName, errMsg);
        showToast('Kamera terhalang sandbox Google Apps Script. Gunakan tombol Pemindai Eksternal.');
      });
    }

    function stopScanner() {
      if (APP.cameraPresenceInterval) {
        clearInterval(APP.cameraPresenceInterval);
        APP.cameraPresenceInterval = null;
      }
      APP.activeCameraCode = null;
      APP.lastCodeSeenTime = 0;
      APP.scanBusy = false;

      if (APP.scanner) {
        const scanner = APP.scanner;
        APP.scanner = null;

        scanner.stop()
          .catch(function () {})
          .finally(function () {
            try { scanner.clear(); } catch (e) {}
            setCameraStatus_('off');
            updateCameraControls_(false);
          });
      } else {
        setCameraStatus_('off');
        updateCameraControls_(false);
      }
    }

            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Waktu Masuk Sebelumnya</span>' +

            '</div>';
