<script>
    /* STATE MODUL OPERATIONS */
    APP.callListFilters = APP.callListFilters || { day: '', period: '' };
    APP.seatMapFilters = APP.seatMapFilters || { day: '1', period: '' };
    APP.seatViewMode = APP.seatViewMode || 'visual'; // 'visual' atau 'table'

    function renderCalls() {
      const role = APP.session.role;

      if (role === 'Wisudawan') {
        const rows = (APP.dashboard && APP.dashboard.callList) || [];

        document.getElementById('page-content').innerHTML =
          pageHeader('Daftar Panggil','Informasi pemanggilan untuk akun wisudawan ini.') +
          '<div class="panel"><div class="panel-head"><h2>Daftar panggil pribadi</h2></div>' +
          '<div class="panel-body">' + buildTable(rows, [
            ['Urutan_Panggil','Urutan'],
            ['Kelompok_Panggil','Kelompok'],
            ['Status_Panggil','Status'],
            ['Waktu_Panggil','Waktu']
          ]) + '</div></div>';
        return;
      }

      if (role !== 'Admin') return showToast('Akses ditolak.');

      const dayFilter = APP.callListFilters.day || '';
      const periodFilter = APP.callListFilters.period || '';

      document.getElementById('page-content').innerHTML =
        pageHeader('Daftar Panggil','Tinjau, filter, dan perbarui status pemanggilan wisudawan.') +
        '<div class="panel" style="margin-bottom:15px;">' +
        '<div class="panel-body" style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between;">' +
        '<div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">' +
        '<div><label style="font-size:11px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px;">Filter Hari Wisuda</label>' +
        '<select id="call-filter-day" class="field" style="min-width:160px;" onchange="onCallDayFilterChange(this.value)">' +
        '<option value="" ' + (!dayFilter ? 'selected' : '') + '>Semua Hari</option>' +
        '<option value="1" ' + (dayFilter === '1' ? 'selected' : '') + '>Hari Pertama (Selasa)</option>' +
        '<option value="2" ' + (dayFilter === '2' ? 'selected' : '') + '>Hari Kedua (Rabu)</option>' +
        '<option value="3" ' + (dayFilter === '3' ? 'selected' : '') + '>Hari Ketiga (Kamis)</option>' +
        '</select></div>' +
        '</div>' +
        '<div style="display:flex; gap:8px;">' +
        '<button class="btn btn-outline btn-sm" onclick="openCallListReportModal()">Pratinjau / Cetak Laporan PDF</button>' +
        '<button class="btn btn-outline btn-sm" onclick="renderCalls()">Muat ulang</button>' +
        '</div>' +
        '</div></div>' +
        '<div class="panel"><div class="panel-head"><h2>Daftar pemanggilan</h2>' +
        '<span id="calls-count" style="font-size:12px; font-weight:700; color:var(--muted);"></span></div>' +
        '<div class="panel-body"><div id="calls-table">Memuat data...</div></div></div>';

      syncCustomSelect('call-filter-day');

      google.script.run
        .withSuccessHandler(function (rows) {
          const target = document.getElementById('calls-table');
          if (!target) return;

          APP.currentCallsData = rows || [];
          const countTarget = document.getElementById('calls-count');
          if (countTarget) countTarget.textContent = 'Total: ' + (rows ? rows.length : 0) + ' wisudawan';

          target.innerHTML = buildTable(rows, [
            ['ID_Panggil','ID Panggil'],
            ['Urutan_Panggil','Urutan'],
            ['Nama_Wisudawan','Nama Wisudawan'],
            ['NIM','NIM'],
            ['Fakultas','Fakultas'],
            ['Program_Studi','Program Studi'],
            ['Nomor_Kursi','Kursi'],
            ['Status_Panggil','Status']
          ], function (row) {
            return renderCallActionButton(row);
          });
        })
        .withFailureHandler(showError)
        .getCallList(APP.callListFilters);
    }

    function onCallDayFilterChange(val) {
      closeCallStatusModal();
      APP.callListFilters.day = val;
      renderCalls();
    }

    function renderCallActionButton(row) {
      if (APP.session.role !== 'Admin') {
        return '<span style="color:var(--muted);font-size:12px;">—</span>';
      }

      const id = value(row, ['ID_Panggil']);
      const status = value(row, ['Status_Panggil']) || 'Belum Dipanggil';
      const name = value(row, ['Nama_Wisudawan']) || '—';
      const nim = value(row, ['NIM']) || '—';
      const seat = value(row, ['Nomor_Kursi']) || '—';

      let nextStatus = 'Siap Dipanggil';
      let btnLabel = 'Siap Dipanggil';
      let btnClass = 'btn-call-action btn-call-ready';
      let iconSvg = '';

      if (status === 'Belum Dipanggil') {
        nextStatus = 'Siap Dipanggil';
        btnLabel = 'Siap Dipanggil';
        btnClass = 'btn-call-action btn-call-ready';
        iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
      } else if (status === 'Siap Dipanggil') {
        nextStatus = 'Sudah Dipanggil';
        btnLabel = 'Sudah Dipanggil';
        btnClass = 'btn-call-action btn-call-called';
        iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      } else if (status === 'Sudah Dipanggil') {
        nextStatus = 'Belum Dipanggil';
        btnLabel = 'Reset Status';
        btnClass = 'btn-call-action btn-call-reset';
        iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>';
      } else {
        nextStatus = 'Belum Dipanggil';
        btnLabel = 'Ubah Status';
        btnClass = 'btn-call-action btn-call-reset';
        iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>';
      }

      return '<button type="button" class="' + btnClass + '"' +
        ' data-id="' + escapeAttr(id) + '"' +
        ' data-name="' + escapeAttr(name) + '"' +
        ' data-nim="' + escapeAttr(nim) + '"' +
        ' data-seat="' + escapeAttr(seat) + '"' +
        ' data-current="' + escapeAttr(status) + '"' +
        ' data-next="' + escapeAttr(nextStatus) + '"' +
        ' onclick="openCallStatusModal(this)">' +
        iconSvg + '<span>' + escapeHtml(btnLabel) + '</span>' +
        '</button>';
    }

    function getCallStatusBadgeHtml(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('sudah') || s.includes('hadir')) {
        return '<span class="badge badge-green">' + escapeHtml(status) + '</span>';
      } else if (s.includes('siap')) {
        return '<span class="badge" style="background:#d9f2db;color:#0b6819;font-weight:800;">' + escapeHtml(status) + '</span>';
      } else if (s.includes('belum')) {
        return '<span class="badge badge-yellow">' + escapeHtml(status) + '</span>';
      }
      return '<span class="badge">' + escapeHtml(status) + '</span>';
    }

    function openCallStatusModal(btn) {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');
      if (!btn) return;

      const id = btn.dataset.id;
      const name = btn.dataset.name || '—';
      const nim = btn.dataset.nim || '—';
      const seat = btn.dataset.seat || '—';
      const currentStatus = btn.dataset.current || 'Belum Dipanggil';
      const nextStatus = btn.dataset.next || 'Siap Dipanggil';

      APP.pendingCallStatus = {
        id: id,
        name: name,
        currentStatus: currentStatus,
        nextStatus: nextStatus,
        isSubmitting: false
      };

      const prev = document.getElementById('call-status-modal-wrap');
      if (prev) prev.remove();

      let actionDesc = 'memperbarui status pemanggilan';
      if (nextStatus === 'Siap Dipanggil') {
        actionDesc = 'menandai wisudawan ini <strong>Siap Dipanggil</strong> ke panggung';
      } else if (nextStatus === 'Sudah Dipanggil') {
        actionDesc = 'mengonfirmasi bahwa wisudawan ini <strong>Sudah Dipanggil</strong>';
      } else if (nextStatus === 'Belum Dipanggil') {
        actionDesc = 'mengembalikan status pemanggilan menjadi <strong>Belum Dipanggil</strong>';
      }

      const modalHtml = '<div id="call-status-modal-wrap">' +
        '<div id="call-status-modal" class="student-modal-overlay" onclick="if(event.target===this)closeCallStatusModal()">' +
          '<div class="call-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="call-modal-title">' +
            '<div class="call-confirm-header">' +
              '<h3 id="call-modal-title" class="call-confirm-title">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--green);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>' +
                'Konfirmasi Status Pemanggilan' +
              '</h3>' +
              '<button type="button" class="btn btn-outline btn-sm" id="btn-call-modal-close" onclick="closeCallStatusModal()" aria-label="Tutup" style="min-height:auto;padding:3px 8px;border-radius:6px;font-size:12px;">✕</button>' +
            '</div>' +
            '<div class="call-student-card">' +
              '<div class="call-student-name">' + escapeHtml(name) + '</div>' +
              '<div class="call-student-meta">' +
                '<span><strong>NIM:</strong> ' + escapeHtml(nim) + '</span>' +
                '<span>•</span>' +
                '<span><strong>Nomor Kursi:</strong> <span class="badge badge-green" style="font-size:10px;padding:2px 7px;">' + escapeHtml(seat) + '</span></span>' +
              '</div>' +
            '</div>' +
            '<div class="call-status-flow">' +
              '<div class="call-status-box">' +
                '<div class="call-status-label">Status Saat Ini</div>' +
                getCallStatusBadgeHtml(currentStatus) +
              '</div>' +
              '<div class="call-status-arrow">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>' +
              '</div>' +
              '<div class="call-status-box">' +
                '<div class="call-status-label">Status Tujuan</div>' +
                getCallStatusBadgeHtml(nextStatus) +
              '</div>' +
            '</div>' +
            '<p style="margin:0 0 20px 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.5;">' +
              'Apakah Anda yakin ingin ' + actionDesc + '?' +
            '</p>' +
            '<div style="display:flex;justify-content:flex-end;gap:10px;">' +
              '<button type="button" class="btn btn-outline btn-sm" id="btn-call-modal-cancel" onclick="closeCallStatusModal()">Batal</button>' +
              '<button type="button" class="btn btn-sm btn-call-ready" id="btn-call-modal-submit" onclick="confirmCallStatusUpdate()">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
                '<span>Konfirmasi</span>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

      const wrap = document.createElement('div');
      wrap.innerHTML = modalHtml;
      document.body.appendChild(wrap.firstElementChild);

      const submitBtn = document.getElementById('btn-call-modal-submit');
      if (submitBtn) submitBtn.focus();
    }

    function closeCallStatusModal(force) {
      if (!force && APP.pendingCallStatus && APP.pendingCallStatus.isSubmitting) return;
      APP.pendingCallStatus = null;
      const wrap = document.getElementById('call-status-modal-wrap');
      if (wrap) wrap.remove();
    }

    function confirmCallStatusUpdate() {
      if (!APP.pendingCallStatus || APP.pendingCallStatus.isSubmitting) return;
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const submitBtn = document.getElementById('btn-call-modal-submit');
      const cancelBtn = document.getElementById('btn-call-modal-cancel');
      const closeBtn = document.getElementById('btn-call-modal-close');

      APP.pendingCallStatus.isSubmitting = true;

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-sm"></span> <span>Menyimpan...</span>';
      }
      if (cancelBtn) cancelBtn.disabled = true;
      if (closeBtn) closeBtn.disabled = true;

      const callId = APP.pendingCallStatus.id;
      const targetStatus = APP.pendingCallStatus.nextStatus;

      google.script.run
        .withSuccessHandler(function (result) {
          closeCallStatusModal(true);
          showToast(result && result.message ? result.message : 'Status pemanggilan berhasil diperbarui.');
          renderCalls();
        })
        .withFailureHandler(function (error) {
          if (APP.pendingCallStatus) {
            APP.pendingCallStatus.isSubmitting = false;
          }
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>Konfirmasi</span>';
          }
          if (cancelBtn) cancelBtn.disabled = false;
          if (closeBtn) closeBtn.disabled = false;
          showError(error);
        })
        .updateCallStatus(callId, targetStatus);
    }

    function cycleCallStatus(id, status) {
      const next = status === 'Belum Dipanggil'
        ? 'Siap Dipanggil'
        : status === 'Siap Dipanggil'
          ? 'Sudah Dipanggil'
          : 'Belum Dipanggil';

      let row = null;
      if (APP.currentCallsData && APP.currentCallsData.length) {
        row = APP.currentCallsData.find(function (r) {
          return String(value(r, ['ID_Panggil'])).trim() === String(id).trim();
        });
      }
      const fakeBtn = {
        dataset: {
          id: id,
          name: row ? value(row, ['Nama_Wisudawan']) : id,
          nim: row ? value(row, ['NIM']) : '—',
          seat: row ? value(row, ['Nomor_Kursi']) : '—',
          current: status,
          next: next
        }
      };
      openCallStatusModal(fakeBtn);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('call-status-modal');
        if (modal && (!APP.pendingCallStatus || !APP.pendingCallStatus.isSubmitting)) {
          closeCallStatusModal();
        }
      }
    });

    /* =========================================================
       MODUL VISUAL DENAH KURSI
       ========================================================= */

    function renderSeats() {
      const role = APP.session.role;

      if (role === 'Wisudawan') {
        document.getElementById('page-content').innerHTML =
          pageHeader('Denah Kursi', 'Denah visual tempat duduk dua dimensi gedung wisuda untuk sesi Anda.') +
          '<div id="seat-wisudawan-summary"></div>' +
          '<div id="seat-main-view"><div class="panel" style="padding:28px; text-align:center; color:var(--muted);"><span class="spinner" style="margin-right:8px;"></span>Memuat denah visual tempat duduk Anda...</div></div>';

        google.script.run
          .withSuccessHandler(function (response) {
            try {
              APP.currentSeatMapResponse = response;
              if (response && response.selfSeatCode) {
                APP.selfSeatCode = response.selfSeatCode;
              }
              renderWisudawanSeatSummary(response);
              drawSeatMapView();
            } catch (renderErr) {
              console.error('Error saat membangun tampilan denah kursi wisudawan:', renderErr);
              const target = document.getElementById('seat-main-view');
              if (target) {
                target.innerHTML =
                  '<div class="notice notice-danger" style="margin-top:15px; padding:18px;">' +
                  '<h3 style="margin:0 0 8px 0; color:var(--red);">Gagal Merender Denah Kursi</h3>' +
                  '<p style="margin:0 0 12px 0;">Terjadi kesalahan saat memproses data denah: ' + escapeHtml(renderErr.message || String(renderErr)) + '</p>' +
                  '<button class="btn btn-sm btn-outline" onclick="renderSeats()">Coba Lagi</button>' +
                  '</div>';
              }
            }
          })
          .withFailureHandler(function (error) {
            showError(error);
            const target = document.getElementById('seat-main-view');
            if (target) {
              const msg = getErrorMessage(error);
              target.innerHTML =
                '<div class="notice notice-danger" style="margin-top:15px; padding:18px;">' +
                '<h3 style="margin:0 0 8px 0; color:var(--red);">Gagal Memuat Denah Kursi</h3>' +
                '<p style="margin:0 0 12px 0;">' + escapeHtml(msg) + '</p>' +
                '<button class="btn btn-sm btn-outline" onclick="renderSeats()">Coba Lagi</button>' +
                '</div>';
            }
          })
          .getSeatMap({});
        return;
      }

      if (role !== 'Admin') return showToast('Akses ditolak.');

      const dayFilter = APP.seatMapFilters.day || '1';
      const isVisual = APP.seatViewMode === 'visual';

      document.getElementById('page-content').innerHTML =
        pageHeader('Denah Kursi','Peta visual tempat duduk dua dimensi gedung wisuda dan data penempatan.') +
        '<div class="panel" style="margin-bottom:15px;">' +
        '<div class="panel-body" style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between;">' +
        '<div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">' +
        '<div><label style="font-size:11px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px;">Pilih Hari Wisuda</label>' +
        '<select id="seat-filter-day" class="field" style="min-width:210px; font-weight:700;" onchange="onSeatDayFilterChange(this.value)">' +
        '<option value="1" ' + (dayFilter === '1' ? 'selected' : '') + '>Hari Pertama (Selasa, 6 Okt 2026)</option>' +
        '<option value="2" ' + (dayFilter === '2' ? 'selected' : '') + '>Hari Kedua (Rabu, 7 Okt 2026)</option>' +
        '<option value="3" ' + (dayFilter === '3' ? 'selected' : '') + '>Hari Ketiga (Kamis, 8 Okt 2026)</option>' +
        '</select></div>' +
        '<div><label style="font-size:11px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px;">Tampilan Halaman</label>' +
        '<div style="display:flex; border:1px solid #d5ddd4; border-radius:8px; overflow:hidden;">' +
        '<button class="btn btn-sm ' + (isVisual ? 'btn-green' : 'btn-outline') + '" style="border-radius:0; border:0;" onclick="switchSeatViewMode(\'visual\')">Visual Denah 2D</button>' +
        '<button class="btn btn-sm ' + (!isVisual ? 'btn-green' : 'btn-outline') + '" style="border-radius:0; border:0;" onclick="switchSeatViewMode(\'table\')">Tabel Administrasi</button>' +
        '</div></div>' +
        '</div>' +
        '<div style="display:flex; gap:8px;">' +
        '<button class="btn btn-outline btn-sm" onclick="renderSeats()">Muat ulang</button>' +
        '</div>' +
        '</div></div>' +
        '<div id="seat-main-view">Memuat data denah kursi...</div>';

      syncCustomSelect('seat-filter-day');

      google.script.run
        .withSuccessHandler(function (response) {
          try {
            APP.currentSeatMapResponse = response;
            drawSeatMapView();
          } catch (renderErr) {
            console.error('Error saat membangun tampilan denah kursi:', renderErr);
            const target = document.getElementById('seat-main-view');
            if (target) {
              target.innerHTML =
                '<div class="notice notice-danger" style="margin-top:15px; padding:18px;">' +
                '<h3 style="margin:0 0 8px 0; color:var(--red);">Gagal Merender Denah Kursi</h3>' +
                '<p style="margin:0 0 12px 0;">Terjadi kesalahan saat memproses data denah: ' + escapeHtml(renderErr.message || String(renderErr)) + '</p>' +
                '<button class="btn btn-sm btn-outline" onclick="renderSeats()">Coba Lagi</button>' +
                '</div>';
            }
          }
        })
        .withFailureHandler(function (error) {
          showError(error);
          const target = document.getElementById('seat-main-view');
          if (target) {
            const msg = getErrorMessage(error);
            target.innerHTML =
              '<div class="notice notice-danger" style="margin-top:15px; padding:18px;">' +
              '<h3 style="margin:0 0 8px 0; color:var(--red);">Gagal Memuat Denah Kursi</h3>' +
              '<p style="margin:0 0 12px 0;">' + escapeHtml(msg) + '</p>' +
              '<button class="btn btn-sm btn-outline" onclick="renderSeats()">Coba Lagi</button>' +
              '</div>';
          }
        })
        .getSeatMap(APP.seatMapFilters);
    }

    function renderWisudawanSeatSummary(response) {
      const target = document.getElementById('seat-wisudawan-summary');
      if (!target) return;

      if (!response || response.error) {
        target.innerHTML = '';
        return;
      }

      // Ambil data kursi wisudawan dari response backend atau session dashboard
      let seat = response.selfSeat || null;
      if (!seat && response.seats) {
        seat = response.seats.find(function (s) { return s.isSelf; }) || null;
      }
      if (!seat && APP.dashboard && APP.dashboard.seats && APP.dashboard.seats.length > 0) {
        seat = APP.dashboard.seats[0];
      }

      if (!seat) {
        target.innerHTML =
          '<div class="notice notice-warn" style="margin-bottom:18px;">' +
          '<strong>Perhatian:</strong> Data nomor kursi belum teralokasi pada denah gedung untuk akun Anda.' +
          '</div>';
        return;
      }

      const seatCode = seat.Nomor_Kursi || '—';
      const dayNum = String(seat.Hari_Ke || response.day || '1');
      const dayNames = {
        '1': 'Hari Pertama',
        '2': 'Hari Kedua',
        '3': 'Hari Ketiga'
      };
      const dayText = dayNames[dayNum] || ('Hari Ke-' + dayNum);

      const hasCoord = seat.Baris && seat.Blok && seat.Kolom && seat.Blok !== 'Belum terpetakan';
      let positionText = '';
      if (hasCoord) {
        positionText = dayText + ' — Blok ' + escapeHtml(seat.Blok) + ', Baris ' + escapeHtml(seat.Baris) + ', Kolom ' + escapeHtml(seat.Kolom);
      } else {
        positionText = dayText + ' — ' + escapeHtml(seat.Catatan_Koordinat || 'Koordinat denah fisik belum terpetakan.');
      }

      target.innerHTML =
        '<div class="panel seat-self-summary-card">' +
        '<div class="panel-body" style="padding:18px 22px;">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">' +
        '<div style="display:flex; align-items:center; gap:16px;">' +
        '<div class="seat-self-badge-icon">★</div>' +
        '<div>' +
        '<div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px; color:#c64000; margin-bottom:2px;">' +
        'Tempat Duduk Anda' +
        '</div>' +
        '<div style="font-size:22px; font-weight:900; color:var(--ink); line-height:1.2;">' +
        'Kursi Anda: ' + escapeHtml(seatCode) +
        '</div>' +
        '<div style="font-size:14px; font-weight:700; color:#495d46; margin-top:3px;">' +
        positionText +
        '</div>' +
        '</div>' +
        '</div>' +

    function drawSeatMapView() {
      const target = document.getElementById('seat-main-view');
      if (!target) return;

      const resp = APP.currentSeatMapResponse;
      if (!resp) {
        target.innerHTML = '<div class="notice notice-warn">Data denah belum tersedia. Silakan klik Muat Ulang.</div>';
        return;
      }

      if (resp.error) {
        target.innerHTML =
          '<div class="notice notice-danger" style="padding:18px; margin-top:12px;">' +
          '<h3 style="margin:0 0 6px 0; color:var(--red);">Denah Kursi Tidak Tersedia</h3>' +
          '<p style="margin:0;">' + escapeHtml(resp.error) + '</p>' +
          '</div>';
        return;
      }

      if (!resp.seats || resp.seats.length === 0) {
        target.innerHTML = '<div class="notice notice-warn">Tidak ada data penempatan kursi untuk filter yang dipilih.</div>';
        return;
      }

      // Helper validasi koordinat fisik gedung (Baris 1..25, Kolom 1..17, Blok Kanan/Kiri)
      const isValidCoord_ = function (seat) {
        if (!seat) return false;
        const sBaris = String(seat.Baris == null ? '' : seat.Baris).trim();
        const sKolom = String(seat.Kolom == null ? '' : seat.Kolom).trim();
        if (!sBaris || !sKolom) return false;
        if (!/^\d+$/.test(sBaris) || !/^\d+$/.test(sKolom)) return false;
        const baris = parseInt(sBaris, 10);
        const kolom = parseInt(sKolom, 10);
        if (baris < 1 || baris > 25) return false;
        if (kolom < 1 || kolom > 17) return false;
        const blok = String(seat.Blok || '').trim().toLowerCase();
        return blok === 'kanan' || blok === 'kiri';
      };

      if (APP.session.role === 'Admin' && APP.seatViewMode === 'table') {
        const blokOrder_ = function (b) {
          const s = String(b || '').trim().toLowerCase();
          if (s === 'kanan') return 0;
          if (s === 'kiri') return 1;
          return 2;
        };

        const sortedSeats = resp.seats.slice().sort(function (a, b) {
          const hasA = isValidCoord_(a);
          const hasB = isValidCoord_(b);

          // Kursi tanpa koordinat valid ditempatkan di akhir tabel
          if (hasA && !hasB) return -1;
          if (!hasA && hasB) return 1;
          if (!hasA && !hasB) {
            const partsA = String(a.Nomor_Kursi || '').trim().split('-');
            const partsB = String(b.Nomor_Kursi || '').trim().split('-');
            const numA = parseInt(partsA[0], 10) || 0;
            const numB = parseInt(partsB[0], 10) || 0;
            const unitA = (partsA[1] || '').toUpperCase();
            const unitB = (partsB[1] || '').toUpperCase();
            if (unitA !== unitB) return unitA.localeCompare(unitB);
            return numA - numB;
          }

          // 1. Urutkan berdasarkan Baris dari kecil ke besar (1, 2, ..., 25)
          const barisA = parseInt(a.Baris, 10) || 0;
          const barisB = parseInt(b.Baris, 10) || 0;
          if (barisA !== barisB) return barisA - barisB;

          // 2. Pada setiap baris: Blok Kanan terlebih dahulu (0), kemudian Blok Kiri (1)
          const bA = blokOrder_(a.Blok);
          const bB = blokOrder_(b.Blok);
          if (bA !== bB) return bA - bB;

          // 3. Pada setiap blok: Kolom dari 17 turun ke 1 (descending)
          const kolA = parseInt(a.Kolom, 10) || 0;
          const kolB = parseInt(b.Kolom, 10) || 0;
          return kolB - kolA;
        });

        // Pemeriksaan diagnostik untuk mendeteksi dua kursi yang memiliki kombinasi koordinat sama
        const seenCoords = {};
        const duplicateCoords = [];
        sortedSeats.forEach(function (s) {
          if (!isValidCoord_(s)) return;
          const key = parseInt(s.Baris, 10) + '-' + String(s.Blok).trim().toLowerCase() + '-' + parseInt(s.Kolom, 10);
          if (seenCoords[key]) {
            duplicateCoords.push({
              posisi: 'Blok ' + s.Blok + ', Baris ' + s.Baris + ', Kolom ' + s.Kolom,
              kursi1: seenCoords[key].Nomor_Kursi,
              kursi2: s.Nomor_Kursi
            });
          } else {
            seenCoords[key] = s;
          }
        });

        if (duplicateCoords.length > 0) {
          console.warn('[Diagnostik Denah Kursi] Ditemukan duplikasi koordinat:', duplicateCoords);
        }

        const tableData = sortedSeats.map(function (s) {
          const hasCoord = isValidCoord_(s);
          return {
            Nomor_Kursi: s.Nomor_Kursi || '—',
            Blok: s.Blok || '—',
            Baris: s.Baris || '—',
            Kolom: s.Kolom || '—',
            Status_Koordinat: hasCoord ? 'Tersedia' : 'Belum Ada',
            Nama_Wisudawan: s.Nama_Wisudawan || '—',
            NIM: s.NIM || '—',
            Fakultas: s.Fakultas || '—',
            Program_Studi: s.Program_Studi || '—',
            Jenis_Kelamin: s.Jenis_Kelamin || '—',
            Status_Kursi: s.Status_Kursi || '—'
          };
        });

        let duplicateNotice = '';
        if (duplicateCoords.length > 0) {
          duplicateNotice = '<div class="notice notice-warn" style="margin-bottom:12px;">' +
            '<strong>Peringatan Diagnostik:</strong> Terdeteksi ' + duplicateCoords.length + ' posisi koordinat ganda pada data alokasi: ' +
            duplicateCoords.map(function (d) {
              return escapeHtml(d.kursi1 + ' dan ' + d.kursi2 + ' (' + d.posisi + ')');
            }).join(', ') +
            '</div>';
        }

        target.innerHTML =
          duplicateNotice +
          '<div class="panel"><div class="panel-head"><h2>Data Penempatan Kursi (Administrasi)</h2>' +
          '<span style="font-size:12px; font-weight:700; color:var(--muted);">Total ' + tableData.length + ' Kursi Terdaftar</span></div>' +
          '<div class="panel-body">' + buildTable(tableData, [
            ['Nomor_Kursi', 'Nomor Kursi'],
            ['Blok', 'Blok'],
            ['Baris', 'Baris'],
            ['Kolom', 'Kolom'],
            ['Status_Koordinat', 'Status Koordinat'],
            ['Nama_Wisudawan', 'Nama Wisudawan'],
            ['NIM', 'NIM'],
            ['Fakultas', 'Fakultas'],
            ['Program_Studi', 'Program Studi'],
            ['Jenis_Kelamin', 'Jenis Kelamin'],
            ['Status_Kursi', 'Status Alokasi']
          ]) + '</div></div>';
        return;
      }

      // Mode Visual Denah 2D
      const hasValidCoords = resp.seats.some(isValidCoord_);

      if (!hasValidCoords) {
        if (APP.session.role === 'Wisudawan') {
          target.innerHTML =
            '<div class="notice notice-warn" style="margin-bottom:16px; padding:18px;">' +
            '<h3 style="margin:0 0 8px 0; color:#856404;">Koordinat Denah Visual Belum Tersedia</h3>' +
            '<p style="margin:0;">Data alokasi denah fisik untuk jadwal wisuda Anda belum terpetakan ke denah visual gedung. Silakan hubungi panitia wisuda.</p>' +
            '</div>';
          return;
        }

        target.innerHTML =
          '<div class="notice notice-warn" style="margin-bottom:16px; padding:18px;">' +
          '<h3 style="margin:0 0 8px 0; color:#856404;">Data Koordinat Visual Belum Tersedia</h3>' +
          '<p style="margin:0 0 12px 0;">Data alokasi kursi untuk periode dan hari ini berhasil dimuat (<strong>' + resp.seats.length + ' kursi</strong>), namun koordinat fisik (Blok, Baris, Kolom) belum terpetakan ke denah visual gedung. Silakan beralih ke <strong>Tabel Administrasi</strong> untuk melihat daftar alokasi kursi peserta secara lengkap.</p>' +
          '<button class="btn btn-green btn-sm" onclick="switchSeatViewMode(\'table\')">Buka Tabel Administrasi</button>' +
          '</div>';
        return;
      }

      const dayNum = String(resp.day || '1');
      const dayLabels = {
        '1': 'DENAH WISUDA GELOMBANG III TAHUN 2026 HARI PERTAMA',
        '2': 'DENAH WISUDA GELOMBANG III TAHUN 2026 HARI KEDUA',
        '3': 'DENAH WISUDA GELOMBANG III TAHUN 2026 HARI KETIGA'
      };
      const title = dayLabels[dayNum] || ('DENAH WISUDA HARI KE-' + dayNum);

      // Index kursi berdasarkan baris, blok, kolom
      // Key: "baris-blok-kolom"
      const seatLookup = {};
      resp.seats.forEach(function (s) {
        seatLookup[s.Baris + '-' + s.Blok + '-' + s.Kolom] = s;
      });

      let html = '<div class="seat-plan-wrapper">';
      html += '<div class="seat-plan-header-title">' + escapeHtml(title) + '</div>';

      // Panggung dan Togawan
      html += '<div class="seat-stage-box">';
      html += '<div class="seat-stage-senat">ANGGOTA SENAT LAINNYA (51 ORANG)</div>';
      html += '<div class="seat-stage-officials">' +
        '<span class="seat-official-tag">D-FAH</span>' +
        '<span class="seat-official-tag">D-FDK</span>' +
        '<span class="seat-official-tag">D-FUF</span>' +
        '<span class="seat-official-tag">D-FTK</span>' +
        '<span class="seat-official-tag">D-FSH</span>' +
        '<span class="seat-official-tag">D-PPS</span>' +
        '<span class="seat-official-tag">WAREK-I</span>' +
        '<span class="seat-official-tag" style="background:#b3d7f4; font-weight:800;">REKTOR</span>' +
        '<span class="seat-official-tag">KET. SENAT</span>' +
        '<span class="seat-official-tag">WAREK-II</span>' +
        '<span class="seat-official-tag">WAREK-III</span>' +
        '<span class="seat-official-tag">D-FEBI</span>' +
        '<span class="seat-official-tag">D-FST</span>' +
        '<span class="seat-official-tag">D-FISIP</span>' +
        '<span class="seat-official-tag">D-FPSI</span>' +
        '</div>';
      html += '<div class="seat-togawan-label">TOGAWAN</div>';
      html += '</div>';

      // Baris VIP
      html += '<div class="seat-vip-row">' +
        '<div class="seat-vvip-banner">UNDANGAN VVIP</div>' +
        '<div class="seat-vvip-banner">UNDANGAN VVIP</div>' +
        '</div>';
      html += '<div class="seat-vip-row">' +
        '<div class="seat-vip-banner">UNDANGAN VIP</div>' +
        '<div class="seat-vip-banner">UNDANGAN VIP</div>' +
        '</div>';

      // Baris Angka Kolom 1..17 Kiri dan Kanan
      html += '<div class="seat-columns-bar">';
      html += '<div class="seat-cols-subgrid">';
      for (let c = 1; c <= 17; c++) html += '<div>' + c + '</div>';
      html += '</div>';
      html += '<div></div>'; // Lorong header
      html += '<div class="seat-cols-subgrid">';
      for (let c = 1; c <= 17; c++) html += '<div>' + c + '</div>';
      html += '</div>';

      // Hall Grid 25 Baris
      html += '<div class="seat-hall-grid">';

        html += '<div class="seat-grid-row">';

        // Blok Kiri (Kolom 1..17)

        // Nomor Baris Lorong Tengah (1..25)

        // Blok Kanan (Kolom 1..17)

          const s = seatLookup[r + '-Kanan-' + c];
          html += renderSeatCellHtml(s);
        }
        html += '</div>';

        html += '</div>'; // seat-grid-row
      }
      html += '</div>'; // seat-hall-grid

      // Legenda Warna Unit

      // Tabel Rekapitulasi Alokasi Kursi Gedung
      html += buildSeatSummaryTableHtml(dayNum);

      html += '</div>'; // seat-plan-wrapper

      target.innerHTML = html;
    }

    function renderSeatCellHtml(seat) {
      if (!seat) {
        return '<div class="seat-cell seat-empty" title="Kosong / Lorong"></div>';
      }

      const code = seat.Nomor_Kursi;
      const parts = code.split('-');
      const unit = (parts[1] || '').toLowerCase();
      let cls = 'seat-unit-' + unit;

      const isSelf = Boolean(
        seat.isSelf ||
        (APP.selfSeatCode && String(code).trim().toUpperCase() === String(APP.selfSeatCode).trim().toUpperCase())
      );

      if (isSelf) {
        cls += ' seat-cell-self';
      }

      const name = seat.Nama_Wisudawan || '—';
      const nim = seat.NIM ? (' (' + seat.NIM + ')') : '';
      const tooltip = (isSelf ? '★ KURSI ANDA ★ ' : '') + code + ': ' + name + nim + ' - ' + (seat.Fakultas || '') + ' [' + (seat.Jenis_Kelamin || '') + ']';

      const label = isSelf ? ('★ ' + code) : code;

      return '<div class="seat-cell ' + cls + '" title="' + escapeAttr(tooltip) + '" data-seat="' +
        escapeAttr(code) + '" onclick="showSeatStudentDetail(this.dataset.seat)">' +
        escapeHtml(label) + '</div>';
    }

    function startScanner() {
      if (!['Admin','Panitia'].includes(APP.session.role)) return showToast('Akses ditolak.');
      if (!window.Html5Qrcode) return showToast('Library pemindai QR tidak dapat dimuat.');

      if (APP.scanner) stopScanner();

      APP.scanner = new Html5Qrcode('qr-reader');
      APP.lastScannedText = '';
      APP.lastScannedTime = 0;

      APP.scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        function (text) {
          if (APP.scanBusy) return;
          const now = Date.now();
          // Debounce: abaikan pembacaan frame berulang dalam rentang 3 detik untuk QR yang persis sama
          if (APP.lastScannedText === text && (now - APP.lastScannedTime) < 3000) {
            return;
          }
          APP.lastScannedText = text;
          APP.lastScannedTime = now;
          APP.scanBusy = true;
          handleScannedGuest(text);
        },
        function () {}
      ).catch(function (error) {
        APP.scanner = null;
        showToast('Kamera tidak dapat dibuka. Periksa izin kamera browser.');
        console.error(error);
      });
    }

    function stopScanner() {
      if (APP.scanner) {
        const scanner = APP.scanner;
        APP.scanner = null;

        scanner.stop()
          .catch(function () {})
          .finally(function () {
            try { scanner.clear(); } catch (e) {}
          });
      }

      APP.scanBusy = false;
    }

    function displayScanProcessing_(text) {
      const box = document.getElementById('scanner-result');
      if (!box) return;

      box.innerHTML =
        '<div style="padding:24px 10px;text-align:center;">' +
          '<div style="display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);font-size:14px">' +
            '<span style="display:inline-block;width:18px;height:18px;border:3px solid #2e7d32;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;"></span>' +
            'Memproses QR undangan... Mohon tunggu' +
          '</div>' +
          '<div style="margin-top:8px;font-size:11px;color:var(--muted);overflow-wrap:anywhere">' + escapeHtml(text) + '</div>' +
        '</div>';
    }

    function renderScanResult(result) {
      const target = document.getElementById('scanner-result');
      if (!target) return;

      const code = result.resultCode || (result.success ? 'BERHASIL_MASUK' : 'QR_TIDAK_VALID');

      let bannerClass = 'scan-badge-neutral';
      let badgeText = result.badge || 'HASIL SCAN';

      if (code === 'BERHASIL_MASUK') {
        bannerClass = 'scan-badge-success-in';
        badgeText = 'BERHASIL MASUK';
      } else if (code === 'DITOLAK_TAMU_SUDAH_DI_DALAM') {
        bannerClass = 'scan-badge-danger';
        badgeText = 'DITOLAK — TAMU SUDAH DI DALAM GEDUNG';
      } else if (code === 'BERHASIL_KELUAR') {
        bannerClass = 'scan-badge-success-out';
        badgeText = 'BERHASIL KELUAR';
      } else if (code === 'DITOLAK_TIDAK_ADA_SESI_MASUK') {
        bannerClass = 'scan-badge-warning';
        badgeText = 'DITOLAK — TIDAK ADA SESI MASUK AKTIF';
      } else if (code === 'QR_TIDAK_VALID') {
        bannerClass = 'scan-badge-danger';
        badgeText = 'QR TIDAK VALID';
      }

      let studentHtml = '';
      let exitActionHtml = '';

      if (result.student) {
        const s = result.student;
        const isInside = result.currentStatus === 'DI_DALAM';
        const statusBadge = isInside
          ? '<span class="badge badge-green">DI DALAM GEDUNG</span>'
          : '<span class="badge" style="background:#e1f0fa;color:#124d80;">DI LUAR GEDUNG</span>';

        let checkinTimeRow = '';
        if (isInside && result.previousCheckinTime) {
          checkinTimeRow =
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Waktu Masuk Sebelumnya</span>' +
              '<span class="scan-identity-val">' + escapeHtml(result.previousCheckinTime) + '</span>' +
            '</div>';
        } else if (result.time) {
          checkinTimeRow =
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">' + (code === 'BERHASIL_KELUAR' ? 'Waktu Keluar' : 'Waktu Masuk') + '</span>' +
              '<span class="scan-identity-val">' + escapeHtml(result.time) + '</span>' +
            '</div>';
        }

        studentHtml =
          '<div class="scan-identity-card">' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Wisudawan</span>' +
              '<span class="scan-identity-val" style="font-size:13px;color:#185a25">' + escapeHtml(s.name || '—') + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">NIM</span>' +
              '<span class="scan-identity-val">' + escapeHtml(s.nim || s.id || '—') + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Fakultas / Prodi</span>' +
              '<span class="scan-identity-val">' + escapeHtml((s.faculty || '') + (s.prodi ? ' / ' + s.prodi : '')) + '</span>' +
            '</div>' +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Nomor Kursi</span>' +
              '<span class="scan-identity-val"><strong>' + escapeHtml(s.seat || '—') + '</strong></span>' +
            '</div>' +
            checkinTimeRow +
            '<div class="scan-identity-row">' +
              '<span class="scan-identity-label">Status Terkini</span>' +
              '<span class="scan-identity-val">' + statusBadge + '</span>' +
            '</div>' +
          '</div>';

        // Mekanisme keluar terkontrol jika tamu terdeteksi sedang di dalam gedung
        if (isInside) {
          exitActionHtml =
            '<div style="margin-top:14px;padding:14px;background:#f0f7ff;border:1px solid #b8daff;border-radius:10px;text-align:center;">' +
              '<div style="font-size:12px;color:#004085;margin-bottom:8px;font-weight:600;">' +
                'Tamu sedang berada di dalam gedung. Hendak mencatat tamu keluar?' +
              '</div>' +
              '<button type="button" class="btn btn-outline" style="border-color:#1976d2;color:#1976d2;font-size:13px;font-weight:700;padding:8px 18px;" data-id="' +
                escapeAttr(s.id) + '" data-name="' + escapeAttr(s.name) +
                '" onclick="confirmGuestExit(this.dataset.id, this.dataset.name)">' +
                '🚪 Catat Tamu Keluar' +
              '</button>' +
            '</div>';
        }
      }

      const noticeClass = result.success ? 'notice-success' : (code === 'DITOLAK_TIDAK_ADA_SESI_MASUK' ? 'notice-warn' : 'notice-error');

      target.innerHTML =
        '<div class="scan-result-card">' +
          '<div class="scan-badge-banner ' + bannerClass + '">' + escapeHtml(badgeText) + '</div>' +
          '<div class="notice ' + noticeClass + '" style="margin-bottom:0">' +
            escapeHtml(result.message || 'Pemindaian selesai.') +
          '</div>' +
          studentHtml +
          exitActionHtml +
        '</div>';

      // Update riwayat lokal sesi ini
      addScanToHistoryList_(badgeText, result.student ? result.student.name : 'QR', result.success);
    }

    function confirmGuestExit(studentId, studentName) {
      if (!studentId) return;
      if (confirm('Konfirmasi: Catat tamu dari ' + (studentName || studentId) + ' keluar dari gedung?')) {
        executeControlledExit(studentId);
      }
    }

    function executeControlledExit(studentId) {
      if (APP.scanBusy) return;
      APP.scanBusy = true;
      displayScanProcessing_('Mencatat keluar: ' + studentId);

      google.script.run
        .withSuccessHandler(function (result) {
          renderScanResult(result);
          showToast(result.message || 'Sesi keluar berhasil dicatat.');
          setTimeout(function () {
            APP.scanBusy = false;
          }, 1800);
        })
        .withFailureHandler(function (error) {
          const errorMsg = getErrorMessage(error);
          showToast(errorMsg);
          renderScanResult({
            success: false,
            resultCode: 'QR_TIDAK_VALID',
            badge: 'GAGAL MENCATAT KELUAR',
            message: errorMsg
          });
          setTimeout(function () {
            APP.scanBusy = false;
          }, 1800);
        })
        .recordGuestExit(studentId, 'Manual Petugas');
    }

    function addScanToHistoryList_(badgeText, studentName, isSuccess) {
      APP.scanHistory = APP.scanHistory || [];
      const timeStr = new Date().toLocaleTimeString('id-ID');
      APP.scanHistory.unshift({
        time: timeStr,
        badge: badgeText,
        name: studentName,
        success: isSuccess
      });
      if (APP.scanHistory.length > 5) APP.scanHistory.pop();

      const box = document.getElementById('scanner-history-box');
      const list = document.getElementById('scanner-history-list');
      if (!box || !list) return;

      box.style.display = 'block';
      let html = '';
      APP.scanHistory.forEach(function (h) {
        const color = h.success ? '#155724' : '#721c24';
        html += '<div style="padding:4px 8px;background:#fff;border-radius:6px;border:1px solid #edf0ec;display:flex;justify-content:space-between;align-items:center;">' +
          '<span><strong style="color:' + color + '">[' + escapeHtml(h.badge) + ']</strong> ' + escapeHtml(h.name) + '</span>' +
          '<span style="color:var(--muted)">' + h.time + '</span>' +
        '</div>';
      });
      list.innerHTML = html;
    }

    function handleScannedGuest(text) {
      if (!['Admin','Panitia'].includes(APP.session.role)) {
        APP.scanBusy = false;
        return showToast('Akses ditolak.');
      }

      const raw = String(text || '').trim();
      if (!raw) {
        APP.scanBusy = false;
        return showToast('Data QR kosong.');
      }

      displayScanProcessing_(raw);

      const successCallback = function (result) {
        renderScanResult(result);
        showToast(result.message || 'Pemindaian selesai.');
        setTimeout(function () {
          APP.scanBusy = false;
        }, 1800);
      };

      const failureCallback = function (error) {
        const errorMsg = getErrorMessage(error);
        renderScanResult({
          success: false,
          resultCode: 'QR_TIDAK_VALID',
          badge: 'QR TIDAK VALID',
          message: errorMsg
        });

        showToast(errorMsg);
        setTimeout(function () {
          APP.scanBusy = false;
        }, 1800);
      };

      // Alur otomatis selalu memverifikasi kedatangan / entry
      google.script.run
        .withSuccessHandler(successCallback)
        .withFailureHandler(failureCallback)
        .recordGuestEntry(raw, 'QR Code');
    }

    function submitManualGuest() {
      const input = document.getElementById('manual-guest-id');
      const val = input ? input.value.trim() : '';

      if (!val) return showToast('Masukkan NIM atau ID wisudawan terlebih dahulu.');
      if (APP.scanBusy) return;

      APP.scanBusy = true;
      handleScannedGuest(val);
    }



    /* LAPORAN */

    function renderReports() {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      document.getElementById('page-content').innerHTML =
        pageHeader('Laporan','Ekspor data untuk kebutuhan administrasi.') +
        '<div class="notice notice-info">Laporan dapat diunduh sebagai CSV dan dibuka menggunakan Excel.</div>' +
        '<div class="panel"><div class="panel-head"><h2>Ekspor data</h2></div>' +
        '<div class="panel-body"><div class="toolbar">' +
          '<button class="btn" onclick="exportReport(\'students\')">Data Wisudawan</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'calls\')">Daftar Panggil</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'seats\')">Denah Kursi</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'guests\')">Data Tamu</button>' +
          '<button class="btn btn-outline" onclick="exportReport(\'guestAttendance\')">Presensi Tamu</button>' +
        '</div><div id="report-status" class="import-status-line" style="margin-top:15px"></div></div></div>';
    }

    function exportReport(key) {
      if (APP.session.role !== 'Admin') return showToast('Akses ditolak.');

      const status = document.getElementById('report-status');
      if (!status) return;

      status.textContent = 'Menyiapkan laporan...';

      function download(data) {
        const rows = data[key] || [];
        if (!rows.length) {
          status.textContent = 'Tidak ada data untuk diekspor.';
          return;
        }

        const headers = Object.keys(rows[0]);
        const csv = [headers]
          .concat(rows.map(function (row) {
            return headers.map(function (header) { return row[header]; });
          }))
          .map(function (row) {
            return row.map(csvCell).join(',');
          }).join('\r\n');

        const blob = new Blob(['\uFEFF' + csv], {
          type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        a.href = url;
        a.download = key + '_wisuda.csv';

        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        status.textContent = 'Laporan disiapkan: ' + rows.length + ' baris.';
      }

      if (APP.reportCache) {
        download(APP.reportCache);
        return;
      }

      google.script.run
        .withSuccessHandler(function (data) {
          APP.reportCache = data;
          download(data);
        })
        .withFailureHandler(function (error) {
          status.textContent = getErrorMessage(error);
        })
        .getReportData();
    }

    function csvCell(value) {
      let text = String(value == null ? '' : value);
      if (/^[=+@]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    }

    /* TABEL DAN UTILITAS */

    function buildTable(rows, columns, actionRenderer) {
      if (!rows || !rows.length) {
        return '<div class="table-empty">Belum ada data untuk ditampilkan.</div>';
      }

      const heads = '<thead><tr>' +
        columns.map(function (column) {
          return '<th>' + escapeHtml(column[1]) + '</th>';
        }).join('') +
        (actionRenderer ? '<th>Aksi</th>' : '') +
        '</tr></thead>';

      const body = rows.map(function (row) {
        return '<tr>' +
          columns.map(function (column) {
            return '<td>' + formatCell(
              column[0],
              value(row, [column[0]])
            ) + '</td>';
          }).join('') +
          (actionRenderer ? '<td>' + actionRenderer(row) + '</td>' : '') +
          '</tr>';
      }).join('');

      return '<div class="table-wrap"><table>' +
        heads + '<tbody>' + body + '</tbody></table></div>';
    }

    function formatCell(key, val) {
      const safe = escapeHtml(val || '—');

      if (/status/i.test(key)) {
        let cls = 'badge';
        const normalized = String(val || '').toLowerCase();

        if (
          normalized.includes('sudah') ||
          normalized.includes('hadir') ||
          normalized === 'aktif'
        ) {
          cls += ' badge-green';
        } else if (
          normalized.includes('belum') ||
          normalized.includes('siap')
        ) {
          cls += ' badge-yellow';
        } else if (
          normalized.includes('nonaktif') ||
          normalized.includes('batal')
        ) {
          cls += ' badge-red';
        }

        return '<span class="' + cls + '">' + safe + '</span>';
      }

      return safe;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeJs(value) {
      return String(value == null ? '' : value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
    }

    function getErrorMessage(error) {
      return error && error.message
        ? error.message
        : String(error || 'Terjadi kesalahan.');
    }

    function showError(error) {
      showToast(getErrorMessage(error));
      console.error(error);
    }

    let toastTimer;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.add('hidden');
      }, 3500);
    }

    function logout() {
      stopScanner();
      APP.session = null;
      APP.dashboard = null;
      APP.reportCache = null;
      APP.importRows = null;
      APP.importPreview = null;
      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.logoutSession === 'function') {
        google.script.run.logoutSession();
      }
      showLanding();
    }

    // Landing page selalu menjadi halaman pertama.
    showOnly('landing-view');
</script>
